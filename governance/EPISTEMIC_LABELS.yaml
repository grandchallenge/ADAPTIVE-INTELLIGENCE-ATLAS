schema_version: "1.0.0"
standard_id: "GCL-ATLAS-EPISTEMIC-001"
labels:
  - id: "external_established"
    display: "Established Theory"
    meaning: "A result, definition, or framework supported by appropriate external mathematical/scientific literature."
    promotion_requires: "Recoverable source identity and claim scope."
  - id: "atlas_derivation"
    display: "Atlas Derivation"
    meaning: "A derivation carried out in the Atlas from stated assumptions or established inputs."
    promotion_requires: "Complete derivation or exact reconstruction; source all imported premises."
  - id: "atlas_synthesis"
    display: "Atlas Synthesis"
    meaning: "A new explanatory organization or connection assembled from supported ingredients without claiming a new theorem."
    promotion_requires: "Clear separation between sourced ingredients and Atlas interpretation."
  - id: "computational_witness"
    display: "Computational Witness"
    meaning: "A reproducible symbolic or numerical object that illustrates, tests, or locally establishes a bounded claim."
    promotion_requires: "Inputs, environment, replay identity, and claim boundary."
  - id: "observation"
    display: "Observation"
    meaning: "A directly recorded empirical or computational outcome."
    promotion_requires: "Recoverable experiment/computation identity."
  - id: "interpretation"
    display: "Interpretation"
    meaning: "An explanatory reading of results that is not itself identical to the observation."
    promotion_requires: "Explicit evidence link and alternative/failure boundary where material."
  - id: "gcl_public_evidence"
    display: "GCL Public Project Evidence"
    meaning: "A claim supported by an exact currently recoverable public GCL repository object."
    promotion_requires: "Repository, immutable revision, path/object identity, and bounded authority."
  - id: "gcl_programme_context"
    display: "GCL Programme"
    meaning: "A GCL research direction, working concept, slogan, or remembered project context not promoted to externally established or current-public implementation status."
    promotion_requires: "Explicit programme-context label; exact source gap if a claimed implementation cannot be recovered."
  - id: "hypothesis"
    display: "Hypothesis"
    meaning: "A falsifiable proposed explanation not yet established by the available evidence."
    promotion_requires: "Stated test or evidence route."
  - id: "conjecture"
    display: "Conjecture"
    meaning: "A mathematical proposition believed plausible but not proved."
    promotion_requires: "Exact statement and known evidence/counterevidence."
  - id: "open_problem"
    display: "Open Problem"
    meaning: "A precisely bounded unresolved mathematical or scientific question."
    promotion_requires: "Problem statement plus known boundary of current support."
  - id: "institutional_status"
    display: "Institutional Status"
    meaning: "A governed workflow state such as reviewed, adjudicated, certified, or released."
    promotion_requires: "Exact authority record. Institutional status does not by itself redefine mathematical truth."
non_implications:
  - "computational_witness does not imply proof"
  - "replay does not imply truth"
  - "replay does not imply independent replication"
  - "replay does not imply certification"
  - "gcl_programme_context does not imply current public implementation"
  - "institutional_status does not imply universal truth"
