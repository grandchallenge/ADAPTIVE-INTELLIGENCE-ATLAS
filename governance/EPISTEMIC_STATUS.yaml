schema_version: "1.0.0"
protocol_id: "GCL-ATLAS-EPISTEMIC-001"
status: "canonical-project-local"
labels:
  - id: "definition"
    reader_label: "Definition"
    meaning: "A stipulated mathematical or documentary object used by the Atlas."
    promotion_rule: "Definition creates terminology, not evidence that the defined object exists in nature or an external system."
  - id: "established_result"
    reader_label: "Established Result"
    meaning: "A result supported by an appropriate external scholarly or formal source."
    promotion_rule: "Must preserve hypotheses, domain and qualifications of the source."
  - id: "atlas_derivation"
    reader_label: "Atlas Derivation"
    meaning: "A derivation carried out in the Atlas from stated assumptions or prior results."
    promotion_rule: "Must be inspectable and must not be attributed externally unless independently sourced."
  - id: "computational_witness"
    reader_label: "Computational Witness"
    meaning: "A reproducible symbolic, numerical, finite-search or replay object supporting a bounded claim."
    promotion_rule: "Does not become proof or certification merely because it is exact or reproducible."
  - id: "observation"
    reader_label: "Observation"
    meaning: "An empirical or computationally observed fact under a stated experiment or run."
    promotion_rule: "Must retain dataset/run/environment scope and must not silently become a universal mechanism."
  - id: "interpretation"
    reader_label: "Interpretation"
    meaning: "A reasoned reading of established results, observations or witnesses."
    promotion_rule: "Must remain distinguishable from the underlying evidence."
  - id: "gcl_public_project_evidence"
    reader_label: "GCL Public Project Evidence"
    meaning: "A claim grounded in an exact public GCL repository object or other exact public artifact."
    promotion_rule: "Requires repository/artifact identity and may assert only what the public object supports."
  - id: "gcl_programme_context"
    reader_label: "GCL Programme"
    meaning: "A GCL research direction, hypothesis, remembered programme term or planned construction not fully source-backed as public evidence."
    promotion_rule: "May motivate research but must not be laundered into implementation or result claims."
  - id: "conjecture"
    reader_label: "Conjecture"
    meaning: "A mathematically or scientifically substantive claim proposed without sufficient proof."
    promotion_rule: "Requires explicit conjectural status until discharged."
  - id: "open_problem"
    reader_label: "Open Problem"
    meaning: "A precise unresolved question or target."
    promotion_rule: "Must not imply that a solution exists merely because a research route is proposed."
  - id: "institutional_status"
    reader_label: "Institutional Status"
    meaning: "A governed state such as reviewed, adjudicated, accepted, superseded or certified."
    promotion_rule: "Requires the exact authority record; institutional status is not a synonym for mathematical truth."
principles:
  - "Presentation does not create epistemic status."
  - "Replay does not imply truth, formal verification, independent replication or certification."
  - "A mechanism demonstrated in a toy system does not imply prevalence in frontier systems."
  - "Local mathematical bounds do not imply global safety without additional hypotheses."
  - "Project memory may motivate research but cannot substitute for source-locked public evidence."
