schema_version: "0.2.0"
entries:
  - term: "state"
    canonical_meaning: "The information-bearing object whose value evolves or is transformed."
    caution: "Do not use interchangeably with operator, parameterization, or evidence record."
  - term: "operator"
    canonical_meaning: "A transformation acting on an admissible state or function space."
    caution: "A represented matrix is not the operator independent of basis unless that distinction is explicit."
  - term: "flow"
    canonical_meaning: "A parameterized family of state transformations generated by dynamics."
  - term: "transport"
    canonical_meaning: "Movement or propagation of representation through a constrained or structured state space."
  - term: "representation"
    canonical_meaning: "An information-bearing encoding whose geometry and invariances matter to downstream computation."
  - term: "Residual"
    canonical_meaning: "Provisional GCL term for minimal transferable computational structure that survives relevant representational changes."
    status: "research_programme_term"
  - term: "boundary contract"
    canonical_meaning: "An explicit interface obligation describing admissible semantics, sensitivities, perturbations, or numerical behavior across component boundaries."
  - term: "computational witness"
    canonical_meaning: "A reproducible symbolic or numerical object that illustrates, tests, or locally establishes a bounded claim without automatically constituting proof."
  - term: "claim boundary"
    canonical_meaning: "The exact limit beyond which available evidence does not support promotion of a statement."
  - term: "optionality"
    canonical_meaning: "The structure of viable future choices preserved by a decision."
  - term: "correction capacity"
    canonical_meaning: "The ability of a system to recover, revise, or redirect after error or new evidence."
  - term: "computational polity"
    canonical_meaning: "A coordinated system of models, memories, tools, humans, validators, and governance mechanisms whose aggregate process may sustain intelligent behavior."
  - term: "source lock"
    canonical_meaning: "A provenance record binding a load-bearing claim to an identifiable source object and an explicit authority/scope statement."
    caution: "Precise identity does not make a source authoritative for claims outside its scope."
  - term: "replay"
    canonical_meaning: "An identity-bound reconstruction of a specified evidence path under stated conditions."
    caution: "Replay is not a synonym for truth, independent replication, formal verification, certification, or authority."
  - term: "certification"
    canonical_meaning: "A governed institutional status conferred by an identified authority process."
    caution: "Certification status and mathematical truth are distinct categories."
  - term: "epistemic status"
    canonical_meaning: "The declared support class of a statement or artifact, such as established result, Atlas derivation, witness, observation, programme context, conjecture, or institutional status."
    caution: "Presentation quality does not promote epistemic status."
  - term: "representation class"
    canonical_meaning: "The declared semantic class of a figure: exact, data-derived, simulation-derived, schematic, metaphorical, or historical."
    caution: "A figure may contain both literal and nonliteral elements; the manifest must say which."
notation:
  operator_norm: "Use ||A||_2 when the spectral/operator 2-norm is intended; otherwise state the norm explicitly."
  spectral_radius: "rho(A)"
  tangent_space: "T_x M"
  jacobian: "J_f(x) unless a chapter-local conflict is explicitly declared"
  transpose_or_adjoint: "Use A^top for explicitly real-matrix sections and A^* for adjoints in complex/operator-theoretic sections; state the convention when ambiguity is possible."
  jvp: "J_f(x) v"
  vjp: "J_f(x)^top u in explicitly real Euclidean sections; use the adjoint convention otherwise."
