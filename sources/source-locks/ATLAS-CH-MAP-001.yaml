epistemic_rules:
  - "A map is a navigation object, not a proof."
  - "A hard dependency authorizes downstream assumption; a soft cross-link does not."
  - "Stable chapter identity is carried by ATLAS-* IDs, not final chapter numbering or location."
  - "Presentation does not create epistemic status."
  - "A computational witness is bounded support and is not promoted to proof by reproducibility alone."
  - "Replay does not imply truth, independent replication, formal verification, or certification."
  - "Exact, data-derived, and schematic figures must be read according to their declared semantics."
  - "Allegory may expose structure but must state correspondence and limit."
