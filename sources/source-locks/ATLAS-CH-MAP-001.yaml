epistemic_rules:
  - "Project-local labels describe support class; they do not increase scientific truth by themselves."
  - "Hard prerequisites authorize downstream assumption; soft cross-links do not."
  - "Stable chapter IDs survive reordering; displayed chapter order is not the dependency graph."
  - "A computational witness supports a bounded claim and is not automatically a proof object."
  - "Figure representation class and literal/nonliteral semantics must be read before inferring quantitative meaning."
