locked_on: "2026-10-03"
epistemic_class: "established_architecture_plus_atlas_synthesis"
claim_boundary: >
  The cited sources support the original Transformer architecture, Layer Normalization,
  normalization-placement analysis, and representative encoder-only / decoder-only
  model topologies. The Atlas synthesis is the decomposition of the Transformer into
  residual-stream state, attention/MLP sublayers, masking, normalization placement,
  and readout topology so later chapters can state exactly what they modify. No claim
  is made that one Transformer variant is universally canonical or superior.
