claim_boundary: >
  The audited First-Order Optimization prerequisite supplies Euclidean-gradient update
  semantics, optimizer-state discipline, and quadratic stability language. The audited
  Geometry prerequisite supplies metric and geometric language. Nocedal and Wright (2006)
  support Newton, quasi-Newton, trust-region, and related smooth optimization machinery.
  Amari (1998) supports natural gradient under an information-geometric metric and the use
  of Fisher information in the cited learning setting. Pearlmutter (1994) supports exact
  Hessian-vector products without explicitly forming the full Hessian in the cited neural
  computation setting. Parikh and Boyd (2014) support proximal operators and proximal
  algorithms for nonsmooth/composite optimization. Atlas-owned material includes the
  finite quadratic witnesses, explicit comparison tables, and downstream synthesis.
  No source here establishes that exact Newton steps are globally convergent on arbitrary
  nonconvex objectives, that Fisher information equals the Hessian in general, that a
  quasi-Newton approximation is exact curvature, or that natural gradient is universally
  superior.

