epistemic_rules:
  - "Gradient magnitude and curvature are different local objects."
  - "For twice-differentiable objectives, the Hessian is local second-derivative structure; its sign pattern matters."
  - "A positive-definite Hessian supports a locally convex quadratic model; an indefinite Hessian can make the raw Newton direction non-descent."
  - "The Fisher information matrix is not identified with the Hessian in general."
  - "Natural gradient is metric-dependent steepest descent under the declared information-geometric metric, not generic Hessian inversion."
  - "Quasi-Newton matrices approximate curvature information through secant conditions; they are not exact Hessians by definition."
  - "Trust-region methods constrain the step within a local model-validity region; they are not equivalent to unconstrained Newton."
  - "Hessian-vector products can expose curvature action without materializing the dense Hessian."
  - "A proximal operator is an implicit optimization primitive for a declared function; it is not merely gradient clipping or weight decay."
  - "Local second-order structure does not imply a global optimum or global convergence on arbitrary nonconvex objectives."
