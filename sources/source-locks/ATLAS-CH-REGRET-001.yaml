epistemic_rules:
  - "Every regret quantity is relative to a horizon, reward/loss convention, environment class, policy class, and comparator."
  - "Pathwise mean-benchmark regret is random; under the declared stationary stochastic-bandit convention its expectation equals the chapter expected/pseudo-regret quantity. Terminology varies across literatures and must be stated explicitly."
  - "Bayesian regret averages over a declared prior; minimax regret optimizes against the worst environment in a declared class."
  - "Sublinear cumulative regret means average regret tends to zero; it does not mean zero cumulative regret."
  - "Cumulative regret and simple/final-recommendation regret answer different questions."
  - "Changing the comparator class can change regret without changing the learner's realized trajectory."
  - "Low regret does not imply safety, fairness, calibration, robustness, recoverability, or preserved future options unless those properties are explicitly part of the objective/comparator/constraints."
