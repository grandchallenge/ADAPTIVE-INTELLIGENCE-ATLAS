claim_boundary: >
  The external sources support standard stochastic/adversarial bandit regret definitions,
  finite- and asymptotic-regret analysis, Bayesian bandit formulations, minimax/worst-case
  criteria, comparator-relative regret, and the distinction between cumulative regret and
  pure-exploration/final recommendation objectives. They do not establish that low regret
  implies safety, calibration, fairness, robustness, recoverability, option preservation,
  or low simple regret under every evaluation protocol.
