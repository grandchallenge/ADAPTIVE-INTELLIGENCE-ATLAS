claim_boundary: >
  The audited COMPRESS prerequisite supplies declared-code, size-distortion,
  mechanism-separation, and retained-behavior discipline. The audited RESIDUAL
  prerequisite supplies capability-relative sufficiency, admissible recoding,
  and the distinction between semantic and operational recoverability.
  Solomonoff (1964) supports an induction framework in which shorter programs
  receive greater prior weight; it is not used as a computable practical metric.
  Blier and Ollivier (2018) provide an empirical MDL/compression analysis of deep
  learning models. Voita and Titov (2020) provide a concrete MDL probing method
  for asking how economically labels can be transmitted from learned
  representations. Schmidhuber (2009) proposes compression progress as a
  curiosity/discovery principle. The Atlas treats that last connection as a
  hypothesis and experimental design inspiration, not as a theorem that
  compression, compressibility, compression progress, discovery, understanding,
  intelligence, or mechanistic explanation are equivalent.

