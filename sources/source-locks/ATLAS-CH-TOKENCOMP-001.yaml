new_external_academic_sources: []

source_decision:
  finding: >
    No new external authority is required for the load-bearing TOKENCOMP results. TOKEN-001
    already source-locks the tokenizer mechanisms and the probability-model code-length boundary.
    TOKENCOMP's new fixed-width ID accounting, declared compute proxies, lossless translation
    condition, and finite counterexamples are exact Atlas-owned constructions.
  reopen_condition: >
    Add new external authority only if the reader introduces an empirical tokenizer performance
    claim, a hardware/runtime claim, a theorem about a specific deployed tokenizer format, or
    a universal interoperability/standardization assertion not proved by the finite constructions.

typed_objects:
  token_length: "L_tau(x)=|tau(x)|"
  vocabulary_size: "|V_tau|"
  fixed_width_id_bits: "w_tau=ceil(log2 |V_tau|) for the declared toy fixed-width code"
  fixed_width_sequence_bits: "D_fw(x;tau)=L_tau(x) w_tau"
  model_based_code_length: "ell_p(s)=-sum_i log2 p(v_i), inherited from TOKEN-001"
  pair_interaction_proxy: "C_pair(n)=n^2 under the declared toy cost model"
  dense_vocabulary_proxy: "C_vocab(n,V)=n|V| under the declared toy cost model"
  canonical_interface: "a declared byte string b in B*"
  translation: "T_{A->B}=tau_B o delta_A where the maps are defined on the declared domain"

exact_witness:
  text: "abababab"
  tokenizer_small:
    vocabulary: "[a,b]"
    vocabulary_size: 2
    tokens: "[a,b,a,b,a,b,a,b]"
    token_count: 8
    fixed_width_bits_per_id: 1
    fixed_width_sequence_bits: 8
    pair_interaction_proxy: 64
    dense_vocabulary_proxy: 16
  tokenizer_piece:
    vocabulary: "[a,b,ab,x,y,z,w,q]"
    vocabulary_size: 8
    tokens: "[ab,ab,ab,ab]"
    token_count: 4
    fixed_width_bits_per_id: 3
    fixed_width_sequence_bits: 12
    pair_interaction_proxy: 16
    dense_vocabulary_proxy: 32
  control: >
    The piece tokenizer has half the token count and one quarter the pair-interaction proxy,
    yet a larger fixed-width token-ID description length and a larger dense-vocabulary proxy.
    No scalar tokenizer optimum follows.
  interoperability: >
    Both tokenizers detokenize exactly to the same declared byte string for the witness.
    Translation by detokenize-to-canonical-bytes then retokenize is lossless on the declared
    witness domain, while token IDs and segmentation remain different.

epistemic_rules:
  - "Token count is not description length unless a code convention is declared."
  - "Vocabulary size and sequence length jointly affect fixed-width token-ID accounting."
  - "A sequence-length reduction can improve one declared compute proxy while worsening another."
  - "A compute proxy is not measured runtime or hardware cost."
  - "Lossless translation through a canonical byte/text interface does not imply semantic, probabilistic, embedding, or model-behavior equivalence."
  - "A tokenizer lingua franca is an interface proposal unless a standard/adoption claim is separately sourced."
  - "Corpus/language scope remains explicit; finite witnesses do not establish multilingual or universal optimality."
