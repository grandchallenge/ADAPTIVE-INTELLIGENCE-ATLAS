chapter_id: "ATLAS-CH-TOKENCOMP-001"
locked_on: "2026-10-07"
epistemic_class: "audited_tokenization_prerequisite_plus_atlas_exact_compression_compute_and_interoperability_witness"
claim_boundary: >
  TOKEN-001 supplies the audited tokenizer boundary map; distinctions among bytes, codepoints,
  subwords, token IDs, and embeddings; corpus-scoped fertility; probability-model description
  length; BPE/unigram/SentencePiece/byte-level mechanism boundaries; multilingual scope discipline;
  and exact Unicode, segmentation, code-length, and fertility witnesses. TOKENCOMP-001 adds
  Atlas-owned exact finite constructions connecting vocabulary size and segmentation length to
  fixed-width token-ID description length, declared compute proxies, and a canonical lossless
  interoperability interface. These constructions do not establish a universally optimal tokenizer,
  semantic equivalence between tokenizers, model-quality equivalence, a universal compute law,
  or a universal tokenizer lingua franca.

