claim_scope:
  - "The Atlas distinction among score matrix S, normalized operator A, value field V, and full nonlinear map X->Y is an explicit re-expression of the standard equations."
  - "Linearity is claimed only for V->AV when Q and K, hence A, are fixed."
  - "Kernel language is presented as a qualified interpretation, not a universal identification of every attention mechanism with a fixed positive-definite kernel."
  - "Permutation-equivariance statements exclude positional encodings and masks unless those structures are transformed consistently."
