claim_boundary: >
  The audited prerequisite chapters support one-step numerical methods, local and global
  error, stability, stiffness, splitting, residual architectures, and the bounded
  integrator lens. The external bridge sources support explicit numerical-differential-
  equation interpretations used to motivate architecture design and stability analysis.
  They do not prove that an arbitrary residual network is a discretization of one
  continuous system. The Atlas synthesis supplies the conditions under which local error,
  global error, stability, step size, and reversibility language may be transferred to
  network depth.
