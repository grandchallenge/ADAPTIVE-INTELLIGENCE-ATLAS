epistemic_rules:
  - "Residual form alone does not define a continuous differential equation."
  - "Local truncation error is meaningful only relative to a declared exact flow and numerical step."
  - "Global discretization error requires a common continuous reference and a refinement family."
  - "Numerical forward stability is distinct from optimization or training stability."
  - "Residual scaling is not automatically a time-step parameter unless the vector-field semantics are fixed."
  - "Layer count is not automatically physical or computational time."
  - "Invertibility of a layer map is distinct from time reversibility of a numerical method."
  - "A time-reversible one-step method requires the declared relation Psi_{-h}=Psi_h^{-1}."
  - "A numerical-scheme interpretation may be autonomous or nonautonomous; shared weights are not a universal requirement."
