epistemic_rules:
  - "Exact duplication, near-duplication, and semantic redundancy are distinct."
  - "Contamination rates require a declared train set, evaluation set, representation, overlap predicate, and threshold."
  - "Detected overlap does not by itself prove memorization or causal score inflation."
  - "Raw corpus proportions, post-filter proportions, and training sampling weights are distinct distributions."
  - "Synthetic provenance is a lineage property, not a universal quality verdict."
  - "Data quality is application-relative and multidimensional."
