claim_boundary: >
  The audited ATTNOP prerequisite supplies the separation among score matrix,
  positive softmax kernel, normalized mixing operator, value field, and the full
  state-dependent attention map. The audited KRYLOV prerequisite supplies
  low-dimensional operator-action and projection language while explicitly
  blocking transfer of classical iterative convergence guarantees to learned
  attention. Performer/FAVOR+ is used as a primary random-feature approximation
  source for the exponential softmax kernel; Linformer and Nystromformer are
  used as primary low-rank/landmark approximation sources; Peters et al. is used
  for alpha-entmax as a sparse alternative normalization family. The Atlas
  compares these mechanisms only after declaring the approximation target and
  error notion. Entmax is not treated as an unbiased or consistent estimator of
  softmax merely because both map scores to the simplex.

