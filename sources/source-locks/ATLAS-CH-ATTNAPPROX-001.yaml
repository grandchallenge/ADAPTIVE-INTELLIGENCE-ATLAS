sources:
  - id: "ATTNAPPROX-PERFORMER-2021"
    citation_key: "ChoromanskiEtAl2021Performer"
    kind: "peer-reviewed-conference"
    title: "Rethinking Attention with Performers"
    authors: "Krzysztof Choromanski; Valerii Likhosherstov; David Dohan; Xingyou Song; Andreea Gane; Tamas Sarlos; Peter Hawkins; Jared Davis; Afroz Mohiuddin; Lukasz Kaiser; David Belanger; Lucy Colwell; Adrian Weller"
    venue: "International Conference on Learning Representations"
    year: 2021
    arxiv_id: "2009.14794"
    url: "https://openreview.net/forum?id=Ua6zuk0WRH"
    arxiv_url: "https://arxiv.org/abs/2009.14794"
    authority: >
      Primary source for Performer and FAVOR+, which approximates softmax
      attention kernels using positive orthogonal random features and exploits
      associativity for linear-in-sequence-length attention computation under
      the declared feature dimension and implementation model.

  - id: "ATTNAPPROX-LINFORMER-2020"
    citation_key: "WangEtAl2020Linformer"
    kind: "research-preprint"
    title: "Linformer: Self-Attention with Linear Complexity"
    authors: "Sinong Wang; Belinda Z. Li; Madian Khabsa; Han Fang; Hao Ma"
    year: 2020
    arxiv_id: "2006.04768"
    url: "https://arxiv.org/abs/2006.04768"
    authority: >
      Primary source for a low-rank self-attention approximation that projects
      keys and values along the sequence dimension. Used as a representative
      learned low-dimensional projection mechanism, not as evidence that every
      trained attention matrix has uniformly low rank.

  - id: "ATTNAPPROX-NYSTROMFORMER-2021"
    citation_key: "XiongEtAl2021Nystromformer"
    kind: "peer-reviewed-conference"
    title: "Nyströmformer: A Nyström-based Algorithm for Approximating Self-Attention"
    authors: "Yunyang Xiong; Zhanpeng Zeng; Rudrasis Chakraborty; Mingxing Tan; Glenn Fung; Yin Li; Vikas Singh"
    venue: "Proceedings of the AAAI Conference on Artificial Intelligence"
    volume: 35
    issue: 16
    pages: "14138-14148"
    year: 2021
    doi: "10.1609/aaai.v35i16.17664"
    url: "https://ojs.aaai.org/index.php/AAAI/article/view/17664"
    authority: >
      Primary source for landmark/Nystrom reconstruction of the softmax
      self-attention matrix. Used as a representative structured matrix
      approximation with a declared landmark budget.

  - id: "ATTNAPPROX-ENTMAX-2019"
    citation_key: "PetersNiculaeMartins2019Entmax"
    kind: "peer-reviewed-conference"
    title: "Sparse Sequence-to-Sequence Models"
    authors: "Ben Peters; Vlad Niculae; André F. T. Martins"
    venue: "Proceedings of the 57th Annual Meeting of the Association for Computational Linguistics"
    pages: "1504-1519"
    year: 2019
    doi: "10.18653/v1/P19-1146"
    url: "https://aclanthology.org/P19-1146/"
    authority: >
      Primary source for the alpha-entmax family, including softmax and sparsemax
      as limiting/special cases and exact sparse probability mappings for alpha>1.
      Used as an alternative normalization family, not as a random-feature or
      low-rank approximation theorem.

declared_targets:
  - id: "kernel"
    object: "K_ij = exp(q_i^T k_j / sqrt(d_k)) before row normalization"
    default_error: "absolute or relative Frobenius error, with row-sum/positivity diagnostics"
  - id: "operator"
    object: "A = D(K)^(-1) K, including the declared mask/support convention"
    default_error: "spectral or Frobenius norm of A_hat-A; row-stochastic/support defects reported separately"
  - id: "output"
    object: "Y = A V for a declared value field V"
    default_error: "absolute Frobenius norm of (A_hat-A)V, optionally normalized only when ||AV||_F>0"

epistemic_rules:
  - "Kernel approximation error, normalized-operator error, and output error are distinct quantities."
  - "For fixed V, ||(A_hat-A)V||_F <= ||A_hat-A||_2 ||V||_F; small output error for one V does not imply small operator error."
  - "A kernel approximation must control row normalization/denominators before its error is promoted to a normalized-attention guarantee."
  - "Positive random features, low-rank/landmark approximation, and sparse normalization are different structures and must not be collapsed into one 'efficient attention' mechanism."
  - "Alpha-entmax with alpha>1 deliberately changes the score-to-simplex map and may create exact zeros; it is not automatically an approximation to softmax."
  - "Exact sparsity of A does not by itself remove the cost of forming dense scores; computational savings depend on how support is generated and represented."
  - "Low rank of an observed or approximated attention operator does not imply that the underlying score matrix, kernel matrix, or full state-dependent attention map has the same rank."
  - "FAVOR+/random-feature guarantees are source- and assumption-scoped; they do not transfer by analogy to arbitrary learned feature maps."
  - "Classical Krylov residual/convergence theorems do not transfer to low-rank or random-feature attention merely because both use reduced representations."
  - "Masking, positional structure, finite precision, feature dimension, landmark count, and sequence length remain explicit when making complexity or accuracy claims."
