epistemic_rules:
  - "Additive sinusoidal positional encodings and rotary positional transforms are different mechanisms and must not be conflated."
  - "For a 2D rotation block R(phi), orthogonality gives R(phi)^T R(psi)=R(psi-phi); this exact relative-position identity is algebraic."
  - "RoPE's relative-position inner-product identity does not imply universal long-context extrapolation quality."
  - "A same-offset pair can lose relative-only dependence under a non-orthogonal position transform; orthogonality/group structure is load-bearing in the exact witness."
  - "Position Interpolation and YaRN are context-extension methods with paper-scoped theoretical/empirical evidence, not universal guarantees."
  - "Frequency scaling, index interpolation, fine-tuning, and architecture changes are distinct interventions."
  - "Absolute position labels, relative offsets, and attention-content geometry are distinct objects."
  - "One-dimensional and multidimensional position require explicit coordinate/group structure; a 2D positional scheme is not justified merely by duplicating a 1D label."
  - "The downstream Relative-Position Operators chapter must independently justify operator decomposition, frequency-mode, DC-component, and head-specialization claims."
