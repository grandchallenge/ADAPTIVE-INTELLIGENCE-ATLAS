claim_boundary: >
  The external sources support representative mechanisms for interleaving reasoning
  and action, learned API use, search over reasoning states, and feedback-driven
  reflective memory. They do not establish a universal definition of an agent or
  prove that any one mechanism is necessary or sufficient for general agency.
  The Atlas formal agent loop, authority budget, and bounded-delegation contract are
  chapter-owned synthesis built on the audited Adaptive-System Thesis.
