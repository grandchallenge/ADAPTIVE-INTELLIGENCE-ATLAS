epistemic_rules:
  - "An agent is modeled here as an interaction architecture around a model, not as an anthropomorphic essence."
  - "A language model can be a component of an agent without being identical to the complete agent."
  - "Tool use changes the available transition relation; it does not guarantee that selected actions are correct."
  - "Planning and search allocate inference over candidate futures; they do not eliminate model or evaluator error."
  - "Reflection is represented as an update to state consumed by later decisions; self-description is not automatic self-correction."
  - "Delegation must carry explicit task, authority, budget, return, and stop boundaries."
  - "A child delegation does not inherit authority that was not explicitly granted."
  - "Autonomy is not treated as an unbounded permission set."
