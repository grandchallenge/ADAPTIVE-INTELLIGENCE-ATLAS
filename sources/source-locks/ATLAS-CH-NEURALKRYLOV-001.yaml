new_external_academic_sources: []

source_decision:
  finding: >
    No new external source is needed. The chapter's positive and failure witnesses are exact finite
    linear algebra derived directly. Classical Krylov and preconditioning claims are already governed
    by KRYLOV-001, while representation-transport and local-Jacobian semantics are already governed by
    TRANSPORT-001.
  reopen_condition: >
    Add a new primary source only if later drafting introduces a learned-Krylov theorem, empirical
    neural architecture claim, or convergence statement not already covered by the audited prerequisites.

declared_local_solve_interface:
  representation_state: "z"
  local_operator: "A_z"
  right_hand_side: "b_z"
  correction: "delta_z"
  local_linear_problem: "A_z delta_z = b_z"
  representation_update: "z_plus = Phi(z, delta_z)"
  warning: >
    A_z may be chosen as a local Jacobian-derived operator, normal-equation operator, Hessian-like map,
    or learned linear surrogate, but every use must name the operator explicitly. A local linear solve
    does not by itself define or approximate the global nonlinear transport map beyond the declared local regime.

positive_witness:
  original_system:
    A:
      - ["1","0"]
      - ["0","4"]
    b: ["1","1"]
    exact_solution: ["1","1/4"]
  preconditioner:
    type: "fixed left"
    M:
      - ["1","0"]
      - ["0","2"]
    inverse:
      - ["1","0"]
      - ["0","1/2"]
  transformed_system:
    B_equals_M_inverse_A:
      - ["1","0"]
      - ["0","2"]
    c_equals_M_inverse_b: ["1","1/2"]
  krylov:
    K1: "span{c}"
    best_K1_transformed_residual_scalar: "alpha=3/4"
    x1: ["3/4","3/8"]
    transformed_residual: ["1/4","-1/4"]
    transformed_residual_norm_squared: "1/8"
    original_residual: ["1/4","-1/2"]
    original_residual_norm_squared: "5/16"
    true_error_xstar_minus_x1: ["1/4","-1/8"]
    true_error_norm_squared: "5/64"
    K2: "span{c,Bc}=R^2"
    determinant_of_basis_matrix: "1/2"
    exact_solution_expansion: "x_star=(3/2)c-(1/2)Bc"
    K2_residual_norm_squared: "0"
    K2_true_error_norm_squared: "0"
  task_readout_control:
    w: ["1","2"]
    exact_readout_on_xstar: "3/2"
    readout_on_x1: "3/2"
    lesson: >
      The one-step representation/solution is still wrong and has nonzero residual, yet this declared
      downstream scalar readout is exactly correct. Residual, state error, representation quality, and task
      quality therefore cannot be identified without an explicit interface theorem.

failure_control:
  operator:
    B_bad:
      - ["1","0"]
      - ["0","10"]
    c_bad: ["1","1"]
  K1: "span{c_bad}"
  best_K1_scalar: "alpha=11/101"
  residual: ["90/101","-9/101"]
  residual_norm_squared: "81/101"
  lesson: >
    A one-dimensional Krylov space is computationally small but can still yield a poor one-step approximation.
    Low subspace dimension alone does not guarantee small residual, small true error, representation quality,
    or downstream task quality.

preconditioner_rules:
  - "The positive witness uses a fixed linear left preconditioner M."
  - "Left preconditioning means solving M^{-1}A x = M^{-1}b; original and transformed residuals are different objects."
  - "A learned, state-dependent, right, flexible, or nonlinear preconditioner would require separate semantics and guarantees."
  - "Preconditioning changes the effective operator seen by the Krylov process."

epistemic_rules:
  - "Every Krylov construction must name its linear operator and starting residual/vector."
  - "A local Jacobian or surrogate operator is not the global nonlinear transport map."
  - "Classical Krylov convergence does not transfer to a learned nonlinear transport architecture by analogy."
  - "Residual norm and true error are distinct."
  - "Transformed/preconditioned residual and original-system residual are distinct."
  - "Representation error/quality and downstream task quality are distinct from linear-solve residual."
  - "Low Krylov dimension alone is not a convergence certificate."
  - "Exact-arithmetic basis identities do not imply finite-precision orthogonality."
  - "Restarting or truncating a learned iterative mechanism can discard useful directions."
