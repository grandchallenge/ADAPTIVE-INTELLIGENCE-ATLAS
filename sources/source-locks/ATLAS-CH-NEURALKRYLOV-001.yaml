claim_boundary: >
  KRYLOV-001 is the sole external/classical authority for Krylov subspaces, projected solves,
  residual/error distinctions, preconditioning semantics, matrix-free operator access, restart and
  finite-precision caveats. TRANSPORT-001 is the sole representation-side authority for finite
  learned state maps, local Jacobians, base-point semantics, constraints, and discrete-versus-flow
  distinctions. The new positive/control witnesses in NEURALKRYLOV-001 are Atlas-owned exact finite
  linear algebra. No new external academic source is required unless later drafting introduces a
  theorem beyond those audited prerequisites. No classical Krylov convergence theorem is transferred
  to a learned nonlinear transport mechanism by analogy.

