epistemic_rules:
  - "Successful replay establishes reconstructability of the replayed computation under the stated identity and environment, not truth of an arbitrary surrounding claim."
  - "Internal replay is not independent replication or independent review."
  - "Formal verification is only as strong as the formalized statement and trust base."
  - "Certification is a governed authority transition, not a synonym for reproducibility."
