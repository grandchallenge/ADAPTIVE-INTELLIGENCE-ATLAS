claim_boundary: >
  Lie-Trotter and Strang splitting, commutator-controlled local error, and
  structure-preserving composition are established numerical-analysis ideas in
  the cited splitting references. Transformer residual-stream anatomy and
  attention/FFN block structure are established by the audited Transformer
  prerequisite. The Atlas-owned contribution here is the bounded synthesis:
  treating ordered neural sublayer composition as a split-operator design
  degree of freedom. No claim is made that arbitrary learned nonlinear blocks
  inherit classical splitting order, exact flows, reversibility, symplecticity,
  or convergence without separately established assumptions.
