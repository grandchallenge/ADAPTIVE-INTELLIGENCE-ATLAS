epistemic_rules:
  - "A neural residual block is not automatically the exact flow of a differential operator."
  - "For noncommuting operators, order matters; the first commutator is the leading Lie-order asymmetry in the declared smooth finite-dimensional setting."
  - "First-order Lie-Trotter and second-order Strang claims apply only under the regularity/domain assumptions required by classical splitting theory."
  - "A symmetric composition is not thereby exactly invertible when its learned submaps are not exact invertible flows."
  - "Splitting/discretization error is distinct from approximation, estimation, optimization, and implementation error."
  - "Layer-varying learned suboperators require a nonautonomous interpretation; autonomous shared-operator formulas may not be silently reused."
  - "Commuting controls show disappearance of order dependence in the bounded exact witness; they do not imply neural sublayers commute in practice."
