epistemic_rules:
  - "Data, tensor, pipeline, and expert parallelism are separately typed transformations and may be composed only after their state partition and synchronization semantics are declared."
  - "Collective semantics describe what values must be combined or redistributed; a collective algorithm and its topology mapping are additional implementation choices."
  - "Model FLOPs, local arithmetic work, bytes moved, cross-cut bytes, collective steps, memory footprint, latency, throughput, utilization, and tail latency are distinct quantities."
  - "Equal arithmetic work does not imply equal communication cost or equal latency."
  - "Training throughput and scaling efficiency do not determine serving latency, goodput, KV-cache pressure, or tail behavior."
  - "MoE router preference, accepted dispatch, expert placement, and physical network path remain distinct."
  - "Modeled lower bounds and accounting witnesses are not measured hardware performance."
  - "A measured result is scoped to its model, hardware, software, workload, topology, scheduler, and metric definition."
