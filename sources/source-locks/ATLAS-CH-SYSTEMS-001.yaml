epistemic_class: "audited_hardware_and_moe_prerequisites_plus_primary_distributed_training_and_serving_sources_plus_atlas_exact_communication_witness"
claim_boundary: >
  HARDWARE-001 supplies the audited single-device distinctions among FLOPs, bytes, bandwidth,
  latency, throughput, utilization, precision, and measured versus modeled performance.
  MOE-001 supplies audited router-preference, accepted-dispatch, expert-placement, capacity,
  communication-proxy, and straggler boundaries. SYSTEMS-001 adds typed data, tensor, pipeline,
  and expert parallelism; explicit collective/topology accounting; training-versus-serving
  distinctions; KV-cache and request-scheduling boundaries; and an Atlas-owned exact finite
  placement/communication witness. The external systems sources establish representative
  mechanisms and measured systems results in their stated settings. They do not establish one
  universally optimal parallelism mix, topology, batch policy, placement, collective algorithm,
  serving scheduler, or scaling-efficiency law.

