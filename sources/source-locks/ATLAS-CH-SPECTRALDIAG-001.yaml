claim_boundary: >
  The audited NONNORMAL chapter supplies matrix-analysis, transient-growth, resolvent, and pseudospectral authority. The audited MECHDIAG packet supplies the distinction between readable/descriptive diagnostics and functional or mechanistic evidence. Mezić 2005 is added only for the linear Koopman-operator view of nonlinear dynamics through observables. Atlas-owned exact finite witnesses separate eigenvalue, singular-value, local-Jacobian, Hessian, interface-response, and functional claims. No spectral signature is treated as a universal scalar diagnostic or as causal evidence by itself.

