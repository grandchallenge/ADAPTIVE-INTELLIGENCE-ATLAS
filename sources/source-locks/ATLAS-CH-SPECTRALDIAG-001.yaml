sources:
  - id: "SPECTRALDIAG-MEZIC-2005"
    kind: "peer-reviewed-journal"
    title: "Spectral Properties of Dynamical Systems, Model Reduction and Decompositions"
    author: "Igor Mezić"
    journal: "Nonlinear Dynamics"
    volume: 41
    pages: "309--325"
    year: 2005
    doi: "10.1007/s11071-005-2824-x"
    url: "https://doi.org/10.1007/s11071-005-2824-x"
    authority: >
      Primary authority for using a linear Koopman operator acting on observables to study spectral properties of nonlinear dynamical systems. It is not authority that a finite learned approximation recovers the true Koopman spectrum or that Koopman modes constitute a causal mechanism.

epistemic_rules:
  - "Every spectrum is attached to an explicitly named operator, matrix, Jacobian, Hessian, empirical transition object, or observable-space operator."
  - "Eigenvalues, singular values, pseudospectra/resolvent diagnostics, and local linearization spectra are distinct objects."
  - "Equal eigenvalue multisets do not imply equal finite-horizon response for non-normal operators."
  - "Equal singular-value multisets do not determine orientation relative to a fixed input/readout interface."
  - "A Jacobian spectrum at one reference state does not determine the global nonlinear map."
  - "A Hessian spectrum does not determine gradient, stationarity, basin geometry, or optimization trajectory by itself."
  - "Koopman spectra are spectra of an operator on a declared observable space; they are not the Jacobian spectrum of the state map by definition."
  - "Spectral correlation or predictive utility is descriptive/predictive evidence, not functional necessity or causal mechanism."
  - "Mechanistic significance requires an intervention, ablation, substitution, recovery, or equivalently typed functional test."
  - "Empirical spectral estimates remain subject to finite precision, sampling, conditioning, truncation, and operator-estimation error."
