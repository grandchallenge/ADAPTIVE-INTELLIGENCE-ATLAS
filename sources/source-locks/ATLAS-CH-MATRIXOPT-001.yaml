claim_boundary: >
  The audited Linear Algebra prerequisite supplies SVD, singular values, operator/Frobenius norms,
  conditioning, low-rank structure, and rectangular-matrix language. The audited Curvature and
  Second-Order Structure prerequisite supplies preconditioning, metric dependence, exact-versus-
  approximate curvature distinctions, and optimizer-state discipline. Gupta, Koren, and Singer
  (2018) support Shampoo's tensor-structured accumulated preconditioners and its stochastic-convex
  convergence claims only in the paper's stated setting. Higham (1986) supports full-rank polar
  decomposition, the nearest-unitary/semi-orthogonal interpretation, and Newton-type numerical
  computation of the polar factor. Bernstein and Newhouse (2024) support the first-order norm/
  steepest-descent interpretation of accumulation-free Shampoo-like updates. Jordan et al. (2024)
  are the primary design source for Muon as momentum followed by a finite Newton-Schulz
  orthogonalization transform on two-dimensional hidden-layer parameters. Atlas-owned material
  includes the exact 3x2 rectangular witness, the rank-deficiency observation for one-step left/right
  Shampoo statistics, and the explicit separations among diagonal scaling, accumulated matrix
  preconditioning, exact polar factors, finite iterative orthogonalization, and hard manifold
  constraints. No source here establishes universal optimizer superiority, universal deep-network
  convergence, equivalence to a full Hessian method, or that exact singular-value flattening is always
  desirable.

