epistemic_rules:
  - "Matrix preconditioning is not identical to full-Hessian curvature."
  - "Accumulated Shampoo statistics are optimizer state; an instantaneous matrix transform is not the full optimizer."
  - "For a rectangular full-rank matrix, the polar factor is semi-orthogonal: only one of Q^T Q or QQ^T can be identity unless the matrix is square."
  - "Exact polar orthogonalization sets the nonzero singular values of the polar factor to one; finite Newton-Schulz implementations only approximate a chosen singular-value map."
  - "A one-step Gram statistic GG^T is singular whenever G is m x n with m>n; G^T G is singular whenever n>m. Regularization or accumulated history matters."
  - "Different norm balls define different steepest directions; objective decrease values across different balls are not directly comparable as optimizer quality."
  - "Diagonal scaling, matrix preconditioning, polar orthogonalization, spectral shaping, and manifold constraints are distinct operations."
  - "No empirical superiority claim is promoted beyond the setting of its cited source."
