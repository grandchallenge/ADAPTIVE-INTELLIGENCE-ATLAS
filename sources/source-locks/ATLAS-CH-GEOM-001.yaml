claim_boundary: >
  These sources support the standard sphere, Stiefel, Grassmann, retraction, geodesic and SLERP mathematics used by the chapter. They do not establish that a particular learned representation empirically lies on one of these manifolds.

claim_scope:
  - "Sphere tangent-space and normalized-retraction derivations are rederived in the Atlas."
  - "Stiefel tangent-space condition is rederived from the orthogonality constraint."
  - "Grassmann quotient interpretation is source-backed and re-expressed in Atlas notation."
  - "SLERP is derived for unit vectors; Shoemake is used for historical attribution, not as the sole geometry reference."
