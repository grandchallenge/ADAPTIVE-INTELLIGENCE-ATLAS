claim_boundary: >
  Continuous/discrete dynamical-systems definitions, local linearization criteria,
  Lyapunov stability results, pitchfork bifurcation analysis, and Hamiltonian/symplectic
  structure are established mathematics in the cited references under their stated
  assumptions. The Atlas applications to neural computation, training, adaptive depth,
  and computational time are interpretations and downstream research uses, not results
  supplied by those references.
sources:
  - id: "DYN-STROGATZ-2015"
    citation_key: "Strogatz2015"
    kind: "monograph"
    title: "Nonlinear Dynamics and Chaos"
    edition: 2
    year: 2015
    authority: >
      Standard source for autonomous flows, fixed points, local stability,
      phase portraits, one-dimensional bifurcations, and qualitative dynamical reasoning.
  - id: "DYN-KHALIL-2002"
    citation_key: "Khalil2002"
    kind: "monograph"
    title: "Nonlinear Systems"
    edition: 3
    year: 2002
    authority: >
      Standard source for nonlinear stability, Lyapunov functions, local linearization,
      and asymptotic-stability conditions.
  - id: "DYN-HAIRER-LUBICH-WANNER-2006"
    citation_key: "HairerLubichWanner2006"
    kind: "monograph"
    title: "Geometric Numerical Integration"
    edition: 2
    year: 2006
    authority: >
      Standard source for Hamiltonian systems, symplectic structure, symplectic flows,
      and the geometric viewpoint needed before later numerical-integrator chapters.
