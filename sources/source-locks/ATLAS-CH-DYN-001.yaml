epistemic_rules:
  - "Linearization gives local information; it is not a global nonlinear theorem."
  - "Lyapunov stability, asymptotic stability, and exponential stability are distinct."
  - "A phase portrait or bifurcation normal form is a model of local qualitative structure, not a claim that every ML system follows that normal form."
  - "Hamiltonian/symplectic structure is used only when the required equations and two-form are actually present."
  - "Continuous-time dynamics and numerical discretizations are separate objects; later Numerics chapters analyze the gap."
