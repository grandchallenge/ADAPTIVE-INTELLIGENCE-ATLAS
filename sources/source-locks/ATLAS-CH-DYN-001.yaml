epistemic_rules:
  - "Linearization conclusions are local and require hyperbolicity/nonzero stability margins for decisive first-order classification."
  - "Zero or purely imaginary linearized eigenvalues are generally inconclusive for nonlinear stability."
  - "A Lyapunov function proves only the stability property justified by its declared sign and regularity conditions."
  - "Bifurcation examples are calibration systems, not universal models of neural training."
  - "Hamiltonian/symplectic structure is not assumed for generic neural or optimizer dynamics."
  - "Numerical integrator stability and splitting accuracy are deferred to later chapters."
