claim_boundary: >
  Ordinary differential equations, local stability, Lyapunov theory, bifurcation
  normal forms, Hamiltonian systems, and symplectic structure are externally
  established in the cited references. The Atlas-specific synthesis is the use of
  this substrate to reinterpret depth, optimization, recurrent computation, and
  later numerical chapters. No claim is made that every neural network is literally
  generated by an autonomous ODE or Hamiltonian flow.
