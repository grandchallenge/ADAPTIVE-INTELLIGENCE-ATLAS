claim_boundary: >
  The external sources support standard Markov decision-process, dynamic-programming,
  temporal-difference/control, policy-gradient, model-based RL, and POMDP mechanisms.
  They do not establish that scalar reward is identical to human value, that optimality
  under a declared model is universal optimality, or that any one RL algorithm is
  universally preferred. The Atlas synthesis is the explicit separation of environment,
  policy, reward, value, uncertainty, planning, and approximation boundaries.
