epistemic_rules:
  - "Reward is a modeled scalar signal, not a synonym for human value."
  - "Value is an expectation under a declared policy and environment model."
  - "Optimality is always relative to the declared state, action, reward, transition, horizon/discount, and observability model."
  - "A Bellman equation is an exact identity for its declared process; approximate function learning is a separate claim."
  - "Model-free does not mean assumption-free."
  - "Off-policy learning changes the relationship between behavior distribution and target policy; convergence claims retain their source assumptions."
  - "Partial observability makes belief or memory state part of the control problem."
  - "Planning with a learned model inherits model error."
