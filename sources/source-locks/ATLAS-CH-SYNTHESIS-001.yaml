new_external_academic_sources: []

source_decision:
  finding: >
    No new external authority is needed for the load-bearing synthesis. FRONTIER-001 and POLITY-001
    already source-lock the research-programme, distributed-cognition, joint-activity, coordination,
    shared-memory, evidence, and governance concepts consumed here. The new system-composition witness
    is exact finite Atlas-owned logic.
  reopen_condition: >
    Add new external authority only if the manuscript introduces a theorem or empirical systems claim
    not already covered by the audited prerequisites.

status_grammar:
  - "AUDIT_BOUND_SUBSTRATE"
  - "DRAFT_SUBSTRATE"
  - "BOUNDED_EVIDENCE"
  - "ARCHITECTURE_STAGE"
  - "OPEN_PROOF_OBLIGATION"
  - "OPEN_EXPERIMENT_OBLIGATION"
  - "CONJECTURAL_CONNECTION"

typed_synthesis_object:
  notation: "Sigma=(X,D,M,T,C,E,A,G,Q,K)"
  fields:
    X: "model/representation states and component-local private state"
    D: "declared dynamics/update laws"
    M: "persistent/shared memory with provenance/version/status semantics"
    T: "tools and external services"
    C: "coordination, routing, communication, and composition rules"
    E: "evidence objects, validation rules, and replayable checks"
    A: "adaptation/update mechanisms and their authority scope"
    G: "governance and authorization constraints"
    Q: "task set/distribution and success contract"
    K: "heterogeneous resource/cost vector"
  rule: >
    These coordinates are typed objects and are not assumed to share one vector space, one optimizer,
    one timescale, or one authority model.

exact_composition_witness:
  tasks: "[alpha,beta]"
  target_answer:
    alpha: 1
    beta: 1
  specialists:
    A_alpha:
      alpha: 1
      beta: 0
    A_beta:
      alpha: 0
      beta: 1
  router:
    alpha: "A_alpha"
    beta: "A_beta"
  candidate_record: "(q,y,source)"
  validator_rule: "accept iff y=1 and source equals the declared specialist for q"
  governance_rule: "commit iff validator_accept=true"
  committed_record: "(q,y,source,status=validated)"
  memory_semantics: "persistent shared map keyed by q"
  success_contract:
    - "returned answer y=1"
    - "candidate source matches declared routed specialist"
    - "validator accepts"
    - "governance authorizes commit"
    - "validated record is durably present in shared memory"
    - "later recall returns the committed y with validated status"
  full_composition:
    task_accuracy: "2/2"
    validated_commit_coverage: "2/2"
    persistent_recall_coverage: "2/2"
    unauthorized_commits: 0

ablations:
  broken_router:
    mapping:
      alpha: "A_alpha"
      beta: "A_alpha"
    result: >
      beta receives y=0, validator rejects, and only alpha succeeds; task and committed coverage fall to 1/2.
  remove_validator_keep_governance:
    result: >
      Candidates can still be produced, but the unchanged governance rule has no validation evidence and
      authorizes no commit; answer accuracy can remain 2/2 while validated committed coverage is 0/2.
  remove_shared_memory:
    result: >
      Correct answers, validation, and authorization may occur transiently, but persistent recall coverage is 0/2.
  remove_governance_gate:
    bad_candidate: "(beta,1,A_alpha)"
    validator_result: "reject"
    result: >
      If commit bypasses the governance gate, the rejected bad-source candidate can be written, producing
      one unauthorized commit. Correct-looking content is therefore not equivalent to authorized state transition.

epistemic_rules:
  - "System capability must be demonstrated under a declared composition, not inferred from component count."
  - "Capability, authority, evidence, governance, and resource cost are distinct objects."
  - "A validator can reduce a declared error class without becoming an oracle."
  - "Shared memory can preserve accepted state without making stored content automatically true or current."
  - "Open proof/experiment obligations remain open until independently discharged."
  - "A successful finite composition witness does not establish a universal architecture of intelligence."
  - "Distributed composition may improve one declared capability while increasing coordination cost and failure surface."
