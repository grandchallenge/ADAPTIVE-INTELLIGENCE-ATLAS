locked_on: "2026-10-07"
epistemic_class: "audited_frontier_and_computational_polity_prerequisites_plus_atlas_exact_system_composition_witness"
claim_boundary: >
  FRONTIER-001 supplies the programme-status grammar and the obligation to preserve open research items
  as open. POLITY-001 supplies the system-level composition object, private/shared-state separation,
  capability-versus-authority distinction, candidate/validation/commit decomposition, heterogeneous
  cost bookkeeping, and exact two-specialist routing witness. SYNTHESIS-001 adds an Atlas-owned typed
  systems object covering model/representation, dynamics, memory, tools, coordination, evidence,
  adaptation, governance, task contract, and cost; and an exact finite composition witness that
  combines routing, validation, authorized commit, and persistent shared recall. No new external
  academic source is required. The chapter does not claim one universal architecture of intelligence,
  that distributed systems are always superior to monolithic models, or that open programme items are solved.

