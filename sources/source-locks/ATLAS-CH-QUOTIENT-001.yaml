epistemic_rules:
  - "Parameter equality is stronger than functional equality."
  - "A quotient requires an explicit equivalence relation or group action."
  - "Permutation and positive-rescaling symmetries are exact only under their stated architectural/activation assumptions."
  - "Quotienting removes declared redundancy; it does not automatically make optimization convex, well-conditioned, or globally simple."
