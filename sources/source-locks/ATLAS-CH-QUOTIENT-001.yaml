claim_boundary: >
  Standard quotient-space/manifold geometry and Grassmann quotient structure are
  externally established. Neural-network permutation and positive-rescaling symmetries
  are supported by the cited literature and independently rederived for simple feedforward
  ReLU networks. The stronger proposition that quotienting generally simplifies learning
  landscapes or improves optimization is presented only as an Atlas/GCL research question.
