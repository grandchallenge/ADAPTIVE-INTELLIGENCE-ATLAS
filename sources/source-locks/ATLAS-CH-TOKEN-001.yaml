epistemic_class: "audited_information_and_representation_prerequisites_plus_primary_tokenization_sources_plus_atlas_synthesis"
claim_boundary: >
  The audited Information prerequisite supplies entropy, cross-entropy, KL, mutual information,
  sufficient-statistic, and probability-model discipline; these quantities are not semantic meaning.
  The audited Representation prerequisite supplies the distinction among representation, coordinates,
  semantics, invariance/equivariance, and recoding. Sennrich et al. (2016) are used as a primary
  precedent for BPE-style subword units in NMT. Kudo (2018) is used for unigram-language-model
  subword segmentation and segmentation sampling; Kudo and Richardson (2018) are used for raw-text,
  language-independent SentencePiece tokenization. Xue et al. (2022) are used for byte-level modeling
  and its sequence-length/compute trade-offs. Rust et al. (2021) are used for controlled evidence that
  tokenizer adequacy differs across languages and can affect multilingual downstream performance.
  Atlas-owned material defines tokenization as a boundary map, exact fertility/length measures,
  a finite segmentation-ambiguity witness, a byte-vs-codepoint counterexample, and morphology-boundary
  diagnostics. No source establishes a universally optimal tokenizer, that shorter sequences are always
  better, that morphological alignment is necessary or sufficient for model quality, or that fertility
  alone explains multilingual performance.

