epistemic_rules:
  - "Token IDs and embeddings are representations, not semantics."
  - "Token length, byte length, codepoint length, fertility, compression, and model compute are distinct quantities."
  - "BPE, unigram segmentation, and byte-level encoding optimize or remove different boundary choices; they are not interchangeable algorithms."
  - "Segmentation can be non-unique under a fixed vocabulary."
  - "Morphological boundary alignment is a diagnostic relative to a declared analysis, not a universal objective."
  - "Cross-language fertility comparisons require a declared normalization unit and corpus."
  - "A tokenizer can improve one resource or task trade-off while worsening another."
