claim_boundary: >
  The audited RPO prerequisite supplies typed relative-position operators, sequence-index Fourier/DC
  decomposition, truncation language, and the explicit boundary between observed position and latent time.
  The audited Dynamics prerequisite supplies state/trajectory/flow distinctions and the local/global boundary
  for continuous-time reasoning. Sakoe and Chiba (1978) are used as primary authority for dynamic-programming
  time normalization / dynamic time warping and warping constraints. Zhou and De la Torre (2012) are used as
  primary authority for multimodal temporal alignment with generalized time warping. Atlas-owned material defines
  the exact finite witness, its unique optimal path, identity/no-warp control, and the epistemic distinction between
  an inferred alignment coordinate and a true physical or causal clock. No source is claimed to prove that a
  low-cost alignment reveals uniquely true latent time or that a discrete warping path is itself a continuous-time flow.

