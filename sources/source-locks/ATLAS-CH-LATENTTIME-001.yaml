exact_witness_contract:
  sequence_x: "[0,1,2]"
  sequence_y: "[0,0,1,2]"
  local_cost: "c(i,j)=(x_i-y_j)^2"
  path_constraints:
    start: "(1,1)"
    end: "(3,4)"
    local_steps:
      - "(1,0)"
      - "(0,1)"
      - "(1,1)"
    monotonicity: "indices never decrease"
  exhaustive_path_count: 25
  unique_optimal_path:
    - "(1,1)"
    - "(1,2)"
    - "(2,3)"
    - "(3,4)"
  optimal_cost: 0
  interpretation: >
    Observed sequence index in Y is not identical to the inferred aligned latent-phase coordinate:
    Y indices 1 and 2 both align to X index 1, while later Y indices align to X indices 2 and 3.
    This establishes only an optimal alignment under the declared cost and path constraints.

identity_control:
  sequence_x: "[0,1,2]"
  sequence_y: "[0,1,2]"
  exhaustive_path_count: 13
  unique_optimal_path:
    - "(1,1)"
    - "(2,2)"
    - "(3,3)"
  optimal_cost: 0
  interpretation: "When observed indices already match the phase sequence, the exact optimum is the no-warp diagonal."

epistemic_rules:
  - "Observed sequence index is not automatically latent time."
  - "A low-cost or unique optimal warping path is optimal only relative to the declared observations, local cost, and admissible path constraints."
  - "Alignment quality does not prove a uniquely true physical, biological, or causal clock."
  - "Relative-position periodicity or Fourier structure does not by itself identify latent time."
  - "A discrete warping path is a combinatorial alignment object, not automatically a continuous-time trajectory or flow."
  - "Multimodal alignment may require modality-specific representation or weighting; raw feature-space equality is not assumed."
  - "Identity/no-warp behavior must remain an explicit control."
