epistemic_rules:
  - "The Euclidean gradient and Riemannian gradient are metric-dependent objects."
  - "For an embedded manifold with induced Euclidean metric, the Riemannian gradient is the tangent projection of the ambient Euclidean gradient."
  - "A tangent direction is only a local legal velocity; x + xi need not lie on the manifold."
  - "A retraction returns tangent data to the manifold and agrees with the identity to first order at the origin; it need not equal the exponential map."
  - "Constraint preservation does not imply descent, convergence, or global optimality."
  - "A stationary point on a manifold need not be globally optimal."
  - "Sphere and Stiefel manifolds have different tangent constraints; Stiefel columns satisfy X^T X = I."
  - "Orthogonality preservation alone does not establish optimizer quality."
  - "Vector transport between tangent spaces is distinct from simply reusing ambient coordinates."
  - "Generic manifold optimization is not identical to any GCL-specific normalized, Stiefel, Muon, or MODULUS optimizer programme."
