claim_boundary: >
  The audited Geometry prerequisite supplies tangent spaces, sphere/Stiefel constraints,
  geodesic/exponential-map language, normalized sphere retraction, and quotient distinctions.
  The audited First-Order Optimization prerequisite supplies Euclidean gradient/steepest
  descent, step-size, stochastic, and optimizer-state distinctions. Absil, Mahony, and
  Sepulchre (2008) support standard matrix-manifold optimization definitions including
  tangent vectors, retractions, Riemannian gradients, and optimization algorithms on
  embedded/matrix manifolds. Edelman, Arias, and Smith (1998) support the geometry and
  algorithmic treatment of Stiefel/Grassmann orthogonality constraints. Atlas-owned
  material includes the exact finite sphere and O(2)/Stiefel witnesses and the explicit
  separation between constraint preservation, retraction accuracy, stationarity, and
  global optimality. No source here establishes that manifold optimization is universally
  superior to unconstrained parameterization or that preserving orthogonality alone
  guarantees good optimization.

