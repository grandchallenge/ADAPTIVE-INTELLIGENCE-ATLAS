claim_boundary: >
  Gradient descent, stochastic approximation, momentum, adaptive coordinate scaling,
  gradient clipping, and variance-oriented initialization are externally established
  in the cited settings. The chapter is a baseline synthesis for later Atlas
  optimization chapters. It does not claim that Adam, momentum, clipping, warmup, or
  any initialization rule is universally optimal; nor does it identify coupled L2
  regularization with decoupled weight decay under adaptive preconditioning.
