epistemic_rules:
  - "Gradient descent stability on a quadratic is objective- and spectrum-dependent."
  - "An unbiased stochastic gradient can still have high variance."
  - "Gradient clipping changes the estimator and is not treated as unbiased."
  - "Adaptive scaling changes the geometry of an update and breaks the general equivalence between coupled L2 regularization and decoupled weight decay."
  - "Initialization variance calculations depend on explicit independence/distribution approximations."
  - "Warmup and schedule examples are practices/recipes, not universal convergence theorems."
