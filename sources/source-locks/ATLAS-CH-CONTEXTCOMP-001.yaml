claim_boundary: >
  This chapter inherits only the audited External-Memory Thesis interface:
  hybrid parametric/external placement, versioned records, explicit freshness
  policy, retrieval/storage/use separation, provenance-preserving record
  semantics, access-control boundaries, and the fact that external memory is
  not automatically fresh, correct, complete, or safe. CONTEXTCOMP adds an
  Atlas-owned finite compilation formalism for turning a retrieved candidate
  set into a bounded ordered working context under declared freshness,
  authorization, mandatory-record, atomic-record, cost, and serialization
  rules. The exact finite witness establishes properties of that declared
  compiler only. It does not prove that one prompt/context selection policy is
  universally optimal, that the declared utility scores equal model usefulness,
  that retrieval rank equals truth/relevance, or that compiled context guarantees
  correct downstream model behavior.

