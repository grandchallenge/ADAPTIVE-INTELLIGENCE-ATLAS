claim_boundary: >
  This chapter develops a placement thesis for knowledge between model parameters and explicit
  persistent memory. The audited prerequisites support retrieval semantics, provenance boundaries,
  sequential interference, replay, consolidation, and parameter isolation. External primary examples
  support explicit non-parametric datastores and direct factual parameter editing. They do not prove
  that external memory is universally superior, that all factual knowledge should leave parameters,
  or that one placement policy is optimal across latency, privacy, security, and reliability regimes.
