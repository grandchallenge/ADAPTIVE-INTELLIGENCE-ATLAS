sources:
  - id: "EXTMEM-LEWIS-2020-RAG"
    kind: "peer-reviewed-conference"
    title: "Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks"
    authors: "Patrick Lewis et al."
    venue: "Advances in Neural Information Processing Systems 33"
    year: 2020
    arxiv_id: "2005.11401"
    authority: >
      Primary example combining parametric memory with a dense non-parametric Wikipedia index,
      motivated partly by provenance and world-knowledge update limitations of parameter-only models.
  - id: "EXTMEM-KHANDELWAL-2020-KNNLM"
    kind: "peer-reviewed-conference"
    title: "Generalization through Memorization: Nearest Neighbor Language Models"
    authors: "Urvashi Khandelwal; Omer Levy; Dan Jurafsky; Luke Zettlemoyer; Mike Lewis"
    venue: "International Conference on Learning Representations"
    year: 2020
    arxiv_id: "1911.00172"
    authority: >
      Primary example where a nearest-neighbor datastore augments a frozen language model and can be
      changed for domain adaptation without further model training in the reported experiments.
  - id: "EXTMEM-BORGEAUD-2022-RETRO"
    kind: "peer-reviewed-conference"
    title: "Improving language models by retrieving from trillions of tokens"
    authors: "Sebastian Borgeaud et al."
    venue: "International Conference on Machine Learning"
    year: 2022
    arxiv_id: "2112.04426"
    authority: >
      Primary large-scale example of explicit retrieved memory complementing model parameters.
  - id: "EXTMEM-MENG-2022-ROME"
    kind: "peer-reviewed-conference"
    title: "Locating and Editing Factual Associations in GPT"
    authors: "Kevin Meng; David Bau; Alex Andonian; Yonatan Belinkov"
    venue: "Advances in Neural Information Processing Systems"
    year: 2022
    arxiv_id: "2202.05262"
    authority: >
      Primary counterexample to any claim that factual updates must be external: direct parameter
      editing can update specific factual associations in the reported setting.
epistemic_rules:
  - "External memory is a locus choice, not automatically a persistence or correctness guarantee."
  - "Retrievability, provenance, mutability, sharing, latency, privacy, and access control are distinct coordinates."
  - "A mutable fact can be externalized without implying that generalizable structure should also be externalized."
  - "Parameter updates can preserve or damage earlier behavior depending on representation and method; parameter change alone is not forgetting."
  - "External updates can be local at the record level while stale caches, bad retrieval, poisoning, or synchronization failures can still return wrong information."
  - "External memory can preserve explicit record provenance; model parameters do not by themselves constitute per-fact source records."
  - "The chapter offers placement criteria and exact finite examples, not a universal scalar externalization score."
