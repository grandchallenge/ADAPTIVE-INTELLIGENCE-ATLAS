    venue: "ICML / PMLR 48"
    year: 2016
    url: "https://proceedings.mlr.press/v48/gal16.html"
    authority: >
      Primary source for the specific approximate-Bayesian interpretation of dropout
      developed in the paper and its uncertainty experiments; not a theorem that all
