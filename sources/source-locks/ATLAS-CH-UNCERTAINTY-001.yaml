  - id: "UNCERTAINTY-DEEP-ENSEMBLES-2017"
    citation_key: "LakshminarayananPritzelBlundell2017DeepEnsembles"
    kind: "peer-reviewed-conference"
    title: "Simple and Scalable Predictive Uncertainty Estimation using Deep Ensembles"
    venue: "NeurIPS 30"
    year: 2017
    url: "https://papers.nips.cc/paper/2017/hash/9ef2ed4b7fd2c810847ffa5fa85bce38-Abstract.html"
    authority: >
      Primary source for deep-ensemble predictive-uncertainty experiments and the
      reported calibration/OOD behavior in the paper's settings. An ensemble is not
      thereby a posterior sample set or a universal epistemic-uncertainty estimator.
  - id: "UNCERTAINTY-CONFORMAL-BOOK-2005"
    citation_key: "VovkGammermanShafer2005Conformal"
    kind: "monograph"
    title: "Algorithmic Learning in a Random World"
    publisher: "Springer"
    year: 2005
    doi: "10.1007/b106715"
    url: "https://link.springer.com/book/10.1007/b106715"
    authority: >
      Foundational source for conformal prediction and validity under its stated
