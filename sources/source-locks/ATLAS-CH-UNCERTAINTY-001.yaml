  - id: "UNCERTAINTY-LEI-CONFORMAL-2018"
    citation_key: "LeiEtAl2018ConformalRegression"
    kind: "peer-reviewed-journal"
    title: "Distribution-Free Predictive Inference for Regression"
    journal: "Journal of the American Statistical Association"
    year: 2018
    doi: "10.1080/01621459.2017.1307116"
    url: "https://arxiv.org/abs/1604.04173"
    authority: >
      Primary source for full/split conformal regression and finite-sample marginal
