claim_boundary: >
  The audited Information chapter supplies the probability/information substrate.
  External sources support specific calibration, Bayesian-approximation, ensemble,
  aleatoric/epistemic, conformal, and selective-prediction claims only in their stated
  settings. The Atlas does not identify these objects with one another, and does not
  claim that any one scalar uncertainty score is universally sufficient.

