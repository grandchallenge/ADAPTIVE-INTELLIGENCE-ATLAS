  - id: "UNCERTAINTY-GEIFMAN-ELYANIV-2017"
    citation_key: "GeifmanElYaniv2017Selective"
    kind: "peer-reviewed-conference"
    title: "Selective Classification for Deep Neural Networks"
    venue: "NeurIPS 30"
    year: 2017
    url: "https://papers.nips.cc/paper_files/paper/2017/hash/4a8423d5e91fda00bb7e46540e2b0cf1-Abstract.html"
    authority: >
      Primary source for selective-classification/reject-option risk-coverage tradeoffs
      and its high-probability risk-control construction in the stated setting.
      Selective risk is not probability calibration.

epistemic_rules:
  - "Predictive probability, predictive entropy, calibration error, posterior/model uncertainty, aleatoric uncertainty, conformal coverage, and selective risk are distinct objects."
  - "A calibrated predictor need not be sharp, informative, or accurate beyond what its probability levels imply."
  - "Predictive entropy alone cannot in general identify whether uncertainty is aleatoric or epistemic."
  - "Deep ensembles are an empirical predictive-uncertainty method; ensemble spread is not automatically a Bayesian posterior variance."
  - "MC dropout inherits only the approximate-Bayesian interpretation established under the cited framework and assumptions."
  - "Conformal validity is a coverage statement under exchangeability/randomness assumptions, not probability calibration and not arbitrary conditional coverage."
  - "Selective prediction trades coverage against conditional risk on accepted examples; abstention does not itself calibrate probabilities."
  - "Aleatoric/epistemic terminology is model-relative: what is reducible depends on the model class, information set, and data-generating assumptions."
  - "The downstream Distribution Shift chapter must re-establish guarantees under shift; no i.i.d./exchangeable guarantee silently survives a changed distribution."
