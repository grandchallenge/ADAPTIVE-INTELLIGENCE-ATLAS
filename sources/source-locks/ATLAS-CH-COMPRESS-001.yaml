locked_on: "2026-10-04"
epistemic_class: "audited_information_and_representation_prerequisites_plus_classical_compression_sources_plus_atlas_synthesis"
claim_boundary: >
  The audited Information prerequisite supplies coding/information language and the
  requirement that information-theoretic quantities be tied to a declared model. The
  audited Representation prerequisite supplies behavior-preserving recoding and
  representation-equivalence boundaries. Rissanen (1978) supports the shortest
  description-length model-selection principle in its stated statistical setting.
  Eckart and Young (1936) support optimal low-rank matrix approximation in least-squares
  form. Han, Mao, and Dally (2016) support a neural-network compression pipeline using
  pruning, trained quantization/weight sharing, and Huffman coding, with results scoped
  to their experiments. Hinton, Vinyals, and Dean (2015) support distillation as training
  a smaller model from teacher/ensemble outputs. Atlas-owned material includes the exact
  finite coding scheme, low-rank preservation witness, pruning failure control, and the
  mechanism-separation synthesis. No source here establishes that minimum parameter count
  equals minimum description length, that compression preserves accuracy universally, or
  that compressibility implies interpretability or mechanistic understanding.

