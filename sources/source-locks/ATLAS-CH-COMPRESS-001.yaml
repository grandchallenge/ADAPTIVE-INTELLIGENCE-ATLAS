epistemic_rules:
  - "Parameter count, storage bytes, entropy-coded length, and MDL objective are distinct quantities."
  - "Lossless compression preserves the coded object exactly; lossy compression permits declared distortion."
  - "Pruning, quantization, low-rank factorization, weight sharing, distillation, and entropy coding are distinct mechanisms."
  - "Equal function on a declared domain does not imply equal internal representation or equal code length."
  - "A lower-rank approximation is exact only when the target matrix already lies within the retained rank."
  - "Quantization can reduce bits per stored value without changing parameter count."
  - "Weight sharing can reduce the number of distinct stored values while retaining an index structure."
  - "Distillation transfers predictive behavior under a training objective; it is not literal source coding of the teacher."
  - "Compression ratio must be interpreted jointly with retained task behavior or declared distortion."
  - "Compressibility does not by itself establish interpretability, modularity, causal mechanism recovery, or intelligence."
