chapter_id: "ATLAS-CH-CURRICULUM-001"
locked_on: "2026-10-04"
epistemic_class: "established_curriculum_learning_literature_plus_atlas_state_aware_synthesis"
claim_boundary: >
  The cited external sources establish representative curriculum-learning,
  automatic syllabus-selection, and competence-based scheduling mechanisms in
  their stated experimental settings. The audited DATA and OPTBASE prerequisites
  establish data-mixture/evaluation semantics and optimizer/training-state
  boundaries. The Atlas-owned contribution is the explicit state-aware
  curriculum contract and the finite separation witness showing that nominal
  difficulty order alone need not determine the useful next sample. No universal
  claim is made that easy-to-hard ordering, learning-progress maximization,
  competence schedules, or any particular curriculum improves arbitrary models,
  datasets, objectives, or generalization regimes.
