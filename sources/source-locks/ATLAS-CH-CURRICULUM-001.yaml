epistemic_rules:
  - "Nominal sample difficulty is a declared scoring rule, not an intrinsic universal property of an example."
  - "A fixed curriculum is an open-loop schedule; a state-aware curriculum is a policy that may condition on declared learner observations."
  - "Observed loss decrease or accuracy increase is a behavioral/training signal, not by itself a mechanism-level proof of acquisition, persistence, accessibility, or internal representation change."
  - "Learning-progress rewards inherit the measurement window, metric orientation, noise, and nonstationarity of the progress estimator."
  - "A competence schedule controls eligibility or sampling; it does not guarantee competence, generalization, or monotone learning."
  - "Curriculum effects must be separated from changed example counts, repeated exposure, total compute, optimizer schedule, and mixture weights."
  - "Sample selection and mixture reweighting are distinct interventions even when they induce related effective sampling distributions."
  - "The finite Atlas witness assumes full observability of the toy state and repeatable experience-type actions; it proves only a separation between state-independent nominal ordering and a declared state-aware one-step progress policy."
