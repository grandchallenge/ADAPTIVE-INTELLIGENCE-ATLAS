claim_boundary: >
  NUMERICS-001 supplies the audited distinction between exact flows and discrete updates,
  consistency/error/stability boundaries, splitting, and structure-preserving caveats.
  MANOPT-001 supplies tangent gradients, retractions, sphere/Stiefel constraint geometry,
  stationarity and optimality boundaries. Primary external sources support Bregman divergences,
  discrete variational mechanics/variational integrators, and the Bregman-Lagrangian
  continuous-time perspective on accelerated optimization. Atlas-owned material provides
  finite divergence/local-metric derivations, mirror/proximal updates, exact symplectic
  controls, and non-descent counterexamples. grandchallenge/MODULUS is bound only as a
  versioned GCL optimization implementation/research provider. Its Hyperball pipeline
  demonstrates an explicit geometry-to-update construction (base proposal -> tangent
  projection -> scale -> retraction), but it is not treated as authority for a universal
  variational principle, optimizer superiority, convergence theorem, or claim promotion.

