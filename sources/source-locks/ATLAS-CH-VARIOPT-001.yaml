sources:
  - id: "VARIOPT-BREGMAN-1967"
    kind: "primary-journal-article"
    title: "The relaxation method of finding the common point of convex sets and its application to the solution of problems in convex programming"
    authors: "L. M. Bregman"
    journal: "USSR Computational Mathematics and Mathematical Physics"
    volume: 7
    issue: 3
    pages: "200-217"
    year: 1967
    doi: "10.1016/0041-5553(67)90040-7"
    authority: >
      Original Bregman-distance source. Used for the divergence construction and
      projection/convex-programming lineage only; not as a claim that every divergence
      is a metric or that every divergence-derived optimizer is superior.
  - id: "VARIOPT-MARSDEN-WEST-2001"
    kind: "peer-reviewed-survey"
    title: "Discrete mechanics and variational integrators"
    authors: "J. E. Marsden; M. West"
    journal: "Acta Numerica"
    volume: 10
    pages: "357-514"
    year: 2001
    doi: "10.1017/S096249290100006X"
    authority: >
      Standard source for discrete variational principles and variational integrators,
      including the symplectic structure of regular discrete variational mechanics.
      Does not supply optimization descent or global-optimality claims.
  - id: "VARIOPT-WIBISONO-WILSON-JORDAN-2016"
    kind: "peer-reviewed-journal-article"
    title: "A variational perspective on accelerated methods in optimization"
    authors: "Andre Wibisono; Ashia C. Wilson; Michael I. Jordan"
    journal: "Proceedings of the National Academy of Sciences"
    volume: 113
    issue: 47
    pages: "E7351-E7358"
    year: 2016
    doi: "10.1073/pnas.1614734113"
    arxiv_id: "1603.04245"
    authority: >
      Primary source for the Bregman-Lagrangian continuous-time variational
      perspective on accelerated optimization and the associated passage to families
      of discrete algorithms. Used source-scopingly; it does not make arbitrary
      variational discretizations stable, accurate, monotone, or optimal.

