epistemic_rules:
  - "A Bregman divergence need not be symmetric and is not generally a metric."
  - "For twice differentiable strictly convex generator phi, the Hessian gives a local quadratic form; this local geometry does not convert the global divergence into a metric."
  - "A mirror/Bregman-proximal step is defined only after the objective linearization, divergence generator, domain, and step parameter are declared."
  - "A variational derivation identifies stationarity of an action/discrete action; it does not by itself establish numerical stability, accuracy, or optimization descent."
  - "A regular discrete variational integrator can be symplectic under its theorem assumptions; symplecticity does not imply exact energy conservation."
  - "Structure preservation does not imply monotone objective decrease, convergence speed, or global optimality."
  - "The Bregman Lagrangian is source-scoped continuous-time optimization theory; arbitrary discretizations do not automatically inherit its properties."
  - "MODULUS Hyperball is programme-specific geometric update machinery. It is not claimed here to arise from the Bregman Lagrangian or a discrete action."
  - "MODULUS target_angle scales tangent-update norm approximately as alpha*||w|| before retraction; the finite post-retraction angle need not equal alpha exactly."
  - "GCL programme evidence remains distinct from established external mathematical authority."
