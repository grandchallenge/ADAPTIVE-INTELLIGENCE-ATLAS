epistemic_rules:
  - "Normalization removes radial information by construction."
  - "Cosine/angular geometry on unit vectors does not imply that norm was irrelevant before normalization."
  - "nGPT empirical speed/training claims remain scoped to the cited papers."
  - "Public MODULUS hyperball code is implementation-context evidence, not a substitute for the nGPT papers."
