chapter_id: "ATLAS-CH-NORMREP-001"
locked_on: "2026-10-02"
claim_boundary: >
  Standard sphere/hypersphere geometry is externally established. Hyperspherical
  representation-learning claims are limited to the cited literature. nGPT architecture
  and training claims are limited to the cited nGPT research preprints. The public GCL
  MODULUS object supports only the narrower claim that a public optimizer module was
  authored for nGPT/MODULUS-style spherical training; it is not evidence of a public
  GCL nGPT implementation.
