claim_boundary: >
  The audited prerequisites support Jacobians, singular values, operator norms, conditioning,
  local linearization, residual-map Jacobians, and local perturbation propagation. The external
  sources support forward- and reverse-mode algorithmic differentiation terminology and
  Jacobian-vector / transposed-Jacobian-vector products. The Atlas synthesis develops a
  learned-component boundary-probe interface. A local Jacobian or finite power-iteration
  estimate does not certify global nonlinear stability, semantic adequacy, or end-to-end
  correctness.
