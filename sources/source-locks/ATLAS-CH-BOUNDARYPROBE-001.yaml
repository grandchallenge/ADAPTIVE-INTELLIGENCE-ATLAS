epistemic_rules:
  - "A JVP J_F(x)v is a directional first-order response at a declared operating point; it is not a global perturbation guarantee."
  - "A VJP J_F(x)^T w is a pullback/adjoint product under the declared inner products and coordinate convention; it is not a causal attribution."
  - "The Euclidean local gain is sigma_max(J_F(x)) = ||J_F(x)||_2, inherited from LINALG-001."
  - "Power iteration on J^T J estimates sigma_max(J)^2 only when its initialization has a nonzero component in the dominant eigenspace and sufficient iterations are used."
  - "A finite power-iteration estimate is not automatically a certified upper bound on ||J||_2."
  - "Random restarts or richer subspace methods can reduce initialization risk but do not convert a local Jacobian estimate into a global nonlinear theorem."
  - "Interface conditions must name operating region, norms, perturbation class, quantity probed, estimator procedure, and acceptance threshold."
  - "A numerical sensitivity obligation and a semantic interface obligation are distinct."
