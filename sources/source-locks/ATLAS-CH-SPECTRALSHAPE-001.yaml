claim_boundary: >
  MATRIXOPT-001 supplies SVD/polar language, rectangular semi-orthogonality, norm-dependent update geometry,
  exact-versus-approximate singular-value transformations, and the distinction between polar flattening and
  arbitrary spectral shaping. NONNORMAL-001 supplies normal/non-normal distinctions, exact transient-growth
  witnesses, resolvent/pseudospectral language, and the boundary that eigenvalue information alone need not
  control finite-horizon amplification. SPECTRALSHAPE-001 adds Atlas-owned exact finite maps that distinguish
  scalar normalization, clipping/conditioning, polar flattening, and an explicit non-flat target spectrum.
  No new external academic source is required. Instantaneous spectral shape is not promoted to a theorem about
  optimizer-state dynamics, convergence, nonlinear trajectories, non-normal transient growth, or task quality.

