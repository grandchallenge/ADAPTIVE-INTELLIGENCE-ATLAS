new_external_academic_sources: []

source_decision:
  finding: >
    No new external source is needed. MATRIXOPT and NONNORMAL already govern every externally sourced claim
    needed for this chapter. The finite shaping maps and controls are elementary exact Atlas-owned linear algebra.
  reopen_condition: >
    Add a new primary source only if a named modern spectral-shaping optimizer, empirical superiority claim,
    or new convergence theorem is introduced.

spectral_map_interface:
  factorization: "G=U Sigma V^T"
  shaped_update: "T_f(G)=U f(Sigma) V^T"
  rule: >
    f acts on declared singular values. Scalar normalization, clipping, flattening, and an explicit target
    profile are different f maps even when they happen to produce similar condition numbers on one witness.
  condition_number_scope: "kappa_2 is used only for full-rank matrices with positive smallest singular value."

exact_conditioning_witness:
  G:
    - ["4","0"]
    - ["0","1"]
  singular_values: ["4","1"]
  kappa_2: "4"
  scalar_normalization:
    map: "f_scale(sigma)=sigma/4"
    result:
      - ["1","0"]
      - ["0","1/4"]
    singular_values: ["1","1/4"]
    kappa_2: "4"
    lesson: "Scalar normalization changes global scale but preserves the singular-value ratio."
  upper_clipping:
    map: "f_clip(sigma)=min(sigma,2)"
    result:
      - ["2","0"]
      - ["0","1"]
    singular_values: ["2","1"]
    kappa_2: "2"
    lesson: "Clipping the large mode improves this witness condition number without flattening the spectrum."
  polar_flattening:
    map: "f_polar(sigma)=1 for sigma>0"
    result:
      - ["1","0"]
      - ["0","1"]
    singular_values: ["1","1"]
    kappa_2: "1"
    lesson: "Full-rank polar flattening equalizes all nonzero singular values."
  nonflat_target:
    target_singular_values: ["3","2"]
    result:
      - ["3","0"]
      - ["0","2"]
    kappa_2: "3/2"
    lesson: "Intentional spectral shaping can target a non-flat profile distinct from normalization, clipping, or polar flattening."

nonnormal_control:
  A:
    - ["1/2","2"]
    - ["0","1/2"]
  N:
    - ["1/2","0"]
    - ["0","1/2"]
  shared_eigenvalues: ["1/2","1/2"]
  probe_vector: ["0","1"]
  A_probe: ["2","1/2"]
  A_probe_norm_squared: "17/4"
  N_probe: ["0","1/2"]
  N_probe_norm_squared: "1/4"
  epsilon: "1/4"
  A_pseudospectral_radius: "3/4"
  N_pseudospectral_radius: "1/4"
  lesson: >
    Matching eigenvalues does not match transient/interface amplification or pseudospectral sensitivity.
    Instantaneous spectral shaping of an update must not be promoted to a dynamical guarantee.

epistemic_rules:
  - "Scalar normalization changes scale, not generally conditioning."
  - "Clipping/conditioning and polar flattening are distinct singular-value maps."
  - "A flat spectrum is one possible target, not a universal optimum."
  - "A non-flat target spectrum must be declared explicitly; its desirability is task- and geometry-relative."
  - "Instantaneous update singular values are not optimizer-state dynamics."
  - "Eigenvalue shape alone does not control non-normal transient growth or pseudospectral sensitivity."
  - "A better condition number for an update matrix does not by itself prove faster optimizer convergence."
  - "Spectral shaping quality and downstream task quality are separate metrics."
