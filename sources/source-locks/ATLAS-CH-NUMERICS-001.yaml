claim_boundary: >
  Consistency, convergence, absolute stability, stiffness, implicit/explicit
  one-step schemes, and splitting/composition methods are externally established
  in the cited references. The Atlas-specific synthesis is the interpretation of
  these numerical ideas as architectural and computational design principles for
  adaptive-depth, split-operator, and structure-preserving neural computation.
  No claim is made that a neural layer is automatically a valid numerical integrator.
