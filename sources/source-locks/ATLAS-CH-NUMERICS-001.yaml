epistemic_rules:
  - "The exact flow Phi_h and a numerical update Psi_h are different maps unless proved equal."
  - "Local truncation error, global error, and stability are distinct notions."
  - "Absolute stability of a time-stepping method is not the same as Lyapunov stability of the underlying ODE."
  - "Stiffness is problem-and-method relative; no single scalar definition is universally sufficient."
  - "Implicit methods trade solve cost for larger stability regions; they are not automatically more accurate."
  - "Lie-Trotter and Strang splitting require declared operator decompositions and regularity; noncommutativity controls leading composition error."
  - "Symplecticity and exact energy conservation are distinct properties."
