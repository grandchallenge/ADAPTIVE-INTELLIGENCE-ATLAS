epistemic_rules:
  - "Consistency alone does not guarantee convergence without the required stability/regularity assumptions."
  - "Absolute-stability regions are properties of a numerical method on a declared test problem; they are not universal nonlinear guarantees."
  - "Stiffness is problem/method-relative and is not synonymous with large derivative magnitude."
  - "Lie-Trotter and Strang order claims require the regularity/domain assumptions appropriate to the operators involved."
  - "A structure-preserving integrator preserves only the structures its construction actually guarantees."
