claim_boundary: >
  One-step ODE discretization, truncation error, absolute stability, stiffness,
  implicit/explicit integration, and Lie-Strang splitting are established numerical
  analysis in the cited sources. Atlas-specific interpretations of layers as steps,
  computational depth as time allocation, and neural computation as numerical flow
  are downstream synthesis and are not claimed as consequences of those references.
