claim_boundary: >
  These sources support normal/non-normal matrix analysis, resolvent and pseudospectral theory, and established transient-growth examples. They do not establish that non-normality explains a particular neural-training instability.

claim_scope:
  - "The Atlas 2x2 Jordan-like example is independently derived and is not attributed as a theorem from these sources."
  - "The epsilon-pseudospectrum uses the 2-norm resolvent/smallest-singular-value convention."
  - "Fluid-mechanical examples motivate the general phenomenon but do not imply that neural-training instability has the same mechanism."
