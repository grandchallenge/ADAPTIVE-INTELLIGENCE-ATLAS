claim_boundary: >
  The sources support representative sparse-gating, top-k/top-1 routing, load-balancing,
  capacity, expert-parallel communication, and training-stability mechanisms. They do not
  establish one universally optimal router, capacity factor, auxiliary loss, expert count,
  or parallelization strategy; nor do balanced traffic counts imply semantic specialization,
  equal expert usefulness, equal probability mass, or lower end-to-end latency.
