schema_version: "1.0.0"
chapter_id: "ATLAS-CH-TRANSFER-001"
locked_on: "2026-10-02"
epistemic_class: "established_transfer_framework_plus_atlas_synthesis"
claim_boundary: >
  Standard transfer-learning terminology, source/target domain-task distinctions,
  feature-transfer observations, and negative-transfer risks are externally established
  in the cited literature. The Atlas reconstruction formulation that transfer succeeds
  when source and target representations compile to a common capability-sufficient
  Residual is a project synthesis. It is not claimed as a complete or universal theory
  of transfer learning.
sources:
  - id: "TRANSFER-PAN-YANG-2010"
    citation_key: "PanYang2010"
    kind: "peer-reviewed-survey"
    title: "A Survey on Transfer Learning"
    journal: "IEEE Transactions on Knowledge and Data Engineering"
    year: 2010
    doi: "10.1109/TKDE.2009.191"
    authority: >
      Standard source/target domain and task framing, transfer-learning taxonomy,
      relationships to domain adaptation/multitask learning, and the negative-transfer problem.
  - id: "TRANSFER-YOSINSKI-2014"
    citation_key: "YosinskiEtAl2014"
    kind: "peer-reviewed-conference"
    title: "How transferable are features in deep neural networks?"
    venue: "NeurIPS 2014"
    authority: >
      Empirical evidence that transferability is layer- and task-dependent and can be
      impaired by feature specialization and co-adaptation/optimization effects.
  - id: "TRANSFER-KORNBLITH-2019"
    citation_key: "KornblithShlensLe2019"
    kind: "peer-reviewed-conference"
    title: "Do Better ImageNet Models Transfer Better?"
    venue: "CVPR 2019"
    authority: >
      Empirical evidence that source-task performance and transferred-feature quality
      are not interchangeable and that transfer benefit depends on training and target task.
  - id: "TRANSFER-ACHILLE-SOATTO-2018"
    citation_key: "AchilleSoatto2018"
    kind: "peer-reviewed-article"
    title: "Emergence of Invariance and Disentanglement in Deep Representations"
    authority: >
      Task-relative sufficiency/minimality/nuisance-invariance framework used as a
      supporting bridge between representation compression and transferability.
  - id: "TRANSFER-TISHBY-IB"
    citation_key: "TishbyPereiraBialek2000"
    kind: "research-preprint"
    title: "The Information Bottleneck Method"
    authority: >
      Supporting precedent for preserving target-relevant information under compression;
      not used as a universal definition of transfer.
