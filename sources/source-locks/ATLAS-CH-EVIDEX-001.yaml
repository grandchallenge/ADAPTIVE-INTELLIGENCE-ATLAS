epistemic_rules:
  - "Provenance records how an object came to be; it does not establish that the object is true."
  - "A durable identifier identifies an object or version; it does not establish authority."
  - "Zero-context means no correctness-relevant dependency on hidden conversational state relative to the declared actor class, not zero prerequisite knowledge."
  - "A return disposition is a contributor claim until independently reviewed or promoted."
  - "Receipt is weaker than acceptance; acceptance is weaker than certification."
  - "Independent_blind is a declared information-flow condition, not proof of statistical or institutional independence."
  - "Replayability means the inputs, procedure, environment assumptions, and outputs are sufficiently identified for another actor to attempt reproduction; it does not guarantee identical execution on every platform."
  - "Synthesis may combine compatible returned claims but must not silently strengthen their domains, hypotheses, or epistemic status."
