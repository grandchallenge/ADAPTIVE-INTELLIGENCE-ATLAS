claim_boundary: >
  W3C PROV supports a general provenance model involving entities, activities,
  agents, derivations, and responsibility. FAIR supports persistent identifiers,
  rich metadata, qualified references, provenance, and reuse-oriented description
  for scholarly digital objects. The public GCL artifacts demonstrate one concrete
  zero-context dispatch/result protocol. None of these sources proves that the Atlas
  exchange tuple is a universal standard, that provenance establishes truth, or that
  zero-context work guarantees independent reasoning or correct results.
sources:
  - id: "EVIDEX-W3C-PROV-DM-2013"
    kind: "standard"
    title: "PROV-DM: The PROV Data Model"
    organization: "World Wide Web Consortium"
    editors: "Luc Moreau; Paolo Missier"
    status: "W3C Recommendation"
    date: "2013-04-30"
    authority: >
      Normative provenance vocabulary and relations for entities, activities,
      agents, derivation, generation, use, and responsibility. Used to support
      the separation of payload identity from provenance history.
  - id: "EVIDEX-FAIR-2016"
    kind: "peer-reviewed-journal"
    title: "The FAIR Guiding Principles for scientific data management and stewardship"
    authors: "Mark D. Wilkinson et al."
    journal: "Scientific Data"
    volume: 3
    article: "160018"
    year: 2016
    doi: "10.1038/sdata.2016.18"
    authority: >
      Peer-reviewed principles supporting persistent identifiers, rich metadata,
      qualified references, detailed provenance, and reusable descriptions for
      data, algorithms, tools, and workflows. Used as reusability guidance rather
      than as a proof of scientific validity.
