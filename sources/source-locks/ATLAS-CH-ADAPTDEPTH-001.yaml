sources:
  - id: "ADAPTDEPTH-GRAVES-ACT-2016"
    citation_key: "Graves2016ACT"
    kind: "research-preprint"
    title: "Adaptive Computation Time for Recurrent Neural Networks"
    author: "Alex Graves"
    year: 2016
    arxiv_id: "1603.08983"
    doi: "10.48550/arXiv.1603.08983"
    url: "https://arxiv.org/abs/1603.08983"
    authority: >
      Primary source for a differentiable learned adaptive-computation mechanism that
      allocates a variable number of recurrent computational steps. Used as learned
      halting/compute-allocation evidence, not as a numerical error estimator.
  - id: "ADAPTDEPTH-FIGURNOV-2017"
    citation_key: "FigurnovEtAl2017"
    kind: "peer-reviewed-conference"
    title: "Spatially Adaptive Computation Time for Residual Networks"
    authors: "Michael Figurnov; Maxwell D. Collins; Yukun Zhu; Li Zhang; Jonathan Huang; Dmitry Vetrov; Ruslan Salakhutdinov"
    venue: "CVPR"
    year: 2017
    url: "https://openaccess.thecvf.com/content_cvpr_2017/html/Figurnov_Spatially_Adaptive_Computation_CVPR_2017_paper.html"
    authority: >
      Primary source for learned spatially varying computation in residual networks.
      Used to show that compute allocation can vary over inputs/locations; not evidence
      that the halting signal is a calibrated local numerical-error estimate.
  - id: "ADAPTDEPTH-DORMAND-PRINCE-1980"
    citation_key: "DormandPrince1980"
    kind: "peer-reviewed-journal"
    title: "A family of embedded Runge-Kutta formulae"
    authors: "J. R. Dormand; P. J. Prince"
    journal: "Journal of Computational and Applied Mathematics"
    volume: 6
    issue: 1
    pages: "19-26"
    year: 1980
    doi: "10.1016/0771-050X(80)90013-3"
    url: "https://doi.org/10.1016/0771-050X(80)90013-3"
    authority: >
      Primary numerical-analysis source for embedded Runge-Kutta formulas of differing
      order. Used for the mechanism of paired same-step approximations whose difference
      supports local-error estimation and adaptive step control under the method's
      declared assumptions; not a learned-computation result.

epistemic_rules:
  - "Learned halting score != numerical local-error estimate unless an explicit relation is established."
  - "Adaptive depth (number of executed stages) != adaptive step size (mesh spacing over a declared reference problem)."
  - "A low local-error estimate does not by itself prove a low accumulated global error."
  - "An embedded-pair difference is an estimator whose interpretation depends on the declared numerical method and smoothness/order assumptions."
  - "Budget exhaustion != convergence and != tolerance satisfaction."
  - "A learned compute-allocation policy may optimize task loss, latency, or a ponder penalty without estimating discretization error."
  - "Spatially varying execution depth != a spatially adaptive PDE mesh unless an actual discretized reference problem is declared."
  - "Error control requires naming the target error quantity, norm, tolerance, estimator, acceptance rule, and failure/budget state."
  - "The exact finite Euler/Heun witness is local to y'=t and does not establish a universal error identity for arbitrary ODEs or networks."
