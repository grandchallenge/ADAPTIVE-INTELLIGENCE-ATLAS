claim_boundary: >
  The audited DEPTH chapter supplies learned halting, recurrent depth, equilibrium,
  conditional execution, and realized-compute semantics. The audited NETNUM chapter
  supplies exact-flow versus step-map, local/global error, stability, and numerical
  step-size boundaries. Dormand-Prince supplies a primary embedded Runge-Kutta source
  for paired formulas with different orders; Graves and Figurnov supply representative
  learned adaptive-computation mechanisms. The Atlas synthesis compares these control
  surfaces without identifying a learned halting score with a numerical local-error
  estimator unless an explicit calibration or error-bound relation is separately established.

