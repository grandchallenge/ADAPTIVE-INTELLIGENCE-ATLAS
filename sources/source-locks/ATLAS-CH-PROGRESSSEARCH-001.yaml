claim_boundary: >
  The audited Curriculum prerequisite supplies the controller state/action/observation interface,
  open-loop versus closed-loop semantics, an oriented learning-progress signal, the finite
  state-dependent action witness, and the boundary that metric change does not identify an internal
  mechanism transition. Oudeyer, Kaplan, and Hafner (2007) are used as a primary precedent for
  progress-sensitive intrinsic-motivation systems that direct autonomous exploration toward regions
  with changing prediction/learning outcomes. Baranes and Oudeyer (2013) are used as a primary
  precedent for competence-progress-driven active goal exploration over a parameterized task space.
  Portelas et al. (2020) are used as a primary precedent for turning curriculum generation over a
  continuously parameterized environment space into a surrogate bandit/search problem driven by
  absolute learning progress. Atlas-owned material defines the Progress Search object, separates
  exploitation from deliberate coverage/exploration, introduces explicit credit and horizon fields,
  and supplies a finite witness where pure exploitation fails to discover a higher-progress region
  while one forced exploratory query does. No cited result licenses a universal claim that learning
  progress is the optimal search objective, that absolute progress implies durable generalization,
  or that progress signals identify learned mechanisms.

