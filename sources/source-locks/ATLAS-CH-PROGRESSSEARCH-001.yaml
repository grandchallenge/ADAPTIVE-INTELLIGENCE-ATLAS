epistemic_rules:
  - "Learning progress remains a declared controller signal, not a direct observation of mechanism acquisition."
  - "Absolute learning progress may value both improvement and deterioration; its interpretation must be declared."
  - "Experience-space search requires an explicit exploration rule; greedily maximizing current progress is not search-complete."
  - "Search value depends on horizon and credit assignment; immediate progress need not maximize terminal capability."
  - "Generalization-state evidence is partial evidence about declared acquisition/persistence/accessibility/expression surfaces, not a mechanism oracle."
  - "The search operator may change the effective training distribution and must preserve the inherited dose/recipe comparison boundary."
