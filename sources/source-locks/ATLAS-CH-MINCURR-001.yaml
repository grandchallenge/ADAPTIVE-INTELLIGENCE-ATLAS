epistemic_class: "audited_progress_search_and_residual_prerequisites_plus_primary_teaching_sources_plus_atlas_exact_minimal_basis_witness"
claim_boundary: >
  PROGRESSSEARCH-001 supplies governed experience-space search, exploration/coverage, delayed credit,
  finite-horizon semantics, and exact counterexamples to exploit-only search. RESIDUAL-001 supplies
  task-relative sufficiency and leastness relative to declared descriptor and post-processing classes.
  Goldman and Kearns (1995) are used for the classical teaching-dimension idea that a target concept can
  be uniquely identified by a smallest teaching set relative to a concept class. Zhu (2015) is used for
  machine teaching as optimal training-set design relative to a specified learner and target. Atlas-owned
  material defines the exact two-bit teaching witness, the high-progress/non-basis control, and the
  acquisition/persistence/accessibility/behavioural-expression evidence ladder. No source is claimed to
  establish that early neural mechanisms necessarily persist, remain accessible, or cause later behavior.

