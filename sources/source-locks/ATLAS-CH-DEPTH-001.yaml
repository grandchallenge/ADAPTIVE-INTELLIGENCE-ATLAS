epistemic_class: "established_adaptive_depth_mechanisms_plus_atlas_synthesis"
claim_boundary: >
  The external sources support representative mechanisms for recurrent depth,
  adaptive halting, equilibrium/fixed-point depth, and conditional block execution.
  They do not establish that variable depth is universally superior, that every
  residual network is literally a time discretization of one underlying ODE, or
  that a relaxed gate automatically yields hardware savings. The Atlas synthesis
  is the separation of depth index, computational time, stopping rule, convergence
  criterion, and realized execution cost.
