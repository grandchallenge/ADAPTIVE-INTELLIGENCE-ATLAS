epistemic_rules:
  - "Depth index is not automatically physical time."
  - "A residual or recurrent update may support a computational-time interpretation without identifying one unique underlying ODE."
  - "Weight tying makes repeated computation explicit but does not guarantee convergence."
  - "An adaptive halting rule changes computation allocation; it does not certify correctness."
  - "An equilibrium equation x*=F(x*) does not imply that naive fixed-point iteration converges to that equilibrium."
  - "A relaxed gate in [0,1] is not equivalent to a skipped hardware operation unless execution actually avoids the block."
  - "Effective depth, wall-clock latency, FLOPs, sequential steps, and energy are related but distinct resource measures."
