epistemic_rules:
  - "An executable revision is not governance-authorized merely because an actor can apply it."
  - "Proposal, execution, promotion, rollback, and certification authority remain distinct unless an explicit policy composes them."
  - "Evidence supporting revision r does not automatically support a materially different revision r-prime; target identity must be rebound after change."
  - "Rollback availability is not identical to recoverability: restoration may be blocked, lossy, unauthorised, or unable to restore external state."
  - "Preserved raw action count is not preserved correction capacity; correction paths are target-, horizon-, feasibility-, and authority-relative."
  - "A safety invariant can hold while progress halts; fail-closed governance does not imply liveness."
  - "Governance conformance is evidence about process and authority conditions, not substantive proof that an adaptation is beneficial or correct."
  - "Corrigibility, interruptibility, and intervention-channel preservation are related but not definitionally interchangeable."
  - "A revision remains bounded by the current authority contract; it does not inherit authority to alter that contract unless a separate governed transition permits it."
  - "The finite Atlas witness compares two post-revision states relative to one common baseline and proves only that equal immediate utility can coexist with unequal preserved authorized correction paths."
