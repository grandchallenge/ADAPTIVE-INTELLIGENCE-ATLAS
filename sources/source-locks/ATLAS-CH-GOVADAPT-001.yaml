chapter_id: "ATLAS-CH-GOVADAPT-001"
locked_on: "2026-10-04"
epistemic_class: "audited_optionality_and_research_state_machine_prerequisites_plus_bounded_intervention_precedents_plus_atlas_synthesis"
claim_boundary: >
  The audited Atlas prerequisites support correction-capacity and viability
  semantics, typed governed state, guarded transitions, authority separation,
  recovery classes, and exact-target evidence binding. The external sources
  provide bounded precedents for cooperation with corrective intervention,
  preserving interruptibility during learning, and modeling incentives around
  a human intervention channel. The Atlas governed-adaptation object, authority
  separation, exact-revision gate, correction-capacity preservation rule, and
  finite equal-utility witness are chapter-owned constructions. No claim is made
  that interruption, shutdown, corrigibility, rollback, or process conformance
  alone establishes alignment, safety, truth, beneficial adaptation, or universal
  recoverability.
sources:
  - id: "GOVADAPT-CORRIGIBILITY-2015"
    citation_key: "SoaresEtAl2015Corrigibility"
    kind: "workshop-paper"
    title: "Corrigibility"
    authors: "Nate Soares; Benja Fallenstein; Eliezer Yudkowsky; Stuart Armstrong"
    venue: "AAAI Workshop on Artificial Intelligence and Ethics"
    year: 2015
    url: "https://intelligence.org/files/Corrigibility.pdf"
    authority: >
      Precedent for cooperation with corrective intervention despite incentives
      that may resist shutdown or preference change. The paper leaves important
      desiderata unresolved and is not authority for the Atlas governance design.
  - id: "GOVADAPT-INTERRUPTIBLE-2016"
    citation_key: "OrseauArmstrong2016"
    kind: "peer-reviewed-conference"
    title: "Safely Interruptible Agents"
    authors: "Laurent Orseau; Stuart Armstrong"
    venue: "UAI 2016"
    pages: "557-566"
    year: 2016
    isbn: "978-0-9966431-1-5"
    url: "https://www.auai.org/uai2016/proceedings/papers/68.pdf"
    authority: >
      Formal precedent for separating a learning task from intervention-induced
      incentives and for safe interruptibility in the paper's reinforcement-
      learning setting. It is not a general governance theorem for arbitrary
      adaptive systems.
  - id: "GOVADAPT-OFFSWITCH-2017"
    citation_key: "HadfieldMenellEtAl2017OffSwitch"
    kind: "peer-reviewed-conference"
    title: "The Off-Switch Game"
    authors: "Dylan Hadfield-Menell; Anca Dragan; Pieter Abbeel; Stuart Russell"
    venue: "IJCAI 2017"
    pages: "220-227"
    year: 2017
    doi: "10.24963/ijcai.2017/32"
    authority: >
      Game-theoretic precedent showing that incentives to preserve a human
      intervention channel depend on objective uncertainty and interpretation
      of human actions. Used only as motivation for correction-channel preservation.
