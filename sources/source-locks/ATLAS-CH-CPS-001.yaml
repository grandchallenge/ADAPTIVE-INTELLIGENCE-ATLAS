exact_witness_contract:
  optimizer_family: >
    Scalar quadratic momentum with eta=1/10, beta=9/10 and local curvature h:
    J(h)=[[1-h/10,-9/100],[h,9/10]].
  invariant_identity:
    determinant: "det J(h)=9/10"
    trace: "tr J(h)=19/10-h/10"
    coupling_coordinate: "kappa(J)=1+det J-tr J=h/10"
  toy_windows:
    - id: "d0"
      role: "discovery"
      h: 2
      kappa: "1/5"
      next_window_transition_label: 0
    - id: "d1"
      role: "discovery"
      h: 8
      kappa: "4/5"
      next_window_transition_label: 1
    - id: "h0"
      role: "heldout"
      h: 3
      kappa: "3/10"
      next_window_transition_label: 0
    - id: "h1"
      role: "heldout"
      h: 7
      kappa: "7/10"
      next_window_transition_label: 1
  threshold: "tau=1/2, frozen from the two discovery windows before heldout evaluation"
  heldout_result: "kappa>1/2 predicts labels (0,1) correctly on both heldout toy windows"
  spectral_control: >
    For h in {2,3,7,8}, the characteristic discriminant is negative and det J=9/10,
    so both eigenvalues have modulus sqrt(9/10); spectral radius alone is identical across
    all four toy windows and cannot implement the toy classifier.
  boundary: >
    The labels are synthetic protocol labels chosen to make prediction/falsification mechanics exact.
    This witness is not GSD evidence and does not establish that kappa predicts real training transitions.

transition_local_protocol:
  discovery_stage:
    - "Freeze the behavioural transition definition independently of CPS."
    - "Choose probe family, layer/state partition, horizon k, checkpoint lead Delta, and threshold/model only on discovery transitions."
    - "Retrospective best-layer or best-statistic selection is exploratory and must not count as prediction."
  heldout_stage:
    - "Compute the frozen probe using only information available at checkpoint t."
    - "Predict whether the predeclared behavioural transition criterion occurs in (t,t+Delta]."
    - "Evaluate on heldout transitions/checkpoint windows not used to choose the probe."
  dispositions:
    PREDICTIVE_SIGNAL: "Frozen pre-transition probe clears the preregistered heldout criterion."
    DESCRIPTIVE_ONLY: "Retrospective alignment exists but heldout prediction fails or was not preregistered."
    NO_SIGNAL: "The frozen probe shows no declared descriptive/predictive value when artifacts are available."
    BLOCKED_EXTERNAL_ARTIFACT_ABSENT: "Required exact optimizer-state artifacts are unavailable; no signal disposition is authorized."
  causal_boundary: >
    Predictive or descriptive association does not establish optimizer-state causality. A causal mechanism
    claim requires a controlled optimizer-state/update intervention or another declared causal design with matched controls.

epistemic_rules:
  - "A behavioural transition is the target variable, not proof of an optimizer-state transition."
  - "A local augmented-state Jacobian is a diagnostic object, not latent ground truth."
  - "Spectral radius, singular gain, non-normality, and coupling coordinates are distinct diagnostics."
  - "A retrospective signature is descriptive unless frozen before heldout evaluation."
  - "Heldout prediction is stronger than retrospective alignment but weaker than causal mechanism evidence."
  - "One confirmed GSD transition is insufficient to validate a general predictor."
  - "Missing optimizer artifacts are an evidentiary block, not a negative scientific result."
  - "A toy exact witness validates protocol arithmetic only; it does not validate the empirical CPS hypothesis."
