epistemic_rules:
  - "A relative-position bias matrix, a RoPE feature-space operator, and the full content-dependent attention operator are distinct objects."
  - "Circulant/Fourier diagonalization requires an explicit cyclic boundary assumption; finite nonperiodic relative-position matrices are generally Toeplitz-like rather than circulant."
  - "The DC mode is the zero-frequency component of a declared translation-invariant relative-position operator; it is not synonymous with an absolute position embedding."
  - "A low-dimensional mode truncation is exact or approximate relative to a declared norm/operator and does not automatically preserve task performance."
  - "Head-specific spectral profiles diagnose positional-operator differences across heads; they do not by themselves establish semantic or causal specialization."
  - "RoPE's block-frequency decomposition acts in feature coordinates, while Fourier decomposition of a relative-position kernel acts over sequence index; the two decompositions must not be conflated."
