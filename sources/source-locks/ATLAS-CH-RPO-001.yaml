claim_boundary: >
  The audited Positional Geometry prerequisite supplies block-rotation notation, the exact RoPE
  relative-offset identity, multi-frequency rotary decomposition, multidimensional product-group
  construction, and the boundary between algebraic positional structure and empirical long-context
  behavior. The audited Linear Algebra prerequisite supplies finite-dimensional operators, unitary
  changes of basis, spectral/SVD discipline, and projection/reduction vocabulary. Shaw, Uszkoreit,
  and Vaswani (2018) are used as a primary precedent for relative-position representations inside
  self-attention. Raffel et al. (2020) are used as a primary precedent for learned scalar relative
  position biases in attention logits, with different learned relative position embeddings across
  attention heads. Atlas-owned material defines sequence-index relative-position operators, cyclic
  Fourier mode decomposition, the DC component, low-dimensional mode truncation, head-specific
  spectral profiles, and exact finite witnesses. No cited source establishes that every relative-position
  mechanism is circulant, that real sequence boundaries are periodic, that Fourier truncation is always
  optimal for task performance, or that head-specific spectral concentration implies semantic or causal
  specialization.

