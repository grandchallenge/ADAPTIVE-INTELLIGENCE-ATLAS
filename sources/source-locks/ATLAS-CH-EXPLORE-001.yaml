epistemic_rules:
  - "Exploration is purposeful action under epistemic uncertainty; random action is not automatically informative."
  - "Information gain is measured in information units and is not identical to value of information in reward or utility units."
  - "An action can have lower immediate expected reward and higher total decision value because it changes future decisions."
  - "Optimism, posterior sampling, and information-directed sampling are distinct mechanisms."
  - "A bandit observes partial action feedback; a general MDP additionally couples actions to state transitions."
  - "A constrained-exploration claim must state the constrained quantity, horizon, guarantee type, and model assumptions."
