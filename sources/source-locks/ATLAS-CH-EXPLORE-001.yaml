claim_boundary: >
  The external sources support representative stochastic-bandit exploration methods,
  posterior-probability allocation, information-directed sampling, decision-theoretic
  value of information, and one explicit constrained exploration formulation in
  unknown Markov decision processes. They do not establish one universally optimal
  exploration method and do not identify information gain with decision value.
