epistemic_rules:
  - "An experiment is an argument from a declared design and observations to a bounded claim; a run alone is not the argument."
  - "An estimand states what quantity is being estimated; a metric is only an observed summary until connected to that estimand."
  - "Randomization addresses assignment-related confounding under its design; it does not remove measurement error, implementation defects, selection effects, or external-validity limits."
  - "A baseline is any comparator; an ablation is a structured intervention that removes or changes a component relative to a reference system."
  - "Seed variation is conditional on the fixed data, code, environment, and sampling protocol; it is not a substitute for population or dataset uncertainty."
  - "A p-value is not an effect size and does not by itself establish practical importance."
  - "Computational reproducibility does not imply scientific validity, causal identification, replication, or generalization."
  - "Benchmark superiority does not by itself identify the mechanism responsible for the difference."
