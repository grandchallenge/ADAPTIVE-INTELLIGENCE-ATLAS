    authors: "Thomas M. Cover; Joy A. Thomas"
    publisher: "Wiley"
    year: 2006
    doi: "10.1002/047174882X"
    authority: "Entropy, KL divergence, mutual information, conditional information and information inequalities."
  - id: "INFO-WAINWRIGHT-JORDAN-2008"
