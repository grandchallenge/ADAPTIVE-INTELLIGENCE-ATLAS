epistemic_class: "audited_coordination_and_external_memory_prerequisites_plus_primary_agent_distributed_cognition_and_joint_activity_sources_plus_atlas_synthesis"
claim_boundary: >
  The audited Coordination prerequisite supplies the coordination object, communication/shared-state
  families, causal ordering, retry/deduplication, transaction boundaries, failure surfaces, and
  coordination-cost bookkeeping. The audited External Memory prerequisite supplies shared-memory
  scope, synchronization/version semantics, access control, provenance, and the distinction between
  common external memory and private model state. Wooldridge and Jennings (1995) are used for the
  agent-theory/architecture distinction and representative intelligent-agent framing. Hutchins (1995)
  is used for the precedent that cognitive/computational properties may be analyzed at a system level
  larger than an individual participant. Klein et al. (2004) are used for joint human-agent activity
  and the requirement that automated components function as team participants rather than isolated
  tools. Atlas-owned material defines the Computational Polity object, separates capability from
  authority, and supplies an exact two-specialist composition witness. No source establishes that
  larger systems are automatically more intelligent, that coordination guarantees correctness, or
  that validators, humans, shared memory, or governance are infallible.

