epistemic_rules:
  - "System capability is not the sum of component capabilities and must be demonstrated under declared composition rules."
  - "Communication and shared memory do not imply agreement, truth, freshness, or authority."
  - "Capability and authority are distinct: a component may generate a candidate result without having authority to commit it."
  - "A validator may reduce one error class without becoming an infallible oracle."
  - "Human participation does not remove the need for explicit interfaces, provenance, or bounded authority."
  - "Governance constrains admissible transitions; it is not itself evidence that a transition is correct."
