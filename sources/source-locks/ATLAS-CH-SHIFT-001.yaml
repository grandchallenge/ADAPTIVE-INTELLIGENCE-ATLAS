claim_boundary: >
  The audited Uncertainty chapter supplies calibration, coverage, selective-risk, and uncertainty objects only under their declared source-law assumptions. SHIFT independently types changed-law guarantees. Sugiyama, Krauledat, and Mueller support the covariate-shift/importance-weighting setting in which P_X and Q_X differ while P(Y|X)=Q(Y|X). Madry et al. support adversarial robustness formulated through robust optimization over a declared perturbation set. Exact finite changed-law, benign-marginal-shift, and adversarial-separation witnesses are Atlas-owned. No source is used to identify covariate shift, concept shift, adversarial perturbation, and structural shift as one object.

