epistemic_rules:
  - "K_m(A,r_0)=span{r_0,Ar_0,...,A^(m-1)r_0} is generated by a declared operator and starting residual/vector; an arbitrary m-dimensional subspace is not automatically a Krylov subspace."
  - "Arnoldi applies to general square matrices and produces an upper-Hessenberg projected relation; Lanczos is the symmetric/Hermitian specialization with a short three-term recurrence in exact arithmetic."
  - "Galerkin orthogonality, minimum-residual conditions, and minimum-error statements are distinct and must not be silently interchanged."
  - "A residual is computable from Ax and b, while the true error requires the unknown exact solution; residual and error are linked through conditioning/operator bounds, not equality."
  - "Exact-arithmetic orthogonality is not a finite-precision guarantee; practical Arnoldi/Lanczos implementations may require reorthogonalization or other stabilization."
  - "Preconditioning changes the effective operator/problem seen by the iteration; it is not equivalent to merely taking more iterations."
  - "Fast convergence can depend on spectrum, field of values, non-normality, right-hand side, preconditioner, and polynomial approximation structure; dimension alone does not determine convergence."
  - "Matrix-vector access can be sufficient for classical Krylov iteration; explicit dense matrix formation is not required when an operator action is available."
  - "Classical Krylov identities do not by themselves establish correctness or convergence of later learned Neural Krylov Transport mechanisms."
