claim_boundary: >
  The audited LINALG prerequisite supplies finite-dimensional linear maps,
  orthogonal projection, eigenvalue/SVD distinctions, norms, conditioning,
  and least-squares semantics. Arnoldi (1951), Lanczos (1950), and Saad
  (2003) support the classical Krylov-subspace, Arnoldi/Lanczos, projected
  solve, residual, and preconditioning machinery used here. The Atlas
  finite witness, chapter organization, and later neural interpretation
  boundaries are chapter-owned synthesis. No claim is made that low-dimensional
  Krylov spaces converge rapidly for arbitrary matrices, that small residual
  always implies small error, or that classical convergence theory transfers
  unchanged to learned nonlinear transport.

