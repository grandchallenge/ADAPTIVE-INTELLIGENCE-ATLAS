claim_boundary: >
  Manifold, tangent-space, geodesic, retraction, and vector-transport concepts are
  established mathematics in the cited geometry references. Residual-network and
  Neural-ODE architecture claims are limited to the cited primary sources, and
  dynamical-systems motivation for stable deep architectures is limited to the cited
  Haber-Ruthotto paper. The Atlas-owned contribution is the bounded synthesis that
  treats a sequence of declared representation maps as transport of representation
  state. This synthesis is not a theorem that arbitrary learned layers are exact ODE
  flows, geodesics, parallel transport, vector transport, or optimal transport.

