sources:
  - id: "TRANSPORT-LEE-2018"
    citation_key: "Lee2018Riemannian"
    kind: "monograph"
    title: "Introduction to Riemannian Manifolds"
    authority: "Standard manifold, tangent-space, geodesic, and differential-geometric background."
  - id: "TRANSPORT-ABSIL-2008"
    citation_key: "AbsilMahonySepulchre2008"
    kind: "monograph"
    title: "Optimization Algorithms on Matrix Manifolds"
    authority: >
      Standard source for retractions and vector transports; used to enforce the
      distinction between moving a point and transporting tangent information.
  - id: "TRANSPORT-RESNET-2016"
    citation_key: "HeZhangRenSun2016"
    kind: "peer-reviewed-conference"
    title: "Deep Residual Learning for Image Recognition"
    authority: >
      Primary source for residual blocks of identity plus learned residual and the
      empirical claims reported in that paper; not evidence that every residual block
      is an exact discretized flow.
  - id: "TRANSPORT-NEURAL-ODE-2018"
    citation_key: "ChenRubanovaBettencourtDuvenaud2018"
    kind: "peer-reviewed-conference"
    title: "Neural Ordinary Differential Equations"
    authority: >
      Primary source for architectures that explicitly define continuous-depth state
      evolution by an ODE and obtain outputs through numerical integration.
  - id: "TRANSPORT-HABER-RUTHOTTO-2018"
    citation_key: "HaberRuthotto2018"
    kind: "peer-reviewed-journal"
    title: "Stable Architectures for Deep Neural Networks"
    authority: >
      Source for dynamical-systems and discrete-ODE stability as an architecture-design
      lens; not an identity between generic deep networks and one continuous flow.

epistemic_rules:
  - "Representation transport means evolution of a declared representation state through declared maps; it is an Atlas synthesis term."
  - "State transport is distinct from vector transport between tangent spaces."
  - "State transport is distinct from parallel transport along a connection."
  - "Representation transport is not optimal transport of probability mass unless a probability-measure transport problem is explicitly posed."
  - "A retraction gives a feasible manifold endpoint; it is not generally the exponential map or geodesic flow."
  - "A residual update is not automatically an exact ODE step, and a finite stack need not have a unique underlying ODE."
  - "Layer-varying maps require a nonautonomous/stage-dependent reading."
  - "Constraint preservation does not imply information preservation, invertibility, stability, or task quality."
  - "A tangent vector at one base point cannot be silently reused as tangent data at a new base point."
  - "Order dependence in staged constrained updates is a property of the declared maps/path, not a universal theorem about all representation updates."
