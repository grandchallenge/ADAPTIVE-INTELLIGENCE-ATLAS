chapter_id: "ATLAS-CH-OPTIONALITY-001"
locked_on: "2026-10-03"
epistemic_class: "audited_regret_prerequisite_plus_established_irreversibility_viability_and_empowerment_precedents_plus_atlas_synthesis"
claim_boundary: >
  The locked sources support (i) the decision-theoretic importance of uncertainty
  combined with irreversible commitments, (ii) viability/state-constraint language,
  and (iii) empowerment as an information-theoretic measure of potential sensorimotor
  influence. The Atlas definitions of viable continuation classes, correction cost,
  tolerance-indexed correction capacity, and the finite witness are chapter-owned
  constructions. The sources do not establish that maximizing action count,
  empowerment, or delayed commitment is universally optimal, nor that these quantities
  are equivalent to regret, safety, robustness, or recoverability.
sources:
