epistemic_rules:
  - "Optionality is relative to a declared future horizon, feasibility/viability constraints, consequence equivalence, and future objective uncertainty."
  - "Raw action count is representation-sensitive; duplicate action aliases do not create new functional options."
  - "Correction capacity is defined against declared post-evidence targets or value tolerances and must expose hard infeasibility separately from soft recovery cost."
  - "Information gain and correction capacity are distinct: learning which world obtains is not sufficient if the required corrective action has already become infeasible."
  - "Empowerment is an information-theoretic influence quantity, not identical to viable-action count, target-specific correction capacity, regret, or safety."
  - "Preserving more options is not universally better; maintenance costs, risks, dominated actions, and irrelevant aliases can make larger option sets valueless or harmful."
  - "Irreversible action is distinct from a stochastic bad outcome: irreversibility concerns loss of reachable continuations or recovery paths."
