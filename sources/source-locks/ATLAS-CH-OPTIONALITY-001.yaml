    citation_key: "ArrowFisher1974"
    kind: "peer-reviewed-journal"
    title: "Environmental Preservation, Uncertainty, and Irreversibility"
    authors: "Kenneth J. Arrow; Anthony C. Fisher"
    journal: "The Quarterly Journal of Economics"
    volume: 88
    issue: 2
    pages: "312-319"
    year: 1974
    doi: "10.2307/1883074"
    authority: >
      Classical decision-under-uncertainty precedent showing why irreversible action
      and the prospect of later information can create value for preservation. Used
      only for that structural principle, not as a general theorem about adaptive
      intelligence.
  - id: "OPTIONALITY-AUBIN-1991"
    citation_key: "Aubin1991Viability"
    kind: "book"
    title: "Viability Theory"
    authors: "Jean-Pierre Aubin"
    publisher: "Birkhauser"
    year: 1991
    isbn: "978-1-4612-0451-8"
    authority: >
      Standard mathematical source for viability under state constraints and controlled
      dynamics. Used as conceptual precedent for separating feasible/viable continuation
      sets from reward value. The finite Atlas definitions are stated independently.
  - id: "OPTIONALITY-KLYUBIN-POLANI-NEHANIV-2008"
    citation_key: "KlyubinPolaniNehaniv2008"
    kind: "peer-reviewed-journal"
    title: "Keep Your Options Open: An Information-Based Driving Principle for Sensorimotor Systems"
    authors: "Alexander S. Klyubin; Daniel Polani; Chrystopher L. Nehaniv"
    journal: "PLoS ONE"
    volume: 3
    issue: 12
    pages: "e4018"
    year: 2008
    doi: "10.1371/journal.pone.0004018"
    authority: >
      Primary source for empowerment as channel capacity over action-to-future-sensor
      influence and for the explicit options-open interpretation. Used to contrast
      information-theoretic influence with the chapter's target- and feasibility-based
      correction capacity.
