claim_boundary: >
  The external sources support axiomatic program reasoning, formal specification and
  state-based verification, the LCF-style small trusted-kernel architecture, and Lean
  as an interactive theorem prover based on dependent type theory with a small trusted
  kernel. They do not establish that a formally proved specification matches human intent,
  that a model checker proves properties beyond its declared model/scope, or that machine
  checking eliminates all trust assumptions. The Atlas synthesis separates requirement,
  formal specification, model, proof object, checker/kernel, implementation, environment,
  and interpretation.
