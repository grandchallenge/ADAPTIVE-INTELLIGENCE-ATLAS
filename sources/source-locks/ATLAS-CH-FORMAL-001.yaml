epistemic_rules:
  - "A natural-language requirement and a formal specification are different objects connected by a semantic bridge."
  - "A proof establishes the formal theorem in its formal environment, not automatically the adequacy of the theorem as a statement of real-world intent."
  - "A test establishes only the tested executions unless an additional theorem lifts it."
  - "An invariant proof requires an initial-state obligation and a preservation obligation."
  - "A model checker proves or refutes properties only within the declared model, abstraction, bounds, and semantics of the tool."
  - "Automation may be large while the trusted proof-checking kernel remains small; the trust base must still be stated."
  - "A proof assistant's acceptance does not remove dependence on axioms, definitions, kernel correctness, compiler/runtime assumptions, or semantic adequacy."
  - "Replayability and formal checking are complementary but non-equivalent support routes."
