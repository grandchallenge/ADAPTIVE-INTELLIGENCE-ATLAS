epistemic_class: "audited_router_dynamics_prerequisite_plus_primary_online_learning_sources_plus_atlas_exact_churn_regret_witness"
claim_boundary: >
  ROUTERDYN-001 supplies typed temporal routing observables: router probabilities, preferred routes,
  accepted dispatch, loads, churn, probability drift, empirical expert-transition operators,
  specialization profiles, and local augmented-state diagnostics. Auer et al. (2002) are used as
  primary authority for adversarial/nonstochastic multi-armed bandit feedback and regret framing.
  Herbster and Warmuth (1998) are used as primary authority for comparator sequences that may switch
  among experts over time. Atlas-owned material defines the exact four-round routing witness,
  preferred-versus-accepted action semantics, feasible-action optionality, switch-budget correction
  capacity, and metric firewalls. No cited source establishes that low router churn implies low regret,
  that high churn implies poor task loss, or that capacity-balanced routing is online-optimal.

