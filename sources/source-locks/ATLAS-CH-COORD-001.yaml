epistemic_rules:
  - "Communication does not imply agreement."
  - "Shared state does not imply a consistent view of that state."
  - "Delivery does not imply exactly-once effect."
  - "A total order imposed by a system is stronger than the causal partial order the application may actually require."
  - "Transactions group effects under declared atomicity/recovery semantics; they are not a universal cure for distributed failure."
  - "A blackboard or tuple space is a coordination substrate, not an epistemic authority."
  - "Retry requires an explicit idempotence or deduplication story when duplicate effects matter."
  - "Coordination cost is part of the system, not free infrastructure."
