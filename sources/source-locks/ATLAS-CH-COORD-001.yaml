claim_boundary: >
  The external sources support representative coordination mechanisms: actor-style
  message passing, communicating sequential processes and rendezvous, Linda tuple
  spaces, blackboard systems, causal partial ordering, and transaction semantics.
  They do not establish that one mechanism is universally optimal or that coordination
  automatically creates agreement, consistency, reliability, or intelligence.
  The Atlas coordination tuple, architecture comparison, lost-update witness, and
  downstream handoff are chapter-owned synthesis built on the audited single-agent loop.
sources:
  - id: "COORD-ACTOR-1973"
    kind: "peer-reviewed-conference"
    title: "A Universal Modular ACTOR Formalism for Artificial Intelligence"
    authors: "Carl Hewitt; Peter Bishop; Richard Steiger"
    venue: "IJCAI"
    year: 1973
    proceedings: "Third International Joint Conference on Artificial Intelligence"
    authority: >
      Primary early source for actor-based modular computation in which independent
      computational actors interact through message-like activation and behavior.
  - id: "COORD-CSP-1978"
    kind: "peer-reviewed-journal"
    title: "Communicating Sequential Processes"
    author: "C. A. R. Hoare"
    journal: "Communications of the ACM"
    volume: 21
    issue: 8
    pages: "666-677"
    year: 1978
    doi: "10.1145/359576.359585"
    authority: >
      Primary source for communication as a structuring primitive for parallel
      sequential processes and for synchronized communication/rendezvous semantics.
  - id: "COORD-LINDA-1989"
    kind: "peer-reviewed-journal"
    title: "Linda in Context"
    authors: "Nicholas Carriero; David Gelernter"
    journal: "Communications of the ACM"
    volume: 32
    issue: 4
    pages: "444-458"
    year: 1989
    doi: "10.1145/63334.63337"
    authority: >
      Primary source for generative communication through a logically shared
      associative tuple space, including out, read, and destructive input operations.
  - id: "COORD-BLACKBOARD-1986"
    kind: "peer-reviewed-journal"
    title: "The Blackboard Model of Problem Solving and the Evolution of Blackboard Architectures"
    author: "H. Penny Nii"
    journal: "AI Magazine"
    volume: 7
    issue: 2
    pages: "38-53"
    year: 1986
    doi: "10.1609/aimag.v7i2.537"
    authority: >
      Primary retrospective source defining the blackboard model of problem solving
      and describing the evolution of blackboard architectures.
  - id: "COORD-LAMPORT-1978"
    kind: "peer-reviewed-journal"
    title: "Time, Clocks, and the Ordering of Events in a Distributed System"
    author: "Leslie Lamport"
    journal: "Communications of the ACM"
    volume: 21
    issue: 7
    pages: "558-565"
    year: 1978
    doi: "10.1145/359545.359563"
    authority: >
      Primary source for the happens-before relation, causal partial ordering of events,
      and logical clocks in distributed systems.
  - id: "COORD-GRAY-1981"
    kind: "peer-reviewed-conference"
    title: "The Transaction Concept: Virtues and Limitations"
    author: "Jim Gray"
    venue: "7th International Conference on Very Large Data Bases"
    pages: "144-154"
    year: 1981
    authority: >
      Primary transaction-processing source used here for atomic units of work,
      consistency/recovery motivation, and the distinction between concurrent execution
      and transaction semantics.
