claim_boundary: >
  These sources support the standard finite-dimensional linear algebra and numerical
  linear algebra used by the Atlas: linear maps, subspaces, projections, SVD,
  eigendecomposition, pseudoinverses, low-rank approximation, operator norms,
  conditioning and structured matrix computation. They do not by themselves support
  later neural-network interpretations.
