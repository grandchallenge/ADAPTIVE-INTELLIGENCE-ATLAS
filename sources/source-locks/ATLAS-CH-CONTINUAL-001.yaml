epistemic_rules:
  - "Forgetting is a change in retained task performance under a declared sequential protocol; parameter movement alone is not forgetting."
  - "Catastrophic forgetting is not every negative performance change; the evaluation protocol and magnitude must be stated."
  - "Replay changes the learning objective through remembered or regenerated data; EWC changes it through a parameter-space penalty."
  - "EWC uses an approximate local importance model and is not an exact retention guarantee."
  - "Gradient constraints, replay, consolidation, and parameter isolation are distinct anti-interference mechanisms."
  - "Parameter isolation can prevent direct overwrite on frozen parameters but consumes capacity and may require task/context routing."
  - "Average forgetting and worst-task forgetting answer different questions."
  - "Task-, domain-, and class-incremental settings must not be compared as if the evaluator exposes the same context information."
