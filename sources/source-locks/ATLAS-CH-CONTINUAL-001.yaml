claim_boundary: >
  The external sources support catastrophic interference under sequential learning,
  elastic weight consolidation as a Fisher-weighted quadratic parameter penalty,
  exemplar/rehearsal mechanisms in class-incremental learning, episodic-memory gradient
  constraints, parameter isolation by iterative pruning, and the task/domain/class
  incremental scenario distinction. They do not establish a universal best continual-
  learning method, exact retention guarantees for the cited deep-learning mechanisms,
  or that any one benchmark score captures all forgetting and transfer behavior.
sources:
  - id: "CONTINUAL-MCCLOSKEY-COHEN-1989"
    citation_key: "McCloskeyCohen1989"
    kind: "book-chapter"
    title: "Catastrophic Interference in Connectionist Networks: The Sequential Learning Problem"
    authors: "Michael McCloskey; Neal J. Cohen"
    book: "Psychology of Learning and Motivation"
    volume: 24
    pages: "109-165"
    year: 1989
    publisher: "Academic Press"
    doi: "10.1016/S0079-7421(08)60536-8"
    authority: >
      Foundational source for catastrophic interference in connectionist networks under
      sequential learning. Used to motivate the phenomenon, not to define every modern
      continual-learning benchmark.
  - id: "CONTINUAL-KIRKPATRICK-ETAL-2017"
    citation_key: "KirkpatrickEtAl2017EWC"
    kind: "peer-reviewed-journal"
    title: "Overcoming catastrophic forgetting in neural networks"
    authors: "James Kirkpatrick et al."
