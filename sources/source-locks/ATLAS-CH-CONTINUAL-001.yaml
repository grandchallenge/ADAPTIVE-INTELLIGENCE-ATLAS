    volume: 114
    issue: 13
    pages: "3521-3526"
    year: 2017
    doi: "10.1073/pnas.1611835114"
    authority: >
      Primary source for Elastic Weight Consolidation (EWC): a soft quadratic penalty
      anchoring parameters to earlier solutions with parameter importance approximated
      using the diagonal Fisher information. Used as an approximate consolidation
      mechanism, not as an exact no-forgetting theorem.
