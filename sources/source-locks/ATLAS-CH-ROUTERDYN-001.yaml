claim_boundary: >
  The audited Mixture-of-Experts prerequisite supplies the distinction among router logits/probabilities,
  preferred top-k routes, accepted dispatch, probability mass, realized load, capacity/overflow semantics,
  and specialization/collapse claims. The audited Optimizer-State Dynamics prerequisite supplies augmented-state,
  local Jacobian, non-normal transient-growth, time-varying product, and finite-horizon diagnostic boundaries.
  Zoph et al. (2022) are used as a primary precedent for sparse-model training instability, router-logit
  stabilization through the router z-loss, and source-specific specialization observations.
  Zhou et al. (2022) are used as a primary precedent for routing-rule dependence of load, token-to-expert
  assignment, and under/over-specialization concerns. Atlas-owned material defines temporal router diagnostics,
  assignment-overlap/churn measures, empirical expert-transition matrices, commutator diagnostics for successive
  local router-state maps, and finite counterexamples showing that stable loads or singular values need not imply
  stable token assignments. No cited source establishes a universal scalar router-health score, a universal
  specialization metric, or a theorem that observed router churn causes downstream loss.

