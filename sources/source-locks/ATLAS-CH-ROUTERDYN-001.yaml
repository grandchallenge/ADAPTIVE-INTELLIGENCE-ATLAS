epistemic_rules:
  - "Router probability dynamics, preferred-route dynamics, accepted-dispatch dynamics, and realized-load dynamics are distinct observables."
  - "Stable load balance does not imply stable token-to-expert assignment."
  - "Zero preferred-route churn does not imply zero probability drift."
  - "Specialization requires a declared token/task taxonomy or representation-level criterion; load concentration alone is not semantic specialization."
  - "A nonzero commutator of successive local router-state maps diagnoses order sensitivity of those maps; it does not by itself identify a causal training mechanism."
  - "Spectral summaries are diagnostic objects, not universal scalar health scores."
  - "Local router-state linearizations inherit the OPTDYN boundary: they are local and need not globally predict nonlinear stochastic training."
