claim_boundary: >
  This chapter inherits the audited controlled-stochastic substrate from RLBASE-001 and the
  audited probability/information substrate from INFO-001. The new load-bearing mathematics is
  Atlas-owned: exact covariance propagation for an affine local decision-error functional, exact
  finite Rademacher witnesses showing covariance amplification and cancellation, and a local
  first-order extension for differentiable nonlinear decision maps. No new external academic
  source is required for those algebraic identities. The chapter must not treat statistical
  covariance/dependence as causal attribution, must not assume independence without evidence,
  and must not promote a local linearized propagation formula into a global theorem about a
  nonlinear sequential decision system.

