epistemic_rules:
  - "A frontier question is not a result."
  - "Architecture status is not empirical confirmation."
  - "draft-v0.1 means the local chapter has passed its bounded audit; it does not certify downstream hypotheses."
  - "Bounded evidence must remain bound to its exact object, setting, and target identity."
  - "The Residual is capability-, transformation-, descriptor-, and recovery-class-relative unless a stronger theorem proves otherwise."
  - "Boundary-contract language does not imply global safety or current public implementation of every remembered GCL extension."
  - "Shared memory is not equivalent to storing all knowledge outside weights."
  - "Learning progress as a search signal is not proof of long-horizon curriculum optimality."
  - "Adaptive depth is not merely a deeper fixed computation."
  - "Operator-valued position is not established merely by ordinary RoPE algebra."
  - "Benign nonconvexity is a research programme unless explicit landscape conditions and optimizer behavior are proved in a declared setting."
  - "This chapter must not pre-empt ATLAS-CH-SYNTHESIS-001."
