claim_boundary: >
  This chapter is an Atlas-owned research-programme map. It inherits only the exact
  audited substrate of Governed Adaptation, the Residual, and Boundary Contracts,
  plus the project-local Atlas Map, source inventory, rollout plan, and Chapter Ledger
  snapshot at protected baseline 1f1aec7e7734f28b7b44db380357634085960aa0.
  Architecture-stage programme entries are research questions, not established results.
  A draft-v0.1 chapter may supply audited substrate for a frontier question without
  proving the frontier hypothesis itself. Live GCL names are used only where already
  represented in source-locked Atlas material or the project inventory. No claim is made
  that the named programmes are complete theories, that current evidence generalizes
  beyond its declared setting, or that the final Atlas synthesis has already been earned.

