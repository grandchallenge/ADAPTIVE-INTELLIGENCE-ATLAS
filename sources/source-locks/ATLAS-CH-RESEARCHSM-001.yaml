claim_boundary: >
  The audited Atlas prerequisites support replayable evidence/authority separation,
  transition-system semantics, invariants, safety/liveness distinctions, trust-base
  accounting, and the separation of theorem checking from institutional authority.
  The pinned public GCL artifacts document one concrete research workflow with bounded
  returns, protected lifecycle states, fail-closed promotion, separate frontier
  advancement, and controlled independent-intelligence intake. The Atlas research
  state-machine object, idempotent intake operator, typed promotion guards, and finite
  witness are chapter-owned constructions. This chapter does not claim that GCL's
  workflow is uniquely correct, that separate actor labels prove independence, or that
  workflow conformance establishes mathematical truth.
