epistemic_rules:
  - "Research state is a typed machine state, not an informal phrase such as done, verified, or approved."
  - "Receipt, structural acceptance, replay, adjudication, promotion, successor authorization, and certification are distinct transitions unless a governing instrument explicitly composes them."
  - "Idempotence applies to a declared mutation keyed by stable identity; it does not mean every repeated computation or review must return the same scientific judgment."
  - "A duplicate delivery of the same immutable evidence object must not create a second canonical promotion effect."
  - "Conflicting evidence with the same dispatch identity but a different immutable result identity is not a duplicate and must not be silently overwritten."
  - "Actor independence is a governed relation among actor, artifact, information flow, and claim; distinct labels alone do not prove independence."
  - "Promotion guards may include provenance, replay, adjudication, authority, and separation-of-duty predicates; successful execution alone is insufficient."
  - "A contributor's next-residual suggestion is evidence, not programme scheduling authority."
  - "Failure states should preserve the last protected evidence state unless the governing transition explicitly authorizes mutation."
