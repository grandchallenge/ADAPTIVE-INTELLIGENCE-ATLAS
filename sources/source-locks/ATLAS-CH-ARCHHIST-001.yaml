epistemic_rules:
  - "Historical significance is used only to expose a structural idea consumed later by the Atlas."
  - "Architectural chronology is not used as an argument that later architectures are universally better."
  - "Convolutional equivariance is proved for the declared mathematical convolution/shift model, not inferred solely from application history."
  - "Recurrent state evolution is distinct from an autonomous continuous flow."
  - "Residual update x_{k+1}=x_k+F_k(x_k) supports a dynamical/integrator lens but does not by itself identify one underlying ODE."
  - "Neural ODEs are a specific continuous-depth architecture family, not a theorem that all depth is continuous time."
