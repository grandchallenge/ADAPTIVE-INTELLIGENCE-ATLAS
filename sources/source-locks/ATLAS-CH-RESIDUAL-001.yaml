claim_boundary: >
  Statistical sufficiency, minimal sufficiency, information bottleneck ideas, and
  task-relative minimal/invariant representations are established external concepts
  in their cited settings. The Residual defined by this chapter is an Atlas/GCL
  generalization: a proposed minimal transferable structure sufficient to reconstruct
  a declared capability after admissible representation change. No theorem is claimed
  that such a Residual exists, is unique, finite-dimensional, or efficiently computable
  for arbitrary neural systems.
