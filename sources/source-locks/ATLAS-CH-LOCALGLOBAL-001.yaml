claim_boundary: >
  This chapter introduces only the local-to-global structure needed later: incidence/cover
  structure, local sections, restriction maps, matching/compatibility, unique gluing,
  explicit incompatibility, and a minimal graph/cellular-sheaf viewpoint. It does not
  develop derived functors, full cohomology theory, descent beyond ordinary sheaves, or
  claim that every distributed-learning, compositional, or data-fusion problem is naturally
  a sheaf problem.
