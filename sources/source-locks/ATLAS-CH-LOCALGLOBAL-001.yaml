epistemic_rules:
  - "A graph or cover is incidence/topological structure; a sheaf also specifies data/stalks and restriction maps over that structure."
  - "A local section is data on one region/cell-context, not automatically a global assignment."
  - "Compatibility is tested after restriction to overlaps/common faces."
  - "For a sheaf, a compatible family over a cover has a unique global glue; existence and uniqueness are both load-bearing parts of the sheaf condition."
  - "An arbitrary presheaf or local constraint system need not admit a global glue for every locally compatible-looking family."
  - "An explicit nonzero overlap discrepancy is an obstruction to gluing in the finite function witness."
  - "Approximate consistency is distinct from exact sheaf compatibility and requires an explicit metric/optimization criterion."
  - "Sheaf language is used as a precise local-to-global tool, not as decorative terminology or a universal ontology."
