exact_witness_contract:
  system_gain_budget: "tau = 2"
  failure_pair:
    A: "diag(3/2, 2/3)"
    B: "[[0, 3/2], [2/3, 0]]"
    individual_norms: "||A||_2 = ||B||_2 = 3/2"
    chronological_A_then_B: "BA = [[0,1],[1,0]], ||BA||_2 = 1"
    chronological_B_then_A: "AB = [[0,9/4],[4/9,0]], ||AB||_2 = 9/4"
    consequence: >
      The same two locally valid components satisfy the system gain budget in
      one chronological order and violate it in the reverse order. Product labels
      remain right-to-left for column-vector action.
  commuting_control:
    Ac: "diag(3/2, 2/3)"
    Bc: "diag(2/3, 3/2)"
    individual_norms: "||Ac||_2 = ||Bc||_2 = 3/2"
    commutator: "[Ac,Bc] = 0"
    composition: "Ac Bc = Bc Ac = I"
    consequence: "Both chronological orders have gain 1 and satisfy tau = 2."

epistemic_rules:
  - "Passing every component-local contract does not by itself establish a system-level contract unless the composition rule and budget are proved."
  - "For column-vector states, chronological f then g is represented by the product J_g J_f; product-order labels must not be used as chronological prose."
  - "A product bound ||J_g J_f|| <= ||J_g|| ||J_f|| is a valid local upper bound but can be loose."
  - "A local Jacobian or finite-domain Lipschitz bound is not automatically a global nonlinear safety theorem."
  - "Component error budgets compose only under an explicit connecting-domain assumption and a stated downstream Lipschitz/sensitivity bound."
  - "Noncommutativity can make ordering decisive; commutativity removes order dependence only in the declared setting."
  - "The exact finite witnesses do not imply that arbitrary learned neural modules have the same linear structure."
  - "Compatibility must include semantics, domains, invariants, sensitivities, and numerical/error budgets; matching tensor shapes is insufficient."
  - "A local certificate is evidence for its declared obligation and operating region, not a universal compositional certificate."
