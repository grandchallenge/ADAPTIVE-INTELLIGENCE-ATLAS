claim_boundary: >
  This chapter inherits only the audited Boundary Contracts and Split-Operator
  Networks interfaces. Boundary Contracts supplies semantic/geometric/differential/
  numerical obligation classes, Jacobian-chain composition, local sensitivity
  bounds, conditioning discipline, separator sufficiency questions, and the
  firewall between local evidence and global safety. Split-Operator Networks
  supplies exact finite-dimensional order/noncommutativity results, product-order
  versus chronological-order discipline, commuting controls, and the firewall
  preventing classical splitting guarantees from transferring automatically to
  learned blocks. The new COMPOSE material consists of Atlas-owned exact finite
  witnesses and elementary triangle-inequality/operator-norm derivations showing
  how individually valid local contracts can be insufficient for a system-level
  composition obligation. No universal compositional-safety theorem, neural
  convergence theorem, or contract calculus is claimed.

