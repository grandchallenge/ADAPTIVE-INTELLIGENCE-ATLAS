epistemic_rules:
  - "Parameter sparsity, activation sparsity, token sparsity, expert/block sparsity, and conditional depth are distinct objects."
  - "Static sparsity can be identical across inputs; conditional computation is input- or state-dependent execution."
  - "A soft gate is not realized sparse execution when the gated branch must still be computed."
  - "Nominal FLOPs, executed operators, memory traffic, communication, kernel-launch overhead, latency, throughput, and energy are distinct resource measures."
  - "Average executed compute does not determine peak or tail compute."
  - "A routing decision and the computation selected by that decision are separate objects."
  - "Training-time support may be denser than inference-time execution and must be reported separately."
  - "A measured hardware speedup is device/software/batch-shape dependent and must not be promoted to a hardware-independent theorem."
