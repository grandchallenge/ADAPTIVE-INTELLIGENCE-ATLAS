chapter_id: "ATLAS-CH-SPARSE-001"
locked_on: "2026-10-03"
epistemic_class: "established_sparse_and_conditional_computation_mechanisms_plus_atlas_synthesis"
claim_boundary: >
  The external sources support representative mechanisms for parameter pruning,
  spatially adaptive computation, input-dependent block skipping, dynamic token
  sparsification, and hardware performance modeling. They do not establish that
  nominal FLOP reduction implies wall-clock speedup on every device, that every
  soft gate yields sparse execution, or that conditional computation universally
  improves quality-efficiency tradeoffs. The Atlas synthesis is the separation of
  static sparsity, input-dependent routing, executed work, resource vectors, and
  realized hardware cost.
sources:
