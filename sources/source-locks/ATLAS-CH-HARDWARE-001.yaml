epistemic_rules:
  - "FLOP count is a mathematical-operation accounting convention, not a runtime prediction."
  - "Arithmetic intensity requires a declared data-movement boundary and byte-count convention."
  - "The Roofline expression is an upper-bound model; observed performance can lie below the roof for many reasons."
  - "Equal mathematical work or equal FLOP count does not imply equal memory traffic or latency."
  - "A memory-space hierarchy is architecture/programming-model specific; CUDA terminology is not silently universalized."
  - "Tensor/matrix acceleration applies only to supported shapes, data types, layouts, and execution conditions."
  - "Occupancy or active-warp count is not itself application performance."
  - "Reduced precision changes representation and rounding behavior; smaller formats do not guarantee acceptable numerical error."
  - "Kernel fusion may reduce intermediate traffic, but semantic equivalence must be checked independently."
  - "Distributed communication, serving, KV-cache systems behavior, and multi-device scaling belong downstream in SYSTEMS-001."
