claim_boundary: >
  The audited Linear Algebra prerequisite supplies matrix multiplication, operator
  and norm language, and the distinction between an abstract linear map and one
  coordinate implementation. Williams, Waterman, and Patterson support the classical
  Roofline relation among floating-point throughput, memory bandwidth, arithmetic
  intensity, and attainable performance bounds. Current NVIDIA CUDA programming and
  best-practices documentation is used as an authoritative vendor source for CUDA's
  execution model, memory spaces, shared/register/global-memory distinctions,
  warp-level matrix operations, bandwidth-oriented optimization, occupancy/resource
  constraints, and floating-point precision cautions. Vendor documentation is not
  treated as a universal GPU architecture theorem. Device limits and throughput
  figures are generation-specific unless separately locked. The finite traffic
  witness in this chapter uses an explicitly declared idealized accounting model and
  is not a benchmark.

