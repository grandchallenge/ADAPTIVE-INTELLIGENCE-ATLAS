epistemic_rules:
  - "A claim and its support route are distinct objects."
  - "Support is scoped; it is not silently identical to logical entailment."
  - "The Atlas epistemic classes form a vocabulary of roles, not a single scalar ranking."
  - "Changing presentation does not promote a claim."
  - "Changing epistemic status requires support adequate to the stronger claim."
  - "Exact or reproducible computation does not become proof merely by being exact or reproducible."
  - "Observation does not silently become mechanism, prevalence, or universality."
  - "Interpretation must remain separable from the evidence interpreted."
  - "Public project evidence requires exact public identity; programme context does not substitute for it."
  - "Institutional status records governance state and is not mathematical truth."
