claim_boundary: >
  This chapter defines the Atlas project-local grammar for claims, support routes,
  epistemic labels, computational witnesses, observations, interpretations, conjectures,
  programmes, and institutional states. It is not offered as a universal theory of
  scientific epistemology and it does not promote project governance vocabulary into
  external mathematical truth.
