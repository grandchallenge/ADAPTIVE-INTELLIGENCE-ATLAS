epistemic_rules:
  - "Retrieval is a read/access operation over stored records; it does not by itself determine storage locus, lifetime, truth, or authority."
  - "Exact-key lookup, symbolic predicate selection, and vector similarity search are distinct read contracts."
  - "A similarity score orders candidates under a declared representation and metric; it is not automatically a calibrated relevance probability."
  - "Top-k selection is a truncation operator over scores and does not prove that omitted records are irrelevant."
  - "Approximate nearest-neighbor search is an algorithmic acceleration/approximation layer and must not be silently equated with exact nearest-neighbor semantics."
  - "Hybrid retrieval requires an explicit composition rule such as filter-then-rank, rank-then-filter, score fusion, or staged retrieval."
  - "Multiple indices over one underlying record set do not create multiple epistemic copies of the record; record identity and index identity remain separate."
  - "Provenance belongs to the record/evidence object and must not be inferred solely from retrieval rank."
  - "Downstream usefulness depends on the consumer and task; retrieval correctness and context usefulness are distinct."
