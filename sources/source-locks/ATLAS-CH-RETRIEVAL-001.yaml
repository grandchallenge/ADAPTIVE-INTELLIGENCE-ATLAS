locked_on: "2026-10-03"
epistemic_class: "established_information_retrieval_database_vector_search_key_value_plus_atlas_synthesis"
claim_boundary: >
  The external sources support vector-space retrieval, relational/symbolic data access,
  approximate nearest-neighbor indexing, one inverted multi-index construction, exact
  key-value store semantics, and retrieval-augmented access to explicit non-parametric
  memory. They do not establish that similarity implies semantic correctness, that top-k
  scores are calibrated relevance probabilities, that approximate search equals exact
  nearest-neighbor search, or that one hybrid composition rule is universally optimal.
