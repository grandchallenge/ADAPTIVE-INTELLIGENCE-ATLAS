name: OWI-EC005O versioned native moderation evaluator

on:
  pull_request:
    paths:
      - 'experiments/owi_ec005_versioned_moderation*.py'
      - 'tests/test_owi_ec005_versioned_moderation*.py'
      - 'governance/research/OWI_EC005O_REVISED_MODERATION_V1.json'
      - 'mathematics/research-notes/OWI-EC005O-VERSIONED-MODERATION-20261114.md'
      - '.github/workflows/owi-ec005-versioned-moderation.yml'
      - 'governance/ci_components/owi_ec005.json'
      - 'governance/ci_routing_baseline.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source-state-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Full pinned dataset and sealed TRAIN family validation
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python experiments/owi_ec005_realtools_family_prepare.py \
            --indices 710 --output-dir "$RUNNER_TEMP/owi_ec005o"
      - name: Restricted original class private-state structural keys only
        shell: bash
        run: |
          set -euo pipefail
          docker pull python@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
          python experiments/owi_ec005_versioned_moderation_layout.py \
            --input-dir "$RUNNER_TEMP/owi_ec005o"
