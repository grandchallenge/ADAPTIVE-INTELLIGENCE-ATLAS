name: OWI-EC005 genuine tool-environment intake and leakage gate

on:
  pull_request:
    paths:
      - 'experiments/owi_ec005_realtools_*.py'
      - 'tests/test_owi_ec005_realtools_*.py'
      - 'governance/ci_components/owi_ec005.json'
      - 'governance/ci_routing_baseline.json'
      - 'mathematics/research-notes/OWI-EC005-REAL-TOOL-BENCHMARK-20261113.md'
      - '.github/workflows/owi-ec005-realtools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-isolation-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Offline adversarial source-isolation invariants
        run: python -m unittest discover -s tests -p 'test_owi_ec005_realtools_intake.py' -v
      - name: Compile intake source
        run: python -m py_compile experiments/owi_ec005_realtools_intake.py experiments/owi_ec005_realtools_schema.py experiments/owi_ec005_realtools_split.py experiments/owi_ec005_realtools_select.py experiments/owi_ec005_realtools_sandbox.py

  real-corpus-read-only-preflight:
    needs: source-isolation-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Source SHA and full-corpus schema inventory without executing environment code
        run: |
          set -euo pipefail
          python experiments/owi_ec005_realtools_intake.py \
            --output build/owi_ec005_realtools/source_inventory.json
          python experiments/owi_ec005_realtools_schema.py \
            --output build/owi_ec005_realtools/ast_schema.json
          python experiments/owi_ec005_realtools_split.py \
            --output build/owi_ec005_realtools/group_split.json
          python - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('build/owi_ec005_realtools/source_inventory.json').read_text())
          assert len(row['revision'])==40
          assert row['counts']['valid_tasks'] >= 1
          assert row['no_private_payload_published']
          assert row['training']=='NOT_PERFORMED'
          print('SOURCE_INTAKE_READBACK',row['revision'],row['raw_file_sha256'],
                row['counts']['valid_tasks'])
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owi-ec005-real-corpus-schema-no-private-content
          path: |
            build/owi_ec005_realtools/source_inventory.json
            build/owi_ec005_realtools/ast_schema.json
            build/owi_ec005_realtools/group_split.json
          retention-days: 30

  isolated-real-tool-execution:
    needs: real-corpus-read-only-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify source digest and select verifier-free actual environment
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python experiments/owi_ec005_realtools_select.py --output "$RUNNER_TEMP/owi-ec005-real-env.json"
      - name: Execute one actual read-only declared API inside no-network Docker jail
        shell: bash
        run: |
          set -euo pipefail
          docker pull python@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
          docker image inspect python@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df --format 'IMAGE_RESOLVED_DIGEST={{index .RepoDigests 0}}'
          docker run --rm --network none --cap-drop ALL \
            --security-opt no-new-privileges --read-only \
            --user 65534:65534 --pids-limit 64 --memory 768m --cpus 1 \
            --tmpfs /tmp:rw,nosuid,nodev,size=32m \
            --mount "type=bind,src=$PWD/experiments/owi_ec005_realtools_sandbox.py,dst=/worker.py,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/owi-ec005-real-env.json,dst=/task.json,readonly" \
            python@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df python /worker.py /task.json > "$RUNNER_TEMP/owi-ec005-tool-smoke.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ['RUNNER_TEMP'])/'owi-ec005-tool-smoke.json').read_text())
          assert x['actual_python_tool_invoked'] and not x['verifier_evaluated']
          assert x['outcome_only_policy_trained'] is False
          print('RESTRICTED_REAL_TOOL_EXECUTION',json.dumps(x,sort_keys=True))
          PY
