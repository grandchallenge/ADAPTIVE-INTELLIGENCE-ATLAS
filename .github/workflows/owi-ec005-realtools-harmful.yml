name: OWI-EC005I source-locked harmful intervention study

on:
  pull_request:
    paths:
      - 'experiments/owi_ec005_realtools_harmful_*.py'
      - 'tests/test_owi_ec005_realtools_harmful_*.py'
      - 'mathematics/research-notes/OWI-EC005I-HARMFUL-20261113.md'
      - '.github/workflows/owi-ec005-realtools-harmful.yml'
      - 'governance/ci_components/owi_ec005.json'
      - 'governance/ci_routing_baseline.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-state-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Assert private-source confidentiality and public-only target derivation
        run: |
          python -m unittest discover -s tests -p 'test_owi_ec005_realtools_harmful_audit.py' -v
          python -m unittest discover -s tests -p 'test_owi_ec005_realtools_harmful_variants.py' -v
          python -m unittest discover -s tests -p 'test_owi_ec005_realtools_harmful_knownid.py' -v
          python -m py_compile experiments/owi_ec005_realtools_harmful_audit.py
      - name: Verify all source bytes and audit only sensitive record schema
        run: |
          python experiments/owi_ec005_realtools_harmful_audit.py --row 0
          python experiments/owi_ec005_realtools_harmful_audit.py --row 8


  controlled-link-public-replay:
    needs: bounded-state-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify full pinned dataset before guarded controlled variants
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python experiments/owi_ec005_realtools_harmful_variants.py \
            --output-dir "$RUNNER_TEMP/owi_ec005i_links"
      - name: Real public link-check observation under restricted no-network Docker
        shell: bash
        run: |
          set -euo pipefail
          docker pull python@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
          python experiments/owi_ec005_realtools_harmful_probe.py \
            --input-dir "$RUNNER_TEMP/owi_ec005i_links"


  known-id-actual-harm-canary:
    needs: bounded-state-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Full raw source verification and sealed row-8 controlled variants
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python experiments/owi_ec005_realtools_harmful_knownid.py \
            --output-dir "$RUNNER_TEMP/owi_ec005i_knownid"
      - name: Replay real link checks and deliberately unchecked source-class cancellation
        shell: bash
        run: |
          set -euo pipefail
          docker pull python@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
          python experiments/owi_ec005_realtools_harmful_canary.py \
            --input-dir "$RUNNER_TEMP/owi_ec005i_knownid"
