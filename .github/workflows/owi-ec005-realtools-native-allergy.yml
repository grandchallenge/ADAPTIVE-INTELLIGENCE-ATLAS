name: OWI-EC005L unchanged native allergy safety contrast

on:
  pull_request:
    paths:
      - 'experiments/owi_ec005_realtools_native_allergy_*.py'
      - 'tests/test_owi_ec005_realtools_native_allergy_*.py'
      - '.github/workflows/owi-ec005-realtools-native-allergy.yml'
      - 'mathematics/research-notes/OWI-EC005L-NATIVE-ALLERGY-20261113.md'
      - 'governance/ci_components/owi_ec005.json'
      - 'governance/ci_routing_baseline.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-privacy-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Public-only patient allergy records, source lock, typed action tests
        run: |
          python -m unittest discover -s tests -p 'test_owi_ec005_realtools_native_allergy_probe.py' -v
          python -m unittest discover -s tests -p 'test_owi_ec005_realtools_native_allergy_canary.py' -v
          python -m py_compile experiments/owi_ec005_realtools_native_allergy_probe.py experiments/owi_ec005_realtools_native_allergy_canary.py

  pinned-public-allergy-observation:
    needs: source-and-privacy-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Full 2,550-task pin and original training-family 2449 bundle
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python experiments/owi_ec005_realtools_family_prepare.py \
            --indices 2449 --output-dir "$RUNNER_TEMP/owi_ec005l_native"
      - name: Read genuine allergy record through restricted original source class
        shell: bash
        run: |
          set -euo pipefail
          docker pull python@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
          python experiments/owi_ec005_realtools_native_allergy_probe.py \
            --input-dir "$RUNNER_TEMP/owi_ec005l_native"

      - name: Run real native Penicillin allergy retention versus prohibited deletion
        shell: bash
        run: |
          set -euo pipefail
          python experiments/owi_ec005_realtools_native_allergy_canary.py \
            --input-dir "$RUNNER_TEMP/owi_ec005l_native" \
            --output "build/owi_ec005_realtools/native_allergy_contrast.json"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("build/owi_ec005_realtools/native_allergy_contrast.json")
          r=json.loads(p.read_text())
          assert r["contract"]=="OWI-EC005L-NATIVE-CLINICAL-ALLERGY-RETENTION-CONTRAST/1"
          assert r["source_initial_state_original_unmodified"]
          assert r["source_checker_original_unmodified"]
          assert not r["custom_terminal_safety_penalty_added"]
          assert len(r["real_original_selected_action_episodes"])==8
          assert set(r["arms"])=={
              "stop","correct","delete_wrong","correct_then_delete"}
          assert all(x["original_native_checks_total"]==6
                     and not x["original_checker_or_state_used_by_selector"]
                     and not x["new_safety_reward_injected"]
                     for x in r["real_original_selected_action_episodes"])
          print("ORIGINAL_NATIVE_ALLERGY_ACTION_CONTRAST",
                json.dumps({k:v for k,v in r.items()
                            if k!="real_original_selected_action_episodes"},
                            sort_keys=True))
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owi-ec005l-original-clinical-allergy-checker-contrast
          path: build/owi_ec005_realtools/native_allergy_contrast.json
          retention-days: 30
