name: OWI-EC005L unchanged native allergy safety contrast

on:
  pull_request:
    paths:
      - 'experiments/owi_ec005_realtools_native_allergy_*.py'
      - 'tests/test_owi_ec005_realtools_native_allergy_*.py'
      - '.github/workflows/owi-ec005-realtools-native-allergy.yml'
      - 'mathematics/research-notes/OWI-EC005L-NATIVE-ALLERGY-20261113.md'
      - 'governance/ci_components/owi_ec005.json'
      - 'governance/ci_routing_baseline.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-privacy-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Public-only patient allergy records, source lock, typed action tests
        run: |
          python -m unittest discover -s tests -p 'test_owi_ec005_realtools_native_allergy_probe.py' -v
          python -m py_compile experiments/owi_ec005_realtools_native_allergy_probe.py

  pinned-public-allergy-observation:
    needs: source-and-privacy-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Full 2,550-task pin and original training-family 2449 bundle
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python experiments/owi_ec005_realtools_family_prepare.py \
            --indices 2449 --output-dir "$RUNNER_TEMP/owi_ec005l_native"
      - name: Read genuine allergy record through restricted original source class
        shell: bash
        run: |
          set -euo pipefail
          docker pull python@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
          python experiments/owi_ec005_realtools_native_allergy_probe.py \
            --input-dir "$RUNNER_TEMP/owi_ec005l_native"
