name: GSD evaluator tests

on:
  pull_request:
    paths:
      - "experiments/gsd-001/**"
      - ".github/workflows/gsd-ci.yml"
  push:
    branches: [main]
    paths:
      - "experiments/gsd-001/**"
      - ".github/workflows/gsd-ci.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r experiments/gsd-001/requirements-ci.txt
      - run: PYTHONPATH=experiments/gsd-001 pytest -q experiments/gsd-001/tests
