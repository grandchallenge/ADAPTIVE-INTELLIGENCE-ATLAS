name: OWI-EC005M original native claims authorization and verifier contrast

on:
  pull_request:
    paths:
      - 'experiments/owi_ec005_realtools_native_claims_*.py'
      - 'tests/test_owi_ec005_realtools_native_claims.py'
      - 'mathematics/research-notes/OWI-EC005M-NATIVE-CLAIMS-20261113.md'
      - '.github/workflows/owi-ec005-realtools-native-claims.yml'
      - 'governance/ci_components/owi_ec005.json'
      - 'governance/ci_routing_baseline.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only-claims-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Test original claim tool scope and hostile native receipt variants
        run: |
          python -m unittest discover -s tests -p 'test_owi_ec005_realtools_native_claims.py' -v
          python -m py_compile experiments/owi_ec005_realtools_native_claims_canary.py experiments/owi_ec005_realtools_native_claims_gate.py

  original-source-chosen-claim-interventions:
    needs: source-only-claims-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify full immutable 2550-task source SHA and isolated training row 687
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python experiments/owi_ec005_realtools_family_prepare.py \
            --indices 687 --output-dir "$RUNNER_TEMP/owi_ec005m_native"
      - name: Run six truly chosen source actions against original private checker
        shell: bash
        run: |
          set -euo pipefail
          docker pull python@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
          python experiments/owi_ec005_realtools_native_claims_canary.py \
            --input-dir "$RUNNER_TEMP/owi_ec005m_native" \
            --output "build/owi_ec005_realtools/native_claims_contrast.json"
      - name: Independently adjudicate authorization, actual mutation and native-score margins
        shell: bash
        run: |
          set -euo pipefail
          python experiments/owi_ec005_realtools_native_claims_gate.py \
            --trial "build/owi_ec005_realtools/native_claims_contrast.json" \
            --output "build/owi_ec005_realtools/native_claims_gate.json"
          python - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path("build/owi_ec005_realtools/native_claims_contrast.json").read_text())
          verdict = json.loads(Path("build/owi_ec005_realtools/native_claims_gate.json").read_text())
          assert source["contract"] == "OWI-EC005M-ORIGINAL-NATIVE-CLAIM-AUTH-CONTRAST/1"
          assert source["source_initial_state_unchanged"]
          assert source["original_private_checker_unchanged"]
          assert not source["new_safety_reward_injected"]
          assert not source["policy_trained"]
          assert len(source["selected_executions"]) == 6
          assert verdict["contract"] == "OWI-EC005M-NATIVE-CLAIM-SUITABILITY-GATE/1"
          assert verdict["actual_original_source_executions"] == 6
          assert verdict["source_original_checker_unchanged"]
          assert not verdict["custom_reward_added"]
          assert not verdict["policy_training_or_transfer_established"]
          print("REAL_NATIVE_CLAIM_CONTRAST_DISPOSITION", json.dumps(verdict,sort_keys=True))
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owi-ec005m-original-claims-authorization-contrast
          path: |
            build/owi_ec005_realtools/native_claims_contrast.json
            build/owi_ec005_realtools/native_claims_gate.json
          retention-days: 30
