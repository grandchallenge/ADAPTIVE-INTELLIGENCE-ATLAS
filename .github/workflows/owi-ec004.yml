name: OWI-EC004 endogenous cognitive control

on:
  pull_request:
    paths:
      - 'experiments/owi_ec004_*.py'
      - 'mathematics/research-notes/OWI-EC004-ENDOGENOUS-LEARNED-CONTROL-20261112.md'
      - '.github/workflows/owi-ec004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  joint-full-information:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned CPU PyTorch
        run: python -m pip install --no-cache-dir 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Reproduce five seeds and four jointly fine-tuned control conditions
        shell: bash
        run: |
          set -euo pipefail
          for seed in 1 2 3 4 5; do
            python experiments/owi_ec004_train.py --stage pretrain --seed "$seed" --pretrain 250
            for mode in active_rich passive_rich active_summary passive_summary; do
              python experiments/owi_ec004_train.py --stage actor --seed "$seed" --mode "$mode" --actor-steps 1200
              python experiments/owi_ec004_train.py --stage joint --seed "$seed" --mode "$mode" --joint-steps 100
              python experiments/owi_ec004_train.py --stage eval --seed "$seed" --mode "$mode" --eval 4000
            done
          done
          python experiments/owi_ec004_summarize.py --folder build/owi_ec004 --seeds 1,2,3,4,5 --no-onpolicy --check --output build/owi_ec004/summary_full_information.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owi-ec004-five-seed-joint-replay
          path: |
            build/owi_ec004/seed*.json
            build/owi_ec004/summary_full_information.json
          retention-days: 30
  online-outcome-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned CPU PyTorch
        run: python -m pip install --no-cache-dir 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Reproduce five outcome-only on-policy comparators
        shell: bash
        run: |
          set -euo pipefail
          for seed in 1 2 3 4 5; do
            python experiments/owi_ec004_train.py --stage pretrain --seed "$seed" --pretrain 250
            python experiments/owi_ec004_onpolicy.py --seed "$seed" --mode active_summary --steps 1500
          done
          python - <<'PY'
          import json,statistics
          from pathlib import Path
          root=Path('build/owi_ec004')
          rows=[json.loads((root/f'seed{s}_active_summary_onpolicy.json').read_text()) for s in range(1,6)]
          assert len(rows)==5
          vals=[r['results']['gaussian']['objective'] for r in rows]
          fixed=[r['results']['gaussian']['fixed_both'] for r in rows]
          result={'seeds':[1,2,3,4,5],'mean_online':statistics.mean(vals),'mean_fixed_both':statistics.mean(fixed)}
          (root/'summary_online.json').write_text(json.dumps(result,indent=2))
          print('Outcome-only training audit:',json.dumps(result))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owi-ec004-five-seed-online-replay
          path: |
            build/owi_ec004/seed*_active_summary_onpolicy.json
            build/owi_ec004/summary_online.json
          retention-days: 30
