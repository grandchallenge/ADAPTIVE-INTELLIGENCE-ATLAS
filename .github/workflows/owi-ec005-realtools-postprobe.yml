name: OWI-EC005H source-locked post-probe research

on:
  pull_request:
    paths:
      - 'experiments/owi_ec005_realtools_postprobe_*.py'
      - 'tests/test_owi_ec005_realtools_postprobe_*.py'
      - '.github/workflows/owi-ec005-realtools-postprobe.yml'
      - 'governance/ci_components/owi_ec005.json'
      - 'governance/ci_routing_baseline.json'
      - 'mathematics/research-notes/OWI-EC005H-POSTPROBE-20261113.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-variant-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Strict source family and private-field non-disclosure
        run: |
          python -m unittest discover -s tests -p 'test_owi_ec005_realtools_postprobe_discover.py' -v
          python -m unittest discover -s tests -p 'test_owi_ec005_realtools_postprobe_learner.py' -v
          python -m py_compile experiments/owi_ec005_realtools_postprobe_discover.py experiments/owi_ec005_realtools_postprobe_variants.py experiments/owi_ec005_realtools_postprobe_learner.py

  pinned-natural-task-inventory:
    needs: public-variant-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Read only verified public descriptions from three train families
        run: |
          python experiments/owi_ec005_realtools_postprobe_discover.py --limit 16
      - name: Diagnose only bounded targeted initial-state schema for controlled variants
        run: python experiments/owi_ec005_realtools_postprobe_status_audit.py


  source-locked-real-postprobe-learning:
    needs: pinned-natural-task-inventory
    strategy:
      fail-fast: false
      matrix:
        seed: [11]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify full locked source before preparing precisely controlled variants
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python experiments/owi_ec005_realtools_postprobe_variants.py \
            --output-dir "$RUNNER_TEMP/owi_ec005h_postprobe"
      - name: Replay true chosen post-probe actions with separate private terminal checks
        shell: bash
        run: |
          set -euo pipefail
          docker pull python@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
          python experiments/owi_ec005_realtools_postprobe_learner.py \
            --input-dir "$RUNNER_TEMP/owi_ec005h_postprobe" \
            --seed "${{ matrix.seed }}" --episodes 40 --eval-episodes 2 \
            --output "build/owi_ec005_realtools/postprobe_seed${{ matrix.seed }}.json"
          python - <<'PY'
          import json
          from pathlib import Path
          files=list(Path("build/owi_ec005_realtools").glob("postprobe_seed*.json"))
          assert len(files)==1
          x=json.loads(files[0].read_text())
          assert x["contract"]=="OWI-EC005H-REAL-POSTPROBE-CHOSEN-OUTCOME/1"
          assert x["training_episodes"]==40
          assert x["training_statuses"]==["suspended","active"]
          assert x["withheld_status"]=="closed"
          assert x["private_initial_final_state_never_in_actor"]
          assert not x["unseen_counterfactual_actions_in_training"]
          assert x["heldout_original_dev_or_test_family_evaluated"] is False
          assert len(x["training_trace"])==40
          assert all(row["private_state_or_check_in_actor"] is False
                     and row["unexecuted_action_result_observed"] is False
                     and row["chosen_propensity"]>0
                     for row in x["training_trace"])
          assert set(x["evaluation"])=={"suspended","active","closed"}
          print("POSTPROBE_SOURCE_LOCKED_FINAL_EVIDENCE",json.dumps({
            k:v for k,v in x.items() if k not in ("training_trace","variant_manifest")},
            sort_keys=True))
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owi-ec005h-chosen-postprobe-seed-${{ matrix.seed }}
          path: build/owi_ec005_realtools/postprobe_seed${{ matrix.seed }}.json
          retention-days: 30
