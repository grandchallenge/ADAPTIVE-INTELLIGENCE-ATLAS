name: OWI-EC005C real tool episodes and private terminal outcomes

on:
  pull_request:
    paths:
      - 'experiments/owi_ec005_realtools_episode_*.py'
      - 'experiments/owi_ec005_realtools_randomized.py'
      - 'experiments/owi_ec005_realtools_terminal_verifier.py'
      - 'tests/test_owi_ec005_realtools_episode.py'
      - 'governance/ci_components/owi_ec005.json'
      - '.github/workflows/owi-ec005-realtools-outcome.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-verifier-and-state-ipc:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Unit and adversarial checker-separation tests
        run: |
          python -m unittest discover -s tests -p 'test_owi_ec005_realtools_episode.py' -v
          python -m py_compile \
            experiments/owi_ec005_realtools_episode_worker.py \
            experiments/owi_ec005_realtools_terminal_verifier.py \
            experiments/owi_ec005_realtools_episode_select.py \
            experiments/owi_ec005_realtools_randomized.py

  randomized-real-outcome-loop:
    needs: private-verifier-and-state-ipc
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Prepare separate task/environment/verifier bundles, pinned source
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python experiments/owi_ec005_realtools_episode_select.py \
            --row-index 1 --destination "$RUNNER_TEMP/owi_ec005_task"
      - name: Run independent randomized selected actions and jailed private verifier
        shell: bash
        run: |
          set -euo pipefail
          docker pull python@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
          python experiments/owi_ec005_realtools_randomized.py \
            --public "$RUNNER_TEMP/owi_ec005_task/public.json" \
            --environment "$RUNNER_TEMP/owi_ec005_task/environment.json" \
            --verifier "$RUNNER_TEMP/owi_ec005_task/verifier.json" \
            --episodes 12 --seed 12 \
            --output build/owi_ec005_realtools/real_chosen_outcomes.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('build/owi_ec005_realtools/real_chosen_outcomes.json').read_text())
          assert x['contract']=='OWI-EC005-REALTOOL-CHOSEN-OUTCOME/1'
          assert set(x['arms'])=={'stop','probe','probe_retry'}
          assert x['episodes']==12 and x['complete_private_verification']
          assert x['policy_optimization']=='NOT_PERFORMED'
          assert all('private_state_sha256_audit_only' not in row for row in x['episodes_data'])
          assert all(row['terminal_reward'] is not None for row in x['episodes_data'])
          print('REAL_CHOSEN_OUTCOME_EVIDENCE',
                json.dumps({k:v for k,v in x.items() if k not in ('episodes_data','limitations')},
                           sort_keys=True))
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owi-ec005c-real-chosen-outcome-evidence
          path: build/owi_ec005_realtools/real_chosen_outcomes.json
          retention-days: 30
