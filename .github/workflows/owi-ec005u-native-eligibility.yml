name: OWI-EC005U original TRAIN all-family public census and eight source reads

on:
  pull_request:
    paths:
      - 'experiments/owi_ec005u_*.py'
      - 'tests/test_owi_ec005u_*.py'
      - 'governance/research/OWI_EC005U_SOURCE_ELIGIBILITY_CENSUS_V1.json'
      - 'mathematics/research-notes/OWI-EC005U-TRAIN-FAMILY-ELIGIBILITY-20261115.md'
      - '.github/workflows/owi-ec005u-native-eligibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-train-family-public-census-and-8-native-reads:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Adversarial original source and protected no-op gate checks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile experiments/owi_ec005u_source_eligibility.py \
            experiments/owi_ec005u_source_eligibility_gate.py
          python -m unittest discover -s tests \
            -p 'test_owi_ec005u_source_eligibility.py' -v
      - name: Verify all original 2550 raw bytes, group 30 TRAIN/10 DEV/11 sealed TEST source families
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          docker pull python@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
          python experiments/owi_ec005u_source_eligibility.py \
            --task-spec governance/research/OWI_EC005U_SOURCE_ELIGIBILITY_CENSUS_V1.json \
            --output build/owi_ec005u/source_original_train_public_eligibility.json
      - name: Independently reconstruct all 30 original TRAIN family statistics and actual selected public source tools
        shell: bash
        run: |
          set -euo pipefail
          python experiments/owi_ec005u_source_eligibility_gate.py \
            --trial build/owi_ec005u/source_original_train_public_eligibility.json \
            --task-spec governance/research/OWI_EC005U_SOURCE_ELIGIBILITY_CENSUS_V1.json \
            --output build/owi_ec005u/independent_original_native_source_gate.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('build/owi_ec005u/independent_original_native_source_gate.json')
          x=json.loads(p.read_text())
          assert x['contract']=='OWI-EC005U-INDEPENDENT-ORIGINAL-TRAIN-CENSUS-AND-PUBLIC-READ-GATE/1'
          assert x['original_connected_training_environment_families_censused']==30
          assert x['original_training_tasks_public_prompt_checked']==1500
          assert x['new_predeclared_original_training_families_compared_with_R_S_T']==8
          assert x['original_native_private_checker_never_executed']
          assert x['source_original_dev_test_task_info_never_exported']
          assert not x['natural_same_original_conditional_action_vs_noaction_support_established']
          print('OWI_EC005U_INDEPENDENT_ORIGINAL_SOURCE_DISPOSITION',json.dumps(x,sort_keys=True))
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owi-ec005u-public-only-30-family-census-and-native-reads
          path: build/owi_ec005u/
          retention-days: 30
