name: OWI-DS002 native pretrained LambdaBeam syntax to exact ExeDec bridge

on:
  pull_request:
    paths:
      - 'experiments/owi_ds002_lambdabeam_native_bridge.py'
      - 'tests/test_owi_ds002_lambdabeam_native_bridge.py'
      - 'governance/ci_components/owi_ds002_lambdabeam_native_bridge.json'
      - '.github/workflows/owi-ds002-lambdabeam-native-bridge.yml'
      - 'mathematics/research-notes/OWI-DS002-LAMBDABEAM-NATIVE-PROGRAM-BRIDGE-20261116.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-pinned-native-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Pin only import-time dependencies; never install or run trained PyTorch model
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 absl-py==2.1.0
      - name: Clone exact upstream source using sparse partial checkout without 40.75MB checkpoint
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/ellisk42/LambdaBeam.git build/owi_ds002/lambdabeam_native_source
          git -C build/owi_ds002/lambdabeam_native_source sparse-checkout set --no-cone \
            '/eval_config.py' '/lambdabeam/__init__.py' \
            '/lambdabeam/algorithm/**' '/lambdabeam/dsl/**' \
            '/lambdabeam/model/**' '/lambdabeam/experiment/**' \
            '/lambdabeam/property_signatures/**'
          git -C build/owi_ds002/lambdabeam_native_source checkout --quiet --detach 61986dc1a6d8cc9521fb17e3152f7f085b5d7c95
          test "$(git -C build/owi_ds002/lambdabeam_native_source rev-parse HEAD)" = '61986dc1a6d8cc9521fb17e3152f7f085b5d7c95'
          test ! -f build/owi_ds002/lambdabeam_native_source/lambdabeam-model.ckpt
      - name: All 32 translatable native atoms, type refusal, closure refusal, injection guards
        run: |
          python -m py_compile experiments/owi_ds002_lambdabeam_native_bridge.py
          python -m unittest discover -s tests -p 'test_owi_ds002_lambdabeam_native_bridge.py' -v
          python -m unittest discover -s tests -p 'test_owi_ds002_lambdabeam_checkpoint_gate.py' -v
          python -m unittest discover -s tests -p 'test_owi_ds002_exedec_admission.py' -v
      - name: Source-locked real 28-operator native interpreter vs exact ExeDec bounded witness replay
        run: |
          python experiments/owi_ds002_lambdabeam_native_bridge.py \
            --mode witness --source-dir build/owi_ds002/lambdabeam_native_source \
            --output build/owi_ds002/lambdabeam_native_bridge_witnesses.json
      - name: Validate independently executed native-versus-ExeDec results and source reference coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("build/owi_ds002/lambdabeam_native_bridge_witnesses.json").read_text())
          assert r["status"] == "NATIVE_SOURCE_EXACT_SUBGRAMMAR_BRIDGE_WITNESSED", r
          assert r["source"]["source"]["commit"] == "61986dc1a6d8cc9521fb17e3152f7f085b5d7c95"
          assert r["source"]["source"]["verified_source_git_blobs"] == 7
          assert len(r["source"]["original_operator_names"]) == 28
          assert r["exedec_revision"] == "ef046ce2cc3fcd024e32f5dfe00e69700dac82ed"
          assert r["audit"]["admitted_exact_atomic_exedec_operations"] == 32
          assert r["audit"]["total_exact_atomic_operations"] == 38
          assert r["audit"]["excluded_native_semantics"] == {"Access":1,"Scanl1":5}
          assert r["audit"]["finite_native_source_vs_exedec_comparisons"] == 518  # 7x7 + 2x49 + 18x7 + 5x49
          assert r["audit"]["mismatches"] == 0
          assert r["audit"]["native_Access_negative_index_result"] == 2
          assert r["audit"]["exedec_Access_negative_index_result"] is None
          assert r["audit"]["native_Scanl1_empty_result"] == "UNDEFINED"
          assert r["audit"]["exedec_Scanl1_empty_result"] == []
          src=r["source_reference_structural_coverage"]
          assert src["task_count"] == 1200
          assert len(src["by_split"]) == 6
          assert 0 <= src["syntactically_eligible"] <= 1200
          assert src["not_an_inference_success_rate"]
          assert len(r["witnesses"]) == 32
          print("SOURCE NATIVE-EXEDEC CUSTODY:",{
            "source_revision":r["source"]["source"]["commit"],
            "admitted_ops":r["audit"]["admitted_exact_atomic_exedec_operations"],
            "source_native_semantic_probe_pairs":r["audit"]["finite_native_source_vs_exedec_comparisons"],
            "both_undefined":r["audit"]["both_invalid"],
            "excluded_ops":r["audit"]["excluded_native_semantics"],
            "reference_source_tasks":src["task_count"],
            "reference_grammar_eligible_tasks":src["syntactically_eligible"],
            "coverage_by_split":src["by_split"],
            "trained_model_actually_run":False,
          })
          PY
      - name: Preserve the positive, negative, reference coverage and exact-source witness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owi-ds002-native-lambdabeam-to-exedec-source-bridge
          path: build/owi_ds002/lambdabeam_native_bridge_witnesses.json
          retention-days: 30
