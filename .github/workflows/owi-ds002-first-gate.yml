name: OWI-DS002 chosen-run tangent contract

on:
  pull_request:
    paths:
      - 'experiments/owi_ds002_chosen_tangents.py'
      - 'tests/test_owi_ds002_chosen_tangents.py'
      - 'experiments/owi_ec005_conditional.py'
      - 'experiments/owi_ec004_core.py'
      - 'experiments/owi_ds002_benchmark_manifest.json'
      - '.github/workflows/owi-ds002-first-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorized-tangent-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned CPU PyTorch
        run: python -m pip install --no-cache-dir 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Validate manifest and compile
        run: |
          python -m json.tool experiments/owi_ds002_benchmark_manifest.json >/dev/null
          python -m py_compile experiments/owi_ds002_chosen_tangents.py tests/test_owi_ds002_chosen_tangents.py
      - name: Chosen-run authorization and gradient tests
        run: python -m unittest discover -s tests -p 'test_owi_ds002_chosen_tangents.py' -v
      - name: Pre-existing conditional inference regression
        run: python -m unittest discover -s tests -p 'test_owi_ec005.py' -v
