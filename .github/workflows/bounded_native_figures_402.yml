name: Bounded Atlas three native-Wolfram figure proof
on:
  pull_request:
    branches: [editorial/part01-corrections-20261008]
permissions:
  contents: write
jobs:
  figures:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: editorial/figure-native-rest-402-002
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt Pillow PyMuPDF
      - run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - name: Verify all three actual binary Wolfram derivatives against source manifests
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib,yaml,math
          for fid,version in (("MANIFOLD","v0.1.2"),("TRANSFER","v0.1.2"),("OPTBASE","v0.1.3")):
            m=yaml.safe_load(Path(f"figures/manifests/ATLAS-FIG-{fid}-001-{version}.yaml").read_text())
            p=Path(m["rendered_derivative"])
            data=p.read_bytes()
            assert data[:8]==b"\x89PNG\r\n\x1a\n"
            assert len(data)==m["rendered_derivative_bytes"]
            assert hashlib.sha256(data).hexdigest()==m["rendered_derivative_raw_sha256"],fid
            with Image.open(p) as im:
              assert list(im.size)==m["rendered_derivative_dimensions_px"],(fid,im.size)
              im.verify()
            assert Path(m["successor_source"]).exists()
            assert Path(m["original_source"]).exists()
            print("SOURCE_NATIVE_FIGURE_BINARY_PASS",fid,len(data),hashlib.sha256(data).hexdigest())
          x=(0,0,1)
          v=(4/5,0,0)
          ep=(math.sin(.8),0,math.cos(.8))
          ret=(4/math.sqrt(41),0,5/math.sqrt(41))
          assert abs(math.sqrt(sum((a-b)**2 for a,b in zip(ep,ret)))-0.125177186605)<1e-8
          assert (4,2)==(3+1,3-1)
          assert (6,.5)==(2*3,.5*1)
          assert (2,1)==(2*1-0,2*1-1)
          assert abs((1.83-1.81)-.02)<1e-12
          print("FIGURE_MATH_WITNESS_CHECK_PASS",ep,ret)
          PY
          python tools/validate_atlas.py
          python tools/build_editorial_candidate_rc2.py
          python tools/build_editorial_candidate_rc2.py --check
      - name: Complete three-pass source-exact 80-chapter PDF
        run: |
          mkdir -p /tmp/atlas-fig402
          for i in 1 2 3; do
            if ! pdflatex -interaction=nonstopmode -halt-on-error -output-directory=/tmp/atlas-fig402 manuscript/latex/atlas-v0.1.1-rc.2.tex >/tmp/atlas-fig402-stdout.log 2>&1; then
              tail -n 110 /tmp/atlas-fig402-stdout.log
              exit 1
            fi
          done
          pdfinfo /tmp/atlas-fig402/atlas-v0.1.1-rc.2.pdf | grep -E 'Pages:|Page size:'
      - name: All source-bound HTML semantic images and unique headings
        run: |
          python tools/release_tex_for_html.py
          python -c 'import pypandoc; pypandoc.convert_file("/tmp/atlas-rc-html-input.tex","html5",format="latex",outputfile="/tmp/atlas-fig402.html",extra_args=["--standalone","--toc","--number-sections","--mathjax","--embed-resources","--resource-path=."])'
          python tools/editorial_export_figure_alts.py --html /tmp/atlas-fig402.html --write
          python tools/editorial_export_figure_alts.py --html /tmp/atlas-fig402.html --verify
      - name: Exact physical PDF page/print-DPI and 18-figure QA
        run: |
          python - <<'PY'
          import fitz,hashlib,re
          from pathlib import Path
          p=Path('/tmp/atlas-fig402/atlas-v0.1.1-rc.2.pdf')
          d=fitz.open(p)
          cases={'MANIFOLD':(1267,1320),'TRANSFER':(1167,1267),'OPTBASE':(1167,1650)}
          images={}
          for num,page in enumerate(d,1):
            for img in page.get_images(full=True):
              wh=tuple(img[2:4])
              for id,expected in cases.items():
                if wh==expected:
                  for rect in page.get_image_rects(img[0]):
                    images.setdefault(id,[]).append((num,rect.width,rect.height,expected[0]*72/rect.width,expected[1]*72/rect.height))
          assert set(images)==set(cases),images
          Path('/tmp/atlas-fig402/samples').mkdir(exist_ok=True)
          for id,entries in images.items():
            assert len(entries)==1,(id,entries)
            n,w,h,x,y=entries[0]
            assert min(x,y)>=200,(id,n,x,y)
            d[n-1].get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False).save(f'/tmp/atlas-fig402/samples/{id}-page-{n:04}.png')
          s=Path('/tmp/atlas-fig402.html').read_text()
          ids=re.findall(r'\bid="([^"]+)"',s)
          log=Path('/tmp/atlas-fig402/atlas-v0.1.1-rc.2.log').read_text(errors='replace')
          widths=[float(x) for x in re.findall(r'Overfull \\hbox \(([0-9.]+)pt too wide\)',log)]
          tex=Path('manuscript/latex/atlas-v0.1.1-rc.2.tex')
          print('ATLAS_NATIVE_3_FIGURE_QA',dict(pages=len(d),figures=images,tex_sha256=hashlib.sha256(tex.read_bytes()).hexdigest(),pdf_sha256=hashlib.sha256(p.read_bytes()).hexdigest(),html_sha256=hashlib.sha256(s.encode()).hexdigest(),warning_count=len(widths),max_warning_pt=max(widths or [0]),html_figures=s.count('<img '),html_anchors=len(ids),duplicate_ids=len(ids)-len(set(ids))))
          assert s.count('<img ')==18 and len(ids)==len(set(ids))
          assert not re.search(r'LaTeX Warning: (Citation|Reference).*undefined',log)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-native-402-physical-pages
          path: /tmp/atlas-fig402/samples/
          retention-days: 30
          if-no-files-found: error
      - name: Commit only exact-source generated TeX to editorial candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manuscript/latex/atlas-v0.1.1-rc.2.tex
          if ! git diff --cached --quiet; then
            git commit -m "build(editorial): exact 80-chapter RC2 with native Wolfram plates"
            git push origin HEAD:refs/heads/editorial/figure-native-rest-402-002
          fi
