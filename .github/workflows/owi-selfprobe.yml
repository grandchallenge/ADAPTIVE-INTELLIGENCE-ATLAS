name: OWI active self-probing witness
on:
  pull_request:
    paths:
      - 'experiments/owi_selfprobe.py'
      - 'mathematics/research-notes/OWI-ACTIVE-SELF-PROBING-20261112.md'
      - '.github/workflows/owi-selfprobe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run finite witness exact and multiseed checks
        run: |
          python3 experiments/owi_selfprobe.py --self-test
          python3 experiments/owi_selfprobe.py --seeds 1,2,3,4,5 --train 100000 --eval 70000 --output owi-results.json > /dev/null
          python3 -c "import json; d=json.load(open('owi-results.json')); assert all(r['guaranteed_gain_vs_fixed_if_positive']>0 for r in d['runs']); print(d['summary'])"
