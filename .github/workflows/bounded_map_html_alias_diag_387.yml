name: Bounded MAP HTML alias diagnostic
on:
  pull_request:
    branches: [editorial/part01-corrections-20261008]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: |
          python tools/build_editorial_candidate_rc2.py --check
          python tools/release_tex_for_html.py
          python - <<'PY'
          from pathlib import Path
          import pypandoc,re,collections
          pypandoc.convert_file("/tmp/atlas-rc-html-input.tex","html5",format="latex",outputfile="/tmp/atlas-map-alias-diag.html",extra_args=["--standalone","--toc","--number-sections","--mathjax","--embed-resources","--resource-path=."])
          ids=re.findall(r'\bid="([^"]+)"',Path("/tmp/atlas-map-alias-diag.html").read_text())
          mp=Path("manuscript/parts/01-orientation/ATLAS-CH-MAP-001.md").read_text()
          expected=re.findall(r"\[\]\{#([^}]+)\}",mp)
          c=collections.Counter(ids)
          print("MAP_HTML_ALIAS_DIAGNOSTIC",dict(expected_count=len(expected),missing=[x for x in expected if c[x]==0],duplicated=[(x,n) for x,n in c.items() if n>1],headings=len(re.findall(r'^## ',mp,re.M)),id_count=len(ids)))
          PY
