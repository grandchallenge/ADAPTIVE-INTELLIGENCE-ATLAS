name: Validate Atlas repository
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python tools/validate_atlas.py
      - run: python -m unittest discover -s tests -p test_atlas_direct_return_projector.py
      - run: |
          if [ -f manuscript/latex/atlas-v0.1.1-rc.1.tex ]; then
            python tools/check_editorial_part01.py
          fi
      - run: |
          if [ -f manuscript/latex/atlas-v0.1.1-rc.2.tex ]; then
            python tools/build_editorial_candidate_rc2.py --check
          fi
      - run: python tools/editorial_figure_inventory.py --check
      - run: python tools/check_editorial_chapter_queue.py
      - run: python tools/check_release_readiness.py
      - run: python tools/check_release_candidate.py
      - run: python tools/check_public_release.py
      - run: python tools/assemble_manuscript.py --output /tmp/atlas-manuscript.md --manifest /tmp/atlas-manifest.json --check
