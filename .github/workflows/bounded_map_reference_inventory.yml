name: Bounded MAP original heading reference inventory
on:
  pull_request:
    branches: [editorial/part01-corrections-20261008]
permissions:
  contents: read
jobs:
  heading-inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          tex=Path("manuscript/latex/atlas-v0.1.1-rc.2.tex").read_text()
          a=re.search(r"\\chapter\{How to Read a Mathematical\s+Atlas\}",tex,re.S).start()
          b=tex.index(r"\chapter{",a+20)
          s=tex[a:b]
          pat=re.compile(r"\\(section|subsection|subsubsection)\{([^{}]*)\}\\label\{([^{}]*)\}",re.S)
          items=[dict(kind=m.group(1),title=" ".join(m.group(2).split()),label=m.group(3)) for m in pat.finditer(s)]
          print("ATLAS_MAP_ORIGINAL_LABELS="+json.dumps(items,separators=(",",":")))
          print("ATLAS_MAP_ORIGINAL_HEADING_COUNT",len(items))
          assert len(items)>=36
          PY
