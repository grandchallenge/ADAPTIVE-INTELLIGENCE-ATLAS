name: OWI-EC005D public goal-action discovery and mutation replay

on:
  pull_request:
    paths:
      - 'experiments/owi_ec005_realtools_goal_*.py'
      - 'tests/test_owi_ec005_realtools_goal.py'
      - 'governance/ci_components/owi_ec005.json'
      - '.github/workflows/owi-ec005-realtools-mutation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-task-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify full pinned source and inspect only public task intent/tool parameters
        run: python experiments/owi_ec005_realtools_goal_discover.py --index 1

  public-real-tool-observations:
    needs: public-task-discovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Select exact pinned public task, keep private verifier unmounted
        shell: bash
        run: |
          set -euo pipefail
          python experiments/owi_ec005_realtools_episode_select.py --row-index 1 --destination "$RUNNER_TEMP/owi_ec005d"
      - name: Execute declared read tools in no-network child, print only actual tool-visible observations
        shell: bash
        run: |
          set -euo pipefail
          docker pull python@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
          python experiments/owi_ec005_realtools_goal_probe.py --environment "$RUNNER_TEMP/owi_ec005d/environment.json" --public "$RUNNER_TEMP/owi_ec005d/public.json"

  real-goal-mutation-vs-stop:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Run public-only planned interventions, abstention and injection tests
        run: |
          python -m unittest discover -s tests -p 'test_owi_ec005_realtools_goal.py' -v
          python -m py_compile experiments/owi_ec005_realtools_goal_policy.py
      - name: Verify pinned task and physically execute feedback-conditioned real mutation
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python experiments/owi_ec005_realtools_episode_select.py --row-index 1 --destination "$RUNNER_TEMP/owi_ec005d_goal"
          docker pull python@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
          python experiments/owi_ec005_realtools_goal_policy.py \
            --public "$RUNNER_TEMP/owi_ec005d_goal/public.json" \
            --environment "$RUNNER_TEMP/owi_ec005d_goal/environment.json" \
            --verifier "$RUNNER_TEMP/owi_ec005d_goal/verifier.json" \
            --seed 12 --episodes 12 \
            --output build/owi_ec005_realtools/real_goal_outcomes.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("build/owi_ec005_realtools/real_goal_outcomes.json").read_text())
          assert x["episodes"]==12
          assert x["verifier_outcomes_valid"]
          assert set(x["arm_counts"])=={"stop","read_only","goal"}
          assert x["training"]=="NOT_PERFORMED"
          assert not x["positive_policy_learning_claim"]
          assert all(x["private_state_or_verifier_in_policy"] is False for x in x["episodes_data"])
          print("EXACT_GOAL_REPLAY",json.dumps({k:v for k,v in x.items() if k!="episodes_data"},sort_keys=True))
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owi-ec005d-source-pinned-goal-terminal-evidence
          path: build/owi_ec005_realtools/real_goal_outcomes.json
          retention-days: 30
