name: OWI-EC005D public goal-action discovery and mutation replay

on:
  pull_request:
    paths:
      - 'experiments/owi_ec005_realtools_goal_*.py'
      - 'governance/ci_components/owi_ec005.json'
      - '.github/workflows/owi-ec005-realtools-mutation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-task-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify full pinned source and inspect only public task intent/tool parameters
        run: python experiments/owi_ec005_realtools_goal_discover.py --index 1
