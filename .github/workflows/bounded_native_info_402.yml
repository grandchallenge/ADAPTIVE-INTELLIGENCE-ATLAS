name: Bounded native-Wolfram INFO figure proof
on:
  pull_request:
    branches: [editorial/part01-corrections-20261008]
permissions:
  contents: write
jobs:
  info:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: editorial/figure-source-402-001
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt PyMuPDF Pillow
      - run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - name: Exact Wolfram binary, generator, witness and source checks
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib,yaml,math
          manifest=yaml.safe_load(Path('figures/manifests/ATLAS-FIG-INFO-001-v0.1.1.yaml').read_text())
          p=Path(manifest['native_derivative'])
          b=p.read_bytes()
          assert b.startswith(b'\x89PNG\r\n\x1a\n')
          assert len(b)==manifest['native_derivative_png_bytes']
          assert hashlib.sha256(b).hexdigest()==manifest['native_derivative_sha256']
          with Image.open(p) as im:
            im.verify()
          with Image.open(p) as im:
            assert list(im.size)==manifest['native_derivative_dimensions_px']
          pxy=[[3/8,1/8],[1/8,3/8]]
          val=sum(pxy[i][j]*math.log2(pxy[i][j]/.25) for i in range(2) for j in range(2))
          assert abs(val-manifest['method']['independent_exact_math']['mutual_information_decimal'])<1e-14
          print('NATIVE_INFO_PNG_AND_EXACT_MATH_PASS',p,len(b),hashlib.sha256(b).hexdigest(),val)
          PY
          python tools/validate_atlas.py
          python tools/build_editorial_candidate_rc2.py
          python tools/build_editorial_candidate_rc2.py --check
      - name: Three-pass full-book physical PDF
        run: |
          mkdir -p /tmp/atlas-native-info-proof
          for i in 1 2 3; do
            if ! pdflatex -interaction=nonstopmode -halt-on-error -output-directory=/tmp/atlas-native-info-proof manuscript/latex/atlas-v0.1.1-rc.2.tex >/tmp/atlas-native-info-proof-out.log 2>&1; then
              tail -n 110 /tmp/atlas-native-info-proof-out.log
              exit 1
            fi
          done
          pdfinfo /tmp/atlas-native-info-proof/atlas-v0.1.1-rc.2.pdf | grep -E 'Pages:|Page size:'
      - name: Source-bound accessible HTML figure reconciliation
        run: |
          python tools/release_tex_for_html.py
          python -c 'import pypandoc; pypandoc.convert_file("/tmp/atlas-rc-html-input.tex","html5",format="latex",outputfile="/tmp/atlas-native-info-proof.html",extra_args=["--standalone","--toc","--number-sections","--mathjax","--embed-resources","--resource-path=."])'
          python tools/editorial_export_figure_alts.py --html /tmp/atlas-native-info-proof.html --write
          python tools/editorial_export_figure_alts.py --html /tmp/atlas-native-info-proof.html --verify
      - name: Verify improved actual INFO print DPI and 18-figure semantics
        run: |
          python - <<'PY'
          import fitz,hashlib,re
          from pathlib import Path
          from PIL import Image
          p=Path('/tmp/atlas-native-info-proof/atlas-v0.1.1-rc.2.pdf')
          d=fitz.open(p); info=[]
          for i,page in enumerate(d,1):
            for img in page.get_images(full=True):
              if img[2]==1167 and img[3]==1326:
                for box in page.get_image_rects(img[0]):
                  info.append((i,1167*72/box.width,1326*72/box.height,box))
          assert len(info)==1,info
          page,dpi1,dpi2,rect=info[0]
          assert min(dpi1,dpi2)>=200,(page,dpi1,dpi2)
          Path('/tmp/atlas-native-info-proof/print-INFO-page.png').write_bytes(d[page-1].get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False).tobytes('png'))
          tex=Path('manuscript/latex/atlas-v0.1.1-rc.2.tex')
          log=Path('/tmp/atlas-native-info-proof/atlas-v0.1.1-rc.2.log').read_text(errors='replace')
          h=Path('/tmp/atlas-native-info-proof.html').read_text()
          ids=re.findall(r'\bid="([^"]+)"',h)
          boxes=[float(x) for x in re.findall(r'Overfull \\hbox \(([0-9.]+)pt too wide\)',log)]
          print('NATIVE_INFO_FULL_PDF_QA',dict(pages=len(d),figure_page=page,info_effective_dpi=round(min(dpi1,dpi2),2),tex_sha=hashlib.sha256(tex.read_bytes()).hexdigest(),pdf_sha=hashlib.sha256(p.read_bytes()).hexdigest(),overfull=len(boxes),overfull_max=max(boxes or [0]),figures=h.count('<img '),html_ids=len(ids),html_duplicates=len(ids)-len(set(ids))))
          assert h.count('<img ')==18 and len(ids)==len(set(ids))
          assert not re.search(r'LaTeX Warning: (Citation|Reference).*undefined',log)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-info-402-physical-proof
          path: /tmp/atlas-native-info-proof/print-INFO-page.png
          if-no-files-found: error
          retention-days: 30
      - name: Commit only deterministic generated TeX on scoped PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manuscript/latex/atlas-v0.1.1-rc.2.tex
          if ! git diff --cached --quiet; then
            git commit -m "build(editorial): exact-source RC2 after Wolfram INFO print derivative"
            git push origin HEAD:refs/heads/editorial/figure-source-402-001
          fi
