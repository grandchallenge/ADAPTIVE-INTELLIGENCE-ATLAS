name: OWI-EC005T original public-source second conditional native cohort

on:
  pull_request:
    paths:
      - 'experiments/owi_ec005t_*.py'
      - 'tests/test_owi_ec005t_*.py'
      - 'governance/research/OWI_EC005T_NATIVE_SECOND_COHORT_V1.json'
      - 'mathematics/research-notes/OWI-EC005T-NATIVE-SECOND-COHORT-20261115.md'
      - '.github/workflows/owi-ec005t-native-public-cohort.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  four-source-train-family-public-only-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Compile source-public runner, hostile independent gate, exact cohort and no private leakage
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile experiments/owi_ec005t_native_public_cohort.py \
            experiments/owi_ec005t_native_public_cohort_gate.py
          python -m unittest discover -s tests \
            -p 'test_owi_ec005t_native_public_cohort.py' -v
      - name: Source-lock complete original dataset and isolate four independent original TRAIN families
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python experiments/owi_ec005_realtools_family_prepare.py \
            --indices 1549,1900,5,2000 \
            --output-dir "$RUNNER_TEMP/owi_ec005t"
      - name: Actually select original native PUBLIC read-only tools; no checker or source mutation
        shell: bash
        run: |
          set -euo pipefail
          docker pull python@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
          python experiments/owi_ec005t_native_public_cohort.py \
            --input-dir "$RUNNER_TEMP/owi_ec005t" \
            --task-spec governance/research/OWI_EC005T_NATIVE_SECOND_COHORT_V1.json \
            --output build/owi_ec005t/native_original_public_receipts.json
      - name: Independently reconstruct strict original public target/observation action-noop evidence
        shell: bash
        run: |
          set -euo pipefail
          python experiments/owi_ec005t_native_public_cohort_gate.py \
            --trial build/owi_ec005t/native_original_public_receipts.json \
            --task-spec governance/research/OWI_EC005T_NATIVE_SECOND_COHORT_V1.json \
            --output build/owi_ec005t/independent_native_source_gate.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('build/owi_ec005t/independent_native_source_gate.json').read_text())
          assert r['contract']=='OWI-EC005T-INDEPENDENT-NATIVE-TRAIN-PUBLIC-STATE-SUPPORT-GATE/1'
          assert r['original_source_original_train_family_rows']==[1549,1900,5,2000]
          assert r['original_private_checker_or_hidden_source_state_not_used']
          assert r['source_development_and_sealed_test_families_not_opened']
          assert r['source_public_private_credentials_redacted']
          assert r['no_causal_policy_learning_or_original_native_terminal_reward']
          print('OWI_EC005T_INDEPENDENT_SOURCE_PUBLIC_REPLAY_RESULT',json.dumps(r,sort_keys=True))
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owi-ec005t-four-original-training-families-public-only
          path: build/owi_ec005t
          retention-days: 30
