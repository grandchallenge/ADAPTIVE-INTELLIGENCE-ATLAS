name: Bounded Atlas print running-head repair proof
on:
  pull_request:
    branches: [editorial/part01-corrections-20261008]
permissions:
  contents: write
jobs:
  printhead:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: editorial/running-head-396-001
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt PyMuPDF
      - run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - name: Recompose all 80 canonical chapters from current source
        run: |
          python tools/validate_atlas.py
          python tools/build_editorial_candidate_rc2.py
          python tools/build_editorial_candidate_rc2.py --check
      - name: Exact-head three-pass physical PDF
        run: |
          mkdir -p /tmp/atlas-headproof
          for i in 1 2 3; do
            if ! pdflatex -interaction=nonstopmode -halt-on-error -output-directory=/tmp/atlas-headproof manuscript/latex/atlas-v0.1.1-rc.2.tex >/tmp/atlas-headproof-out.log 2>&1; then
              tail -n 110 /tmp/atlas-headproof-out.log
              exit 1
            fi
          done
          pdfinfo /tmp/atlas-headproof/atlas-v0.1.1-rc.2.pdf | grep -E 'Pages:|Page size:'
      - name: Source-bound HTML and source-semantic figure-alt proof
        run: |
          python tools/release_tex_for_html.py
          python -c 'import pypandoc; pypandoc.convert_file("/tmp/atlas-rc-html-input.tex","html5",format="latex",outputfile="/tmp/atlas-headproof.html",extra_args=["--standalone","--toc","--number-sections","--mathjax","--embed-resources","--resource-path=."])'
          python tools/editorial_export_figure_alts.py --html /tmp/atlas-headproof.html --write
          python tools/editorial_export_figure_alts.py --html /tmp/atlas-headproof.html --verify
      - name: Measure output routine and capture actual running-head samples
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz,re,hashlib
          pdf=Path('/tmp/atlas-headproof/atlas-v0.1.1-rc.2.pdf')
          log=Path('/tmp/atlas-headproof/atlas-v0.1.1-rc.2.log').read_text(errors='replace')
          tex=Path('manuscript/latex/atlas-v0.1.1-rc.2.tex')
          html=Path('/tmp/atlas-headproof.html').read_text()
          ov=re.findall(r'Overfull \\hbox \(([0-9.]+)pt too wide\)',log)
          output=re.findall(r'Overfull \\hbox \(([0-9.]+)pt too wide\) has occurred while \\output is active',log)
          ids=re.findall(r'\bid="([^"]+)"',html)
          d=fitz.open(pdf)
          samples=Path('/tmp/atlas-headproof/print-samples');samples.mkdir()
          chosen=[384,385,1002,1003,1178,1179,1218,1219]
          for n in chosen:
            if n<=len(d):d[n-1].get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False).save(str(samples/('page-%04d.png'%n)))
          print('ATLAS_RUNNING_HEAD_QA',dict(tex_sha256=hashlib.sha256(tex.read_bytes()).hexdigest(),pdf_sha256=hashlib.sha256(pdf.read_bytes()).hexdigest(),html_sha256=hashlib.sha256(html.encode()).hexdigest(),pages=len(d),overfull=len(ov),worst=max(map(float,ov),default=0),output_active=len(output),old_output_active=172,html_figures=html.count('<img '),html_ids=len(ids),html_duplicate_ids=len(ids)-len(set(ids))))
          assert len(output)<172,'running-head output warnings did not improve'
          assert html.count('<img ')==18 and len(ids)==len(set(ids))
          assert not re.search(r'LaTeX Warning: (Citation|Reference).*undefined',log)
          PY
      - name: Preserve exact PDF page raster specimens for critical visual reviewer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-running-head-396-before-after-target-pages
          path: /tmp/atlas-headproof/print-samples/
          if-no-files-found: error
          retention-days: 30
      - name: Commit only re-generated RC2 TeX on scoped branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manuscript/latex/atlas-v0.1.1-rc.2.tex
          if ! git diff --cached --quiet; then
            git commit -m "build(editorial): update RC2 for collision-safe running heads"
            git push origin HEAD:refs/heads/editorial/running-head-396-001
          fi
