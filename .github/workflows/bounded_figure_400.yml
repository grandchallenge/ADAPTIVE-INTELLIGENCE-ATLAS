name: Bounded Atlas 18-figure physical proof
on:
  pull_request:
    branches: [editorial/part01-corrections-20261008]
permissions:
  contents: write
jobs:
  figure-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: editorial/figure-physical-400-001
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt PyMuPDF Pillow
      - run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - name: Source and 80-chapter parity proof
        run: |
          python tools/validate_atlas.py
          python tools/build_editorial_candidate_rc2.py --check
      - name: Three-pass exact-source PDF
        run: |
          mkdir -p /tmp/atlas-figure-physical
          for i in 1 2 3; do
            if ! pdflatex -interaction=nonstopmode -halt-on-error -output-directory=/tmp/atlas-figure-physical manuscript/latex/atlas-v0.1.1-rc.2.tex >/tmp/atlas-figure-physical-out.log 2>&1; then
              tail -n 100 /tmp/atlas-figure-physical-out.log
              exit 1
            fi
          done
          pdfinfo /tmp/atlas-figure-physical/atlas-v0.1.1-rc.2.pdf | grep -E 'Pages:|Page size:'
      - name: Measure all 18 figure placements and actual printed page samples
        run: |
          python tools/atlas_figure_physical_audit.py \
            --pdf /tmp/atlas-figure-physical/atlas-v0.1.1-rc.2.pdf \
            --report governance/editorial/v0.1.1/ATLAS_FIGURE_PHYSICAL_400_001.md \
            --data governance/editorial/v0.1.1/ATLAS_FIGURE_PHYSICAL_400_001.json \
            --samples /tmp/atlas-figure-physical/figure-pages
      - name: Source-bound accessible HTML semantic figure proof
        run: |
          python tools/release_tex_for_html.py
          python -c 'import pypandoc; pypandoc.convert_file("/tmp/atlas-rc-html-input.tex","html5",format="latex",outputfile="/tmp/atlas-figure-physical.html",extra_args=["--standalone","--toc","--number-sections","--mathjax","--embed-resources","--resource-path=."])'
          python tools/editorial_export_figure_alts.py --html /tmp/atlas-figure-physical.html --write
          python tools/editorial_export_figure_alts.py --html /tmp/atlas-figure-physical.html --verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-figure-400-all-printed-pages
          path: /tmp/atlas-figure-physical/figure-pages/
          retention-days: 30
          if-no-files-found: error
      - name: Commit only scoped figure print audit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add governance/editorial/v0.1.1/ATLAS_FIGURE_PHYSICAL_400_001.md governance/editorial/v0.1.1/ATLAS_FIGURE_PHYSICAL_400_001.json
          if ! git diff --cached --quiet; then
            git commit -m "docs(editorial): all 18 printed figure physical evidence"
            git push origin HEAD:refs/heads/editorial/figure-physical-400-001
          fi
