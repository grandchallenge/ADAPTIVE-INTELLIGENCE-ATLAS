name: OWI-EC005K native preservation outcome audit

on:
  pull_request:
    paths:
      - 'experiments/owi_ec005_realtools_native_schedule_*.py'
      - 'experiments/owi_ec005_realtools_native_preservation_*.py'
      - 'tests/test_owi_ec005_realtools_native_schedule_*.py'
      - 'tests/test_owi_ec005_realtools_native_preservation_*.py'
      - 'mathematics/research-notes/OWI-EC005K-NATIVE-PRESERVATION-20261113.md'
      - '.github/workflows/owi-ec005-realtools-native-preservation.yml'
      - 'governance/ci_components/owi_ec005.json'
      - 'governance/ci_routing_baseline.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-scope-unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Test public source-only schedule and precise verifier custody
        run: |
          python -m unittest discover -s tests -p 'test_owi_ec005_realtools_native_schedule_probe.py' -v
          python -m unittest discover -s tests -p 'test_owi_ec005_realtools_native_preservation_canary.py' -v
          python -m unittest discover -s tests -p 'test_owi_ec005_realtools_native_preservation_gate.py' -v
          python -m py_compile experiments/owi_ec005_realtools_native_schedule_probe.py experiments/owi_ec005_realtools_native_preservation_canary.py experiments/owi_ec005_realtools_native_preservation_gate.py

  pinned-public-schedule-discovery:
    needs: source-scope-unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify complete pinned raw source and produce authentic row-2301 bundles
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python experiments/owi_ec005_realtools_family_prepare.py \
            --indices 2301 --output-dir "$RUNNER_TEMP/owi_ec005k_schedule"
      - name: Execute original public read tool against original isolated environment
        shell: bash
        run: |
          set -euo pipefail
          docker pull python@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
          python experiments/owi_ec005_realtools_native_schedule_probe.py \
            --input-dir "$RUNNER_TEMP/owi_ec005k_schedule"

      - name: Original native terminal checker, post-repair preservation vs unsafe regression
        shell: bash
        run: |
          set -euo pipefail
          python experiments/owi_ec005_realtools_native_preservation_canary.py \
            --input-dir "$RUNNER_TEMP/owi_ec005k_schedule" \
            --slot lunch --output "build/owi_ec005_realtools/native_preservation_lunch.json"
          python experiments/owi_ec005_realtools_native_preservation_canary.py \
            --input-dir "$RUNNER_TEMP/owi_ec005k_schedule" \
            --slot dinner --output "build/owi_ec005_realtools/native_preservation_dinner.json"
          python - <<'PY'
          import json
          from pathlib import Path
          for slot in ("lunch","dinner"):
            p=Path(f"build/owi_ec005_realtools/native_preservation_{slot}.json")
            r=json.loads(p.read_text())
            assert r["public_regression_target_slot"]==slot
            assert r["contract"]=="OWI-EC005K-ORIGINAL-NATIVE-POSTCORRECTION-PRESERVATION/1"
            assert r["native_checker_original_unchanged"]
            assert r["original_initial_state_unchanged"]
            assert r["actual_public_postrepair_observation_before_second_stage"]
            assert not r["external_safety_reward_added"]
            assert set(r["controlled_stage2_actions"])=={
                "stop","reapply_correct","regress_noncompliant"}
            assert len(r["selected_executions"])==6
            assert all(e["original_native_checks_total"]==7
                       and e["source_mutation_actually_occurred"]
                       and not e["private_source_or_checker_in_actor"]
                       for e in r["selected_executions"])
            print("ORIGINAL_NATIVE_REGRESSION_SUITABILITY",
                  json.dumps({k:v for k,v in r.items()
                              if k!="selected_executions"},sort_keys=True))
          PY
      - name: Source-native task compliance sensitivity vs actual allergen exposure safety
        shell: bash
        run: |
          set -euo pipefail
          python experiments/owi_ec005_realtools_native_preservation_gate.py \
            --lunch "build/owi_ec005_realtools/native_preservation_lunch.json" \
            --dinner "build/owi_ec005_realtools/native_preservation_dinner.json" \
            --output "build/owi_ec005_realtools/native_preservation_gate.json"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("build/owi_ec005_realtools/native_preservation_gate.json").read_text())
          assert r["contract"]=="OWI-EC005K-NATIVE-PRESERVATION-SUITABILITY/1"
          assert r["unmodified_original_native_terminal_checker"]
          assert not r["new_terminal_reward_used"]
          assert r["actual_source_executions"]==12
          assert r["native_contract_sensitive_mechanisms"]==["dinner"]
          assert r["native_contract_scoring_blind_spots"]==["lunch"]
          assert not r["lunch_cross_contact_exposure_regression_penalized"]
          assert r["dinner_service_unavailability_regression_penalized"]
          assert not r["native_health_harm_avoidance_established"]
          assert not r["all_original_task_safety_criteria_certified"]
          assert not r["outcome_only_reflective_control_established"]
          print("SOURCE_LOCKED_NATIVE_COMPLIANCE_AND_HAZARD_ADJUDICATION",
                json.dumps(r,sort_keys=True))
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owi-ec005k-postrepair-native-safety-contrast
          path: |
            build/owi_ec005_realtools/native_preservation_lunch.json
            build/owi_ec005_realtools/native_preservation_dinner.json
            build/owi_ec005_realtools/native_preservation_gate.json
          retention-days: 30
