name: OWI-EC005W original TRAIN review public preflight

on:
  pull_request:
    paths:
      - 'experiments/owi_ec005w_*.py'
      - 'tests/test_owi_ec005w_*.py'
      - 'governance/research/OWI_EC005W_*.json'
      - 'mathematics/research-notes/OWI-EC005W-*.md'
      - '.github/workflows/owi-ec005w-native-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-review-public-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Exact original pinned corpus and row710 public user task/source declared tools
        shell: bash
        run: |
          set -euo pipefail
          python experiments/owi_ec005w_review_public_preflight.py
