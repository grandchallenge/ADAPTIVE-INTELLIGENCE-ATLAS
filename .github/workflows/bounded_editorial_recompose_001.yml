name: Bounded editorial RC2 regeneration
on:
  push:
    branches:
      - editorial/atlas-reader-route-claim-packets-001

permissions:
  contents: write

jobs:
  recompose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python tools/build_editorial_candidate_rc2.py
      - run: python tools/build_editorial_candidate_rc2.py --check
      - run: python tools/validate_atlas.py
      - name: Commit only the generated TeX on this bounded branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manuscript/latex/atlas-v0.1.1-rc.2.tex
          if ! git diff --cached --quiet; then
            git commit -m "build(editorial): exact-source pedagogy RC2 recomposition"
            git push origin HEAD:refs/heads/editorial/atlas-reader-route-claim-packets-001
          fi
