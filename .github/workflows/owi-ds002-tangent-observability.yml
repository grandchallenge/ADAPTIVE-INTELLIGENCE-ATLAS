name: OWI-DS002 evaluator-only tangent observability

on:
  pull_request:
    paths:
      - 'experiments/owi_ds002_tangent_observability.py'
      - 'tests/test_owi_ds002_tangent_observability.py'
      - 'governance/ci_components/owi_ds002.json'
      - '.github/workflows/owi-ds002-tangent-observability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privileged-tangent-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned CPU PyTorch
        run: python -m pip install --no-cache-dir 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Differential permissions and paired-mechanism tests
        run: |
          python -m py_compile experiments/owi_ds002_tangent_observability.py tests/test_owi_ds002_tangent_observability.py
          python -m unittest discover -s tests -p 'test_owi_ds002_tangent_observability.py' -v
      - name: Execute five independently seeded privileged diagnostic runs
        shell: bash
        run: |
          set -euo pipefail
          for seed in 1 2 3 4 5; do
            python experiments/owi_ds002_tangent_observability.py \
              --seed "$seed" --pretrain 250 --train-examples 256 \
              --eval-examples 512 \
              --output "build/owi_ds002/tangent_diagnostic_seed_${seed}.json" \
              > "tangent_diagnostic_seed_${seed}.log"
          done
      - name: Aggregate held-out Brier and accuracy; no learned-controller claim
        run: |
          python - <<'PY'
          import json, statistics
          from pathlib import Path
          base = Path("build/owi_ds002")
          runs = [json.loads((base / f"tangent_diagnostic_seed_{s}.json").read_text())
                  for s in range(1,6)]
          variants = list(runs[0]["results"])
          aggregated = {}
          for k in variants:
              aggregated[k] = {metric: statistics.mean(
                  r["results"][k][metric] for r in runs)
                  for metric in ("heldout_accuracy", "heldout_brier", "heldout_auc")}
          evidence = {"role": "PRIVILEGED_EVALUATION_ONLY",
                      "seeds": [1,2,3,4,5], "aggregate": aggregated,
                      "status": "mechanism-label observability diagnostic ONLY",
                      "no_claims": ["outcome-only causal learner", "verified synthesis benefit",
                                    "equal-compute benefit", "self-model identification"]}
          (base / "tangent_diagnostic_summary.json").write_text(
              json.dumps(evidence, sort_keys=True, indent=2) + "\n")
          print(json.dumps(evidence, sort_keys=True))
          PY
      - name: Archive actual measurement and evaluator-only classification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owi-ds002-tangent-observability-five-seed
          path: |
            build/owi_ds002/tangent_diagnostic_*.json
            tangent_diagnostic_seed_*.log
          retention-days: 30
