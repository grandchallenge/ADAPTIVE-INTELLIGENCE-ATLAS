name: GEOM scoped RC2 recomposition
on:
  push:
    branches:
      - editorial/geom-domain-and-retraction-20261023
permissions:
  contents: write
jobs:
  recompose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python tools/build_editorial_candidate_rc2.py
      - run: python -m unittest discover -s tests -p test_geom_acceptance_405.py
      - run: git diff --check
      - name: Commit only recomposed editorial LaTeX
        run: |
          git add manuscript/latex/atlas-v0.1.1-rc.2.tex
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'editorial: reproducibly recompose GEOM RC2 TeX'
            git push origin HEAD:refs/heads/editorial/geom-domain-and-retraction-20261023
          fi
